<body>
<div id="root"></div>

<script type="text/plain" id="app-source">
const { useState, useMemo, useEffect, useCallback } = React;

// ── Utilities ──────────────────────────────────────────────────────────────

function parseDate(val) {
  if (!val) return null;
  const s = String(val).trim();
  // Time part, if any (24h or 12h with am/pm)
  const tm = s.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(am|pm)?/i);
  let hh = tm ? +tm[1] : 0, mi = tm ? +tm[2] : 0, ss = tm && tm[3] ? +tm[3] : 0;
  if (tm && tm[4]) { const pm = /pm/i.test(tm[4]); if (pm && hh < 12) hh += 12; if (!pm && hh === 12) hh = 0; }

  // YYYY-MM-DD  (ISO first, so it isn't mistaken for M-D-Y)
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3], hh, mi, ss);

  // M/D/YY, M/D/YYYY, MM-DD-YYYY — US order, 1- or 2-digit month/day,
  // 2- or 4-digit year. Covers both the old ServiceNow export format
  // (06-01-2026 10:49:05) and the current one (8/3/26 13:46).
  m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[1]-1, +m[2], hh, mi, ss); }

  return null;
}

// Interruption counts are written as prose as often as numbers:
//   "3  (RCA PRB0019048)"                    -> 3
//   "none in PROD in June 2026"              -> 0   (not 2026)
//   "None in PROD for the week of 8/2"       -> 0   (not 8)
// Strip years, dates and ticket references first, then take the first small
// number; if nothing numeric survives but the text says none/zero, it's 0.
function interruptionCount(v) {
  if (v == null) return null;
  const cleaned = String(v).toLowerCase()
    .replace(/\b(?:prb|ritm|inc|chg|task|crq)\s*0*\d+/g, ' ')      // ticket refs
    .replace(/\b\d{1,3}(?:\.\d+)?\s*%/g, ' ')                       // percentages
    .replace(/\b\d{1,2}\s*[\/-]\s*\d{1,2}(?:\s*[\/-]\s*\d{2,4})?\b/g, ' ') // dates
    .replace(/\b(?:19|20)\d{2}\b/g, ' ')                            // years
    .replace(/\bq[1-4]\b/g, ' ');
  const m = cleaned.match(/\b(\d{1,3})\b/);
  if (m) return parseInt(m[1], 10);
  if (/\b(none|no|nil|zero|n\s*\/?\s*a)\b/.test(cleaned)) return 0;
  return null;
}

// First integer in a string — "3  (RCA PRB0019048)" is 3 interruptions, not
// 30019048. Stripping every non-digit would swallow ticket numbers.
function firstInt(v) {
  if (!v) return null;
  const m = String(v).match(/\d+/);
  return m ? parseInt(m[0], 10) : null;
}

function daysAgo(val) {
  const d = parseDate(val);
  if (!d) return 999;
  // Compare calendar dates (strip time) so "days ago" counts whole days correctly
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const now = new Date();
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((b - a) / 86400000);
}

// Cadence rule: owners update each Thursday. An update is "on cadence" only if
// it lands on the most recent Wednesday or Thursday. Anything else — Friday,
// the weekend, or earlier than that Wednesday — is flagged.
function lastThursday(ref) {
  const d = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
  const diff = (d.getDay() - 4 + 7) % 7; // 4 = Thursday
  d.setDate(d.getDate() - diff);
  return d;
}

function isStale(val) {
  const d = parseDate(val);
  if (!d) return true;
  const upd = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const thu = lastThursday(new Date());
  const wed = new Date(thu); wed.setDate(thu.getDate() - 1);
  return upd !== thu.getTime() && upd !== wed.getTime();
}

function weekdayName(val) {
  const d = parseDate(val);
  if (!d) return '';
  return d.toLocaleDateString('en-US', { weekday: 'long' });
}

function formatDate(val) {
  const d = parseDate(val);
  if (!d) return '—';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' });
}

// Column names differ between the LOB-details export and the
// customer-relationship export (and have changed over time), so each logical
// field is resolved from a list of candidates, matched case-insensitively and
// ignoring the dotted table prefixes ServiceNow adds.
const COLUMN_MAP = {
  lob:         ['u_lob.u_lob_details', 'u_lob', 'lob'],
  customer:    ['u_customer_relationship.u_customer_account', 'u_lob.u_customer_account',
                'u_customer_account', 'customer_account', 'customer'],
  owner:       ['u_project_owner', 'assigned_to', 'owner', 'u_csdm'],
  manager:     ['assigned_to.manager', 'u_manager', 'manager'],
  sentiment:   ['u_lob.u_lob_details.u_status_overall', 'u_status_overall', 'status_overall'],
  operations:  ['u_lob.u_lob_details.u_status_operations', 'u_status_operations', 'status_operations'],
  updated:     ['u_lob.u_lob_details.sys_updated_on', 'sys_updated_on', 'sys_updated', 'updated'],
  contractEnd: ['u_customer_relationship.u_contract_end', 'u_contract_end', 'u_lob.u_contract_end', 'contract_end'],
  status:      ['u_lob.u_lob_details.u_lob_status', 'u_lob_status', 'lob_status'],
  description: ['u_project_description', 'short_description', 'description'],
  // Present only in the customer-relationship export; harmless when absent
  crelNumber:  ['number', 'u_crel_number'],
  phase:       ['u_lob.u_lob_details.u_phase', 'u_phase'],
  state:       ['state', 'u_state'],
  region:      ['u_region', 'u_crel_country', 'u_territory'],
  country:     ['u_crel_country'],
  techLead:    ['u_primary_cloud_tech_lead'],
  platform:    ['u_crel_sas_sw_platform_version'],
  solution:    ['u_crel_sas_solution'],
  hosting:     ['u_crel_hosting_location'],
  restricted:  ['u_project_restrictions.u_legal_status_restrictions'],
  restrictType:['u_project_restrictions.u_legal_status_restriction_type'],
  geoAllowed:  ['u_project_restrictions.u_geographies_allowed'],
};

function pickCol(r, names) {
  for (const n of names) {
    if (r[n] !== undefined && String(r[n]).trim() !== '') return String(r[n]).trim();
  }
  // Fall back to a case/prefix-insensitive scan so a renamed or re-prefixed
  // column still resolves instead of silently coming back empty.
  const want = names.map(n => n.toLowerCase().replace(/^.*\./, ''));
  for (const key of Object.keys(r)) {
    const bare = key.toLowerCase().replace(/^.*\./, '');
    if (want.includes(bare) && String(r[key] || '').trim() !== '') return String(r[key]).trim();
  }
  return '';
}

function normalizeRow(r) {
  const out = {};
  Object.entries(COLUMN_MAP).forEach(([k, names]) => { out[k] = pickCol(r, names); });
  out.sentiment = out.sentiment || 'Green';
  out.operations = out.operations || 'Green';
  out.status = (out.status || '').replace(/\r\n?/g, '\n').trim();
  return out;
}

function clean(v) {
  if (v == null) return null;
  v = String(v).trim();
  const low = v.toLowerCase().replace(/[.\s]/g, '');
  if (!v || ['na','n/a','none','no','-'].includes(low)) return null;
  return v;
}

// True when an Issues/Concerns entry is really a "nothing to report" note
// (e.g. "No issues", "No customer issues", "None at this time", "Nothing to report").
function isNoIssues(v) {
  if (!v) return true;
  const s = v.trim().toLowerCase().replace(/[.\u2013\-]/g, ' ').replace(/\s+/g, ' ').trim();
  if (['no','none','nil','na','n a'].includes(s)) return true;
  if (/^(no|none|nil|nothing)\b/.test(s) && /(issue|concern|risk|report|problem)/.test(s) && s.split(' ').length <= 6) return true;
  return false;
}

// True when a field contains placeholder or non-answer text
function isPlaceholder(v) {
  if (!v) return false;
  const s = v.trim().toLowerCase();
  if (['tbd','tbc','to be determined','to be confirmed','pending'].includes(s)) return true;
  if (v.includes('- version, date, contract needs:') && v.trim().startsWith('- version')) return true;
  return false;
}

// True when weekly wins is clearly filler rather than real accomplishments
function isThinFiller(v) {
  if (!v) return false;
  if (v.trim().length < 30) return true;
  const s = v.trim().toLowerCase();
  return /^(no major issues?|no issues? or incidents?|system(s)? (is |are )?(stable|healthy|operational|running)|nothing (new|to report|significant)|all systems? (up|green|operational|normal)|no updates? this week|no significant (updates?|changes?)|no new (updates?|issues?))/.test(s);
}

// ── Robust status parsing ──────────────────────────────────────────────────
// CSDMs write these updates by hand, so the template drifts: headings appear
// out of order, sections get renamed, colons become semicolons, words get
// misspelled, and some updates are free prose with no headings at all.
//
// The parser therefore does NOT slice the text by fixed section order. It
// builds an index of every "Label: value" line it can find, fuzzy-matches each
// label to a canonical field, and uses the nearest preceding section header to
// disambiguate repeated labels like "Link". Compliance is judged separately
// (see computeCompliance) so that a usable value is still extracted from an
// update that is technically out of spec.

const SECTION_DEFS = [
  { key: 'weekly',        label: 'Weekly Update',          aliases: ['weekly update','weekly status'] },
  { key: 'shr',           label: 'Service Health Reviews', aliases: ['service health reviews','service health review','shr'] },
  { key: 'customerHealth',label: 'Customer Health',        aliases: ['customer health'] },
  { key: 'profitability', label: 'Profitability',          aliases: ['profitability','financial performance'] },
  { key: 'lifecycle',     label: 'Lifecycle Planning',     aliases: ['lifecycle planning','lifecycle roadmap','lifecycle management planning','lifecycle'] },
  { key: 'renewal',       label: 'Renewal Status',         aliases: ['renewal status','renewal','renewal state','renewal planning','contract renewal','renewal info'] },
];

// section: which section the field belongs to (used to disambiguate and for
// compliance ordering). ambiguous: label alone is not enough, needs section.
const FIELD_DEFS = [
  { key:'reportedDate', label:'Date', section:'weekly', multiline:false,
    aliases:['date','updated date','update date','status update date','last updated','date of update','status date'] },
  { key:'weeklyWins', label:'Weekly Accomplishments', section:'weekly', multiline:true,
    aliases:['weekly accomplishments','weekly accomplishment','weekly accomplishments update','weekly accomplishments updates',
             'key accomplishments this week','accomplishments','last week achievements','weekly wins','weekly win',
             'current activities weekly accomplishments','current status accomplishments','weekly updates'] },
  { key:'issues', label:'Issues/Concerns', section:'weekly', multiline:true,
    aliases:['issues concerns','issues risks','issues','concerns','risks','main risks','issues and concerns','issues or concerns','key risks'] },
  { key:'changes', label:'Changes', section:'weekly', multiline:true,
    aliases:['changes','change'] },
  { key:'upcoming', label:'Upcoming Milestones', section:'weekly', multiline:true,
    aliases:['upcoming milestones','upcoming milestone','key milestones','key milestones and activities','key milestones activities',
             'milestones wins','upcoming activities milestones','milestones','upcoming activities'] },
  { key:'nextFocus', label:"Next Week's Focus", section:'weekly', multiline:true,
    aliases:['next weeks focus','next week focus','next week s focus','upcoming focus','focus','next focus','next weeks priorities',
             'next weeks','next week','next weeks s focus','next week s upcoming activities','next weeks activities'] },

  { key:'frequency', label:'Frequency of Service Health Reviews', section:'shr', multiline:false,
    aliases:['frequency of service health reviews','frequency of service health review','frequency','review frequency',
             'monthly service health review meetings cx dashboard'] },
  { key:'completed', label:'Completed This Period?', section:'shr', multiline:false,
    aliases:['completed this period','service health review completed this period','completed this period yes no'] },
  { key:'participation', label:'Customer Participation', section:'shr', multiline:true,
    aliases:['customer participation','service health review participation','participation'] },
  { key:'shrLink', label:'SHR Link', section:'shr', multiline:false, ambiguous:true,
    aliases:['link','links','cx dashboard','dashboard link'] },

  { key:'sla', label:'SLA', section:'customerHealth', multiline:false,
    aliases:['sla','sla attainment','sla performance','contract sla','sla status'] },
  { key:'interruptions', label:'Service Interruptions (3mo)', section:'customerHealth', multiline:false,
    aliases:['number of service interruptions last 3 months','service interruptions over last 3 months',
             'services interruptions over last 3 months','number of service interruptions','service interruptions',
             'interruptions','number of service interruptions impacting sla customer temperature or sentiment over last 3 months'] },
  { key:'meetingNotesLink', label:'Weekly Meeting Notes Link', section:'customerHealth', multiline:false,
    aliases:['weekly meeting notes link','meeting notes link','weekly meeting notes','meeting notes'] },

  { key:'profitabilityLink', label:'Profitability Link', section:'profitability', multiline:false, ambiguous:true,
    aliases:['link','profitability link','links'] },

  { key:'currentVersions', label:'Current Versions', section:'lifecycle', multiline:false,
    aliases:['current versions','current version','current versions prod dev','current version prod','current version test','versions'] },
  { key:'nextVersion', label:'Next Version or Decommission Plan', section:'lifecycle', multiline:true,
    aliases:['next version or decommission plan','next version plan','next version','next versions','target version',
             'next version or decommission','decommission plan'] },

  { key:'within9mo', label:'Within 9 Months of Contract End?', section:'renewal', multiline:false,
    aliases:['within 9 month of contract end','within 9 months of contract end','within 9 months','within 9 month',
             'within 9 months of renewal','within nine months of contract end','9 months of contract end'] },
  { key:'renewalFeedback', label:'Customer Feedback', section:'renewal', multiline:true,
    aliases:['customer feedback','customer feedback renewing renewal at risk or lower price point non renewal or cancellation',
             'renewal feedback','customer renewal feedback'] },
  { key:'renewalNextSteps', label:'Next Steps', section:'renewal', multiline:true,
    aliases:['next steps','next step','nextsteps'] },
  { key:'renewalLink', label:'Link to Renewal Presentation/Form', section:'renewal', multiline:false,
    aliases:['link to renewal presentation form','link to renewal materials','renewal link','renewal materials',
             'link to renewal','renewal presentation'] },
];

// Canonical template order, used only for compliance reporting
const TEMPLATE_ORDER = ['weeklyWins','issues','changes','upcoming','nextFocus',
  'frequency','completed','participation','shrLink','sla','interruptions','meetingNotesLink',
  'profitabilityLink','currentVersions','nextVersion','within9mo','renewalFeedback','renewalNextSteps','renewalLink'];

// Strip punctuation and collapse whitespace so "Issues/Concerns:" and
// "Issues  Concerns ;" normalize to the same key.
function normLabel(s) {
  return String(s || '')
    .toLowerCase()
    .replace(/[\u2018\u2019']/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

// Levenshtein distance, capped — used so ordinary typos still match.
function editDistance(a, b, cap) {
  if (Math.abs(a.length - b.length) > cap) return cap + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      if (cur[j] < best) best = cur[j];
    }
    if (best > cap) return cap + 1;
    prev = cur;
  }
  return prev[b.length];
}

// Match a raw label to a canonical field. Returns {def, exact} or null.
// `section` is the section the line sits under, used for ambiguous labels.
// Rules are deliberately conservative: a generic word must match an alias
// exactly, and only long labels are allowed to match by prefix or edit
// distance. Loose containment matching pulled in whole sentences.
function matchField(rawLabel, section) {
  const n = normLabel(rawLabel);
  if (!n || n.length > 110) return null;
  // A label that is mostly digits/ticket refs is prose, not a heading
  if (!/[a-z]{3}/.test(n)) return null;
  const inSection = d => !d.section || !section || d.section === section;
  const pickFrom = cands => {
    const scoped = cands.filter(inSection);
    const pick = scoped[0] || cands.find(d => !d.ambiguous) || cands[0];
    if (!pick) return null;
    if (pick.ambiguous && !scoped.length) return null; // bare "Link" with no section
    return pick;
  };

  // 1. exact alias match
  let cands = FIELD_DEFS.filter(d => d.aliases.includes(n));
  if (cands.length) { const p = pickFrom(cands); if (p) return { def: p, exact: true, alias: n }; }

  // 2. label carries extra trailing text ("Within 9 month of contract end? NA")
  cands = FIELD_DEFS.filter(d => d.aliases.some(a => a.length >= 10 && n.startsWith(a)));
  if (cands.length) { const p = pickFrom(cands); if (p) return { def: p, exact: false, alias: n }; }

  // 3. label is a shortened form of a longer heading ("Next Weeks" for
  //    "Next Week's Focus", "Completed this period" for the full line).
  //    Requires two or more words so a generic single word like "Renewal"
  //    cannot claim "Renewal feedback".
  cands = FIELD_DEFS.filter(d => d.aliases.some(a =>
    n.length >= 9 && n.includes(' ') && a.length > n.length && a.startsWith(n)));
  if (cands.length) { const p = pickFrom(cands); if (p) return { def: p, exact: false, alias: n }; }

  // 4. ordinary typos ("Upcoming Milesonts")
  let best = null, bestD = Infinity;
  FIELD_DEFS.forEach(d => {
    if (d.ambiguous) return;
    d.aliases.forEach(a => {
      if (a.length < 8 || n.length < 8) return;
      if (Math.abs(a.length - n.length) > 3) return;
      const dist = editDistance(n, a, 2);
      if (dist <= 2 && dist < bestD) { bestD = dist; best = d; }
    });
  });
  if (best) return { def: best, exact: false, alias: n };
  return null;
}

function matchSection(line) {
  const n = normLabel(line);
  if (!n || n.length > 44) return null;
  for (const s of SECTION_DEFS) if (s.aliases.includes(n)) return s;
  for (const s of SECTION_DEFS) {
    for (const a of s.aliases) {
      if (a.length >= 8 && (n === a || n.startsWith(a))) return s;
      if (a.length >= 8 && editDistance(n, a, 2) <= 2) return s;
    }
  }
  return null;
}

// Core scan: walk the text line by line building a label index.
function indexStatus(text) {
  const src = String(text || '').replace(/\r\n?/g, '\n');
  const lines = src.split('\n');
  const entries = [];   // {key, def, rawLabel, value, line, section, exact}
  const sectionsSeen = [];
  let section = 'weekly';
  let current = null;   // entry currently collecting continuation lines

  const flush = () => {
    if (current) { current.value = current.buf.join('\n').trim(); delete current.buf; entries.push(current); current = null; }
  };

  lines.forEach((raw, i) => {
    const line = raw.replace(/\s+$/, '');
    const trimmed = line.trim();

    // A bare section header on its own line
    const bare = trimmed && !/[:;]/.test(trimmed) ? matchSection(trimmed) : null;
    if (bare) {
      flush();
      section = bare.key;
      if (!sectionsSeen.some(s => s.key === bare.key)) sectionsSeen.push({ key: bare.key, line: i });
      return;
    }

    // The dashed divider closes the weekly block — never let it become part
    // of the preceding field's value.
    if (/^[\-_=]{5,}$/.test(trimmed)) { flush(); return; }

    // Split a line into label + value. Three accepted separators:
    //   "Label: value"  "Label; value"  and  "Label? value"
    // The question form matters because the template's own wording ends in a
    // question mark and many CSDMs answer it without adding a colon at all
    // ("Within 9 month of contract end? Yes", "Completed this period? Yes").
    let rawLabel = null, rest = null;
    let m = trimmed.match(/^[\-\*\u2022\s]*([A-Za-z][^:;\n]{1,110}?)\s*[:;]\s*(.*)$/);
    if (m) { rawLabel = m[1].trim(); rest = m[2]; }
    else {
      m = trimmed.match(/^[\-\*\u2022\s]*([A-Za-z][^:;?\n]{1,110}\?)\s*(.*)$/);
      if (m) { rawLabel = m[1].trim(); rest = m[2]; }
    }

    if (rawLabel !== null) {
      // A section name written as a label ("Renewal Status:") switches section
      const asSection = matchSection(rawLabel);
      const hit = matchField(rawLabel, asSection ? asSection.key : section);
      if (asSection && (!hit || !hit.exact)) {
        flush();
        section = asSection.key;
        if (!sectionsSeen.some(s2 => s2.key === asSection.key)) sectionsSeen.push({ key: asSection.key, line: i });
        return;                       // never also treat it as a field
      }
      if (hit) {
        flush();
        if (hit.def.section && hit.def.section !== section && !hit.def.ambiguous) {
          section = hit.def.section;
          if (!sectionsSeen.some(s2 => s2.key === section)) sectionsSeen.push({ key: section, line: i });
        }
        current = { key: hit.def.key, def: hit.def, rawLabel, exact: hit.exact,
                    section, line: i, buf: [rest] };
        // Single-line fields normally end at the label line. But CSDMs often
        // write the label alone and put the value underneath —
        //   "Current Versions:"
        //   "PROD stable on Viya 2026.06"
        // — so when nothing follows the separator, keep collecting until the
        // next label. Treating that as blank produced false "not documented"
        // flags on updates that plainly had the information.
        if (!hit.def.multiline && String(rest).trim() !== '') flush();
        return;
      }
      // Unrecognised label ends any multiline capture so we don't swallow it
      flush();
      return;
    }

    if (current) current.buf.push(line);
  });
  flush();

  // First occurrence wins for each field
  const fields = {};
  const meta = {};
  entries.forEach(e => {
    if (fields[e.key] === undefined || fields[e.key] === null || fields[e.key] === '') {
      fields[e.key] = e.value;
      meta[e.key] = { rawLabel: e.rawLabel, exact: e.exact, line: e.line, section: e.section };
    }
  });

  return { fields, meta, entries, sectionsSeen, lines: src };
}

// Reconstruct the raw text of one section (used for the Renewals tab)
function sectionText(idx, sectionKey) {
  const lines = idx.lines.split('\n');
  const starts = idx.sectionsSeen.map(s => s.line).sort((a,b) => a-b);
  const s = idx.sectionsSeen.find(x => x.key === sectionKey);
  if (s) {
    const next = starts.find(l => l > s.line);
    return lines.slice(s.line + 1, next === undefined ? lines.length : next).join('\n').trim();
  }
  // No header found — fall back to the span covered by that section's fields
  const own = idx.entries.filter(e => e.def.section === sectionKey);
  if (!own.length) return '';
  const lo = Math.min(...own.map(e => e.line));
  const hi = Math.max(...own.map(e => e.line));
  return lines.slice(lo, hi + 3).join('\n').trim();
}


// Public shape kept identical to the previous rigid parser so every downstream
// view keeps working; values now come from the tolerant label index.
function parseStatus(status) {
  if (!status) return {};
  const idx = indexStatus(status);
  const f = idx.fields;
  const get = k => clean(f[k]);
  // Yes/no fields: "No" is a real answer, not an empty value, so these keep
  // whatever the CSDM wrote instead of being blanked out by clean().
  const keep = k => {
    const v = f[k];
    if (v === undefined || v === null) return null;
    const s = String(v).trim();
    return s === '' || s === '-' ? null : s;
  };
  const out = {
    reportedDate: get('reportedDate'),
    weeklyWins:   get('weeklyWins'),
    issues:       (() => { const v = clean(f.issues); return isNoIssues(v) ? null : v; })(),
    changes:      get('changes'),
    upcoming:     get('upcoming'),
    nextFocus:    get('nextFocus'),
    frequency:    get('frequency'),
    completed:    keep('completed'),
    participation:keep('participation'),
    shrLink:      get('shrLink'),
    sla:          get('sla'),
    interruptions:keep('interruptions'),
    meetingNotesLink: get('meetingNotesLink'),
    profitabilityLink:get('profitabilityLink'),
    currentVersions:  get('currentVersions'),
    nextVersion:  get('nextVersion'),
    within9mo:    keep('within9mo'),
    renewalFeedback:  get('renewalFeedback'),
    renewalNextSteps: get('renewalNextSteps'),
    renewalLink:  get('renewalLink'),
    renewalRaw:   sectionText(idx, 'renewal'),
    _idx: idx,
  };
  return out;
}

// CONTENT check: which template fields the CSDM left blank. A written
// "No"/"None"/"N/A"/"0" counts as answered — only a truly empty field is
// reported. Issues/Concerns is excluded because blank means "no issues".
function computeMissing(status) {
  if (!status || status.trim().length < 20) return [{ key: 'all', label: 'Entire update is blank' }];
  const idx = indexStatus(status);
  const raw = idx.fields;
  const present = k => raw[k] !== undefined && String(raw[k]).trim() !== '' && String(raw[k]).trim() !== '-';
  const within9 = /yes/i.test(String(raw.within9mo || ''));
  const wanted = TEMPLATE_ORDER.filter(k => {
    if (k === 'issues') return false;
    if (['renewalFeedback','renewalNextSteps','renewalLink'].includes(k)) return within9;
    return true;
  });
  return wanted.filter(k => !present(k))
    .map(k => ({ key: k, label: (FIELD_DEFS.find(d => d.key === k) || {}).label || k }));
}

// Intentional pointer / non-tracked records that shouldn't be judged on the
// template: MPD and MPT both just say "SEE MPM", and anything explicitly
// marked "IGNORE LOB" (e.g. ALV, tracked in PPM). These are excluded from
// template compliance.
// Whether an account is expected to keep LOB.Details current.
// Operations and Hybrid are live and must maintain a status, so they are
// scored for template compliance. A project still in Implementation on both
// the LOB phase and the CREL state isn't expected to have one yet — its status
// is shown but never scored. Anything else (On Hold, Delivery, or a phase and
// state that disagree) is also left unscored, but labelled with the reason so
// it isn't silently dropped.
function phaseScope(row) {
  const phase = (row.phase || '').trim();
  const state = (row.state || '').trim();
  const p = phase.toLowerCase(), s = state.toLowerCase();
  if (isPointerLob(row))
    return { phase, state, scored: false, reason: 'Pointer/ignore record', kind: 'pointer' };
  if (p === 'operations' || p === 'hybrid')
    return { phase, state, scored: true, reason: `${phase} — status expected`, kind: 'live' };
  if (p === 'implementation' && s === 'implementation')
    return { phase, state, scored: false, reason: 'Implementation — status not expected yet', kind: 'impl' };
  if (!phase && !state)
    return { phase, state, scored: true, reason: 'No phase recorded — scored by default', kind: 'live' };
  return { phase, state, scored: false, reason: `${phase || '—'} / ${state || '—'} — not scored`, kind: 'other' };
}

// A project sitting in Implementation on both the LOB phase and the CREL
// state isn't expected to post a weekly update yet. Neither is a pointer
// record ("IGNORE LOB", "SEE MPM") whose status is deliberately maintained
// elsewhere. Neither can be off cadence, and neither gets coached.
function expectsUpdate(row) {
  const k = phaseScope(row).kind;
  return k !== 'impl' && k !== 'pointer';
}

function isOffCadence(row) {
  return expectsUpdate(row) && isStale(row.updated);
}

function isPointerLob(row) {
  if (!row) return false;
  const s = (row.status || '');
  if (/\bsee\s+mpm\b/i.test(s)) return true;
  if (/ignore\s+lob/i.test(s) || /ignore\s+lob/i.test(row.description || '')) return true;
  if (/tracked in ppm/i.test(row.description || '') && s.trim().length < 120) return true;
  return false;
}

// Checks a status update against the standard LOB template and returns the
// ways it deviates, as {sev, msg}. 'major' = a required heading/section is
// missing entirely; 'minor' = a non-standard label was used in its place.
// This is about FORMAT (did they follow the template?), separate from
// computeMissing which is about CONTENT (did they fill a field in?).
function checkTemplate(status, row) {
  // Skip intentional pointer/ignore records entirely.
  if (isPointerLob(row || { status })) return [];
  if (!status || status.trim().length < 20)
    return [{ sev: 'major', msg: 'No content to check against the template' }];

  const idx = indexStatus(status);
  const d = [];

  // What compliance judges, and deliberately does not:
  //   • judged  — heading missing entirely, heading in the wrong place/order,
  //               a non-standard heading name (e.g. "Risks" for "Issues/Concerns")
  //   • ignored — ":" vs ";" vs "?" as the separator, capitalisation, spacing,
  //               and ordinary spelling slips. Those are noise, not process.
  const present = k => idx.fields[k] !== undefined;
  const meta = k => idx.meta[k];

  // Heading presence, in the canonical template sequence
  const REQUIRED = [
    { key:'weeklyWins',       label:'Weekly Accomplishments',            sev:'major' },
    { key:'issues',           label:'Issues/Concerns',                   sev:'major' },
    { key:'changes',          label:'Changes',                           sev:'minor' },
    { key:'upcoming',         label:'Upcoming Milestones',               sev:'minor' },
    { key:'nextFocus',        label:"Next Week's Focus",                 sev:'major' },
    { key:'frequency',        label:'Frequency of service health reviews',sev:'minor' },
    { key:'completed',        label:'Completed this period?',            sev:'minor' },
    { key:'participation',    label:'Customer Participation',            sev:'minor' },
    { key:'sla',              label:'SLA',                               sev:'minor' },
    { key:'interruptions',    label:'Number of service interruptions',   sev:'minor' },
    { key:'currentVersions',  label:'Current Versions',                  sev:'minor' },
    { key:'nextVersion',      label:'Next Version or Decommission plan', sev:'minor' },
    { key:'within9mo',        label:'Within 9 month of contract end?',   sev:'major' },
    { key:'renewalFeedback',  label:'Customer feedback',                 sev:'minor' },
    { key:'renewalNextSteps', label:'Next steps',                        sev:'minor' },
  ];

  REQUIRED.forEach(r => {
    if (!present(r.key)) d.push({ sev: r.sev, msg: `Missing the "${r.label}" heading` });
  });

  // Standing section headers. A section counts as present if its header is
  // there OR if any field belonging to it was filled in — a CSDM who wrote
  // "Profitability Link: <url>" without a separate "Profitability" header has
  // supplied the section's content, which is what actually matters.
  const SECTIONS = [
    { key:'shr',            label:'Service Health Reviews' },
    { key:'customerHealth', label:'Customer Health' },
    { key:'profitability',  label:'Profitability' },
    { key:'lifecycle',      label:'Lifecycle Planning' },
    { key:'renewal',        label:'Renewal Status' },
  ];
  const seen = idx.sectionsSeen.map(s => s.key);
  SECTIONS.forEach(s => {
    const headerSeen = seen.includes(s.key);
    const hasContent = FIELD_DEFS.some(f => f.section === s.key && present(f.key));
    if (!headerSeen && !hasContent)
      d.push({ sev: 'major', msg: `Missing the "${s.label}" section header` });
  });

  // Deliberately NOT flagged: section ordering, heading wording variants,
  // separator style (":" / ";" / "?"), capitalisation, spelling slips, and the
  // dashed divider. The values are read wherever they appear, so those are
  // formatting noise rather than a process gap. Only genuinely absent sections
  // and lines count against a CSDM.

  return d;
}

// Analyze an account and return flagged observations.
// Types: 'alert' (urgent/risk), 'warn' (discussion topic), 'info' (FYI),
//        'fix' (CSDM needs to correct their update),
//        'template' (CSDM is not following the standard template)
function analyzeAccount(row, sections) {
  const flags = [];
  const days = daysAgo(row.updated);
  const { issues, upcoming, nextFocus, interruptions, within9mo,
          renewalFeedback, renewalNextSteps, nextVersion,
          currentVersions, weeklyWins } = sections;

  // ── Cadence ──────────────────────────────────────────────────────────────
  // Implementation-phase projects aren't expected to post weekly yet, so no
  // cadence flag applies to them at all.
  if (expectsUpdate(row)) {
    if (!row.updated || days === 999)
      flags.push({ type: 'alert', msg: 'No update date recorded — was LOB Details updated?' });
    else if (isOffCadence(row))
      flags.push({ type: 'alert', msg: `Last updated ${weekdayName(row.updated)}, ${formatDate(row.updated)} (${days}d ago) — off the Wed/Thu cadence` });
  }

  if (!row.status || row.status.trim().length < 50)
    flags.push({ type: 'alert', msg: 'Status field is empty or very thin — needs meaningful content' });

  // The CSDM stamps a "Date:" at the top of the template. If the record was
  // touched on cadence but that date is stale, the content is likely carried
  // over from a previous week rather than genuinely refreshed.
  if (sections.reportedDate && expectsUpdate(row)) {
    const rd = parseDate(sections.reportedDate);
    if (rd && isStale(sections.reportedDate) && row.updated && !isOffCadence(row))
      flags.push({ type: 'warn', msg: `Record updated on cadence but the update is dated ${formatDate(sections.reportedDate)} — is this content carried over from a prior week?` });
  }

  // ── Status consistency ────────────────────────────────────────────────────
  if (issues && row.sentiment === 'Green')
    flags.push({ type: 'warn', msg: 'Issues listed but Customer Sentiment is Green — may be understating risk' });
  if (issues && row.operations === 'Green')
    flags.push({ type: 'warn', msg: 'Issues listed but Operations is Green — ops status may need updating' });

  const isYellow = row.sentiment !== 'Green' || row.operations !== 'Green';
  if (isYellow && !issues) {
    const which = row.sentiment !== 'Green' && row.operations !== 'Green'
      ? 'Sentiment and Operations are both non-green'
      : row.sentiment !== 'Green' ? `Customer Sentiment is ${row.sentiment}`
      : `Operations is ${row.operations}`;
    flags.push({ type: 'warn', msg: `${which} but no Issues/Concerns documented — what is driving this?` });
  }

  // ── Issues without action plan ────────────────────────────────────────────
  if (issues && !upcoming && !nextFocus)
    flags.push({ type: 'warn', msg: 'Issues documented but no Upcoming Milestones or Next Week\'s Focus — no visible action plan' });

  // ── Service health ────────────────────────────────────────────────────────
  if (interruptions) {
    const n = interruptionCount(interruptions);
    if (!isNaN(n) && n >= 3)
      flags.push({ type: 'warn', msg: `${n} service interruptions in past 3 months — discuss impact and resolution plan` });
  }
  if (sections.sla) {
    const pct = parseFloat(sections.sla.replace(/[^0-9.]/g, ''));
    if (!isNaN(pct) && pct < 99.0)
      flags.push({ type: 'warn', msg: `SLA at ${sections.sla} — below 99% threshold, discuss impact with CSDM` });
  }

  // ── Renewal ───────────────────────────────────────────────────────────────
  const isWithin9 = within9mo && within9mo.toLowerCase().includes('yes');
  const fbLow = (renewalFeedback || '').toLowerCase();
  const nonRenewal = /non-renewal|not renewing|cancell?ation|will not renew|decommission/.test(fbLow);

  if (nonRenewal) {
    flags.push({ type: 'alert', msg: 'Customer feedback indicates NON-RENEWAL or cancellation' });
    if (!renewalNextSteps || isPlaceholder(renewalNextSteps))
      flags.push({ type: 'alert', msg: 'Non-renewal confirmed but no next steps documented — what is the offboarding/retention plan?' });
    if (row.sentiment === 'Green' && row.operations === 'Green')
      flags.push({ type: 'warn', msg: 'Non-renewal confirmed but both statuses are Green — should status reflect the situation?' });
  } else if (isWithin9) {
    if (!renewalFeedback || isPlaceholder(renewalFeedback))
      flags.push({ type: 'warn', msg: 'Within 9 months of contract end — no clear renewal feedback; where does the customer stand?' });
    else if (!renewalNextSteps || isPlaceholder(renewalNextSteps))
      flags.push({ type: 'warn', msg: 'Within 9 months of contract end — renewal feedback present but next steps are missing or TBD' });
    else
      flags.push({ type: 'info', msg: `Renewal in progress — next steps: ${snip(renewalNextSteps, 100)}` });
  }

  // ── Update quality (CSDM to fix) ──────────────────────────────────────────
  // Skipped for anything not expected to report (Implementation, or a pointer
  // record tracked elsewhere) — blank template fields are not a gap there.
  if (!expectsUpdate(row)) return flags;
  const missing = computeMissing(row.status);
  const mk = new Set(missing.map(m => m.key));

  if (mk.has('weeklyWins'))
    flags.push({ type: 'fix', msg: 'Weekly Accomplishments not filled in — CSDM to complete' });
  else if (weeklyWins && isThinFiller(weeklyWins))
    flags.push({ type: 'fix', msg: `Weekly Accomplishments looks like filler ("${weeklyWins.trim().substring(0, 60).replace(/\n/g,' ')}...") — should reflect actual work done` });

  if (mk.has('changes'))
    flags.push({ type: 'fix', msg: 'Changes section blank — CSDM to complete' });
  if (mk.has('upcoming'))
    flags.push({ type: 'fix', msg: 'Upcoming Milestones blank — CSDM to complete' });
  if (mk.has('nextFocus'))
    flags.push({ type: 'fix', msg: "Next Week's Focus blank — CSDM to complete" });
  if (mk.has('within9mo'))
    flags.push({ type: 'fix', msg: 'Within 9 Months of Contract End? not answered — required field' });
  if (mk.has('interruptions'))
    flags.push({ type: 'fix', msg: 'Service interruptions count not documented' });
  if (mk.has('sla'))
    flags.push({ type: 'fix', msg: 'SLA not documented' });

  if (nextVersion && isPlaceholder(nextVersion))
    flags.push({ type: 'fix', msg: 'Next Version/Decommission Plan still contains template placeholder text' });
  if (currentVersions && isPlaceholder(currentVersions))
    flags.push({ type: 'fix', msg: 'Current Versions contains placeholder text — CSDM to fill in actual versions' });
  if (isWithin9 && renewalFeedback && isPlaceholder(renewalFeedback))
    flags.push({ type: 'fix', msg: 'Renewal feedback is "TBD" — needs real customer sentiment documented' });
  if (isWithin9 && renewalNextSteps && isPlaceholder(renewalNextSteps))
    flags.push({ type: 'fix', msg: 'Renewal next steps is "TBD" — needs actionable steps documented' });

  // Remaining blank fields grouped
  const otherMissing = missing.filter(m =>
    !['weeklyWins','changes','upcoming','nextFocus','within9mo','interruptions','sla'].includes(m.key));
  if (otherMissing.length)
    flags.push({ type: 'fix', msg: `Also blank: ${otherMissing.map(m => m.label).join(', ')}` });

  // Template adherence is deliberately NOT repeated here. It has its own tab,
  // where it is scored by phase and reviewed account by account. Duplicating
  // it into the 1:1 material buried the coaching points under format nits.

  return flags;
}

// Parse a date written in any of the loose formats CSDMs use
function parseLooseDate(str) {
  if (!str) return null;
  let m = str.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000;
    return `${y}-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`; }
  m = str.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}

// Pull a contract end / renewal date out of the Renewal Status section.
// CSDMs record this inconsistently — on its own "Renewal Date:" line, tacked
// onto the 9-month answer, buried in Next steps as "CREL End date", or as a
// bare quarter or year. Returns the best available with how precise it is.
function extractContractEnd(renew) {
  if (!renew) return { label: null, iso: null, src: null, precision: 'none' };
  const pats = [
    [/(?:CREL\s+)?(?:Contract|CREL)\s+End\s+Date\s*:?\s*([^\n]{0,40})/i, 'Contract end date'],
    [/Renewal\s+Date\s*:?\s*([^\n]{0,40})/i, 'Renewal date'],
    [/Renewal\s+date\s+([0-9\/\-]{6,12})/i, 'Renewal date'],
    [/contract\s+end(?:s|ing)?\s*(?:on|:)?\s*([0-9\/\-]{6,12})/i, 'Contract end'],
  ];
  for (const [re, src] of pats) {
    const m = renew.match(re);
    if (m) { const iso = parseLooseDate(m[1]); if (iso) return { label: m[1].trim().replace(/[.,;]$/,''), iso, src, precision: 'exact' }; }
  }
  const q = renew.match(/\b(Q[1-4])\s*(?:of\s*)?(20\d\d)\b/i);
  if (q) return { label: `${q[1].toUpperCase()} ${q[2]}`, iso: null, src: 'Quarter stated', precision: 'quarter' };
  const any = parseLooseDate(renew);
  if (any) return { label: any, iso: any, src: 'Date found in section', precision: 'exact' };
  const yr = renew.match(/\b(20\d\d)\b/);
  if (yr) return { label: yr[1], iso: null, src: 'Year only', precision: 'year' };
  return { label: null, iso: null, src: null, precision: 'none' };
}

// Contract end, preferring the real ServiceNow field
// (u_customer_relationship.u_contract_end) and falling back to whatever the
// CSDM typed into the Renewal Status text when that column isn't exported.
function resolveContractEnd(row, s) {
  if (row && row.contractEnd) {
    const d = parseDate(row.contractEnd) || (parseLooseDate(row.contractEnd) ? new Date(parseLooseDate(row.contractEnd) + 'T00:00:00') : null);
    if (d && !isNaN(d)) {
      const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      return { label: iso, iso, src: 'Contract end field', precision: 'exact', fromField: true };
    }
  }
  const e = extractContractEnd(s ? s.renewalRaw : null);
  return { ...e, fromField: false };
}

// Trim to a word boundary rather than slicing mid-word
function snip(v, n) {
  if (!v) return v;
  const s = String(v).replace(/\s+/g, ' ').trim();
  if (s.length <= n) return s;
  const cut = s.slice(0, n);
  const sp = cut.lastIndexOf(' ');
  return (sp > n * 0.6 ? cut.slice(0, sp) : cut).replace(/[.,;:\-–]$/, '') + '…';
}

// ── CREL attribute helpers ─────────────────────────────────────────────────

// Platform version, flagged when the account still carries a legacy stack.
// The field can list several ("9.x, Viya 4.x"), so legacy wins for display.
function platformInfo(row) {
  const v = (row.platform || '').trim();
  if (!v) return { label: '—', legacy: false, mixed: false };
  const parts = v.split(',').map(s => s.trim()).filter(Boolean);
  const legacy = parts.some(p => /^9\.x/i.test(p) || /viya\s*3/i.test(p));
  return { label: parts.join(' + '), legacy, mixed: parts.length > 1 };
}

// Hosting is a long free-text list ("Azure - East US - Legacy (VSP) Hosting").
// Condense to provider plus Legacy/NextGen tier, which is what actually gets
// scanned; the full string stays available in the expanded row.
function hostingInfo(row) {
  const v = (row.hosting || '').trim();
  if (!v) return { provider: '—', tier: '', full: '' };
  const entries = v.split(',').map(s => s.trim()).filter(Boolean);
  const providers = [...new Set(entries.map(e => {
    const head = e.split(' - ')[0].trim();
    if (/^customer \(on-prem/i.test(head)) return 'On-prem';
    if (/^customer \(private/i.test(head)) return 'Private cloud';
    return head;
  }))];
  const hasLegacy = /legacy/i.test(v), hasNext = /nextgen/i.test(v);
  const tier = hasLegacy && hasNext ? 'Mixed' : hasLegacy ? 'Legacy' : hasNext ? 'NextGen' : '';
  return { provider: providers.join(' / '), tier, full: v };
}

// Legal-status restriction: constrains who may staff or access the environment.
function restrictionInfo(row) {
  const on = /^yes/i.test((row.restricted || '').trim());
  if (!on) return { restricted: false, label: '', detail: '' };
  const type = (row.restrictType || '').trim();
  const geo = (row.geoAllowed || '').trim();
  return { restricted: true, label: type || 'Restricted',
           detail: [type, geo && `Allowed: ${geo}`].filter(Boolean).join(' · ') };
}

// ── Domain scoring ─────────────────────────────────────────────────────────
// Scores each account across the portfolio domains. Every domain returns
// {state, label, detail} where state is 'good' | 'watch' | 'risk' | 'nodata'.
// 'nodata' means the CSDM left it blank — that's a coverage gap, not a health
// problem, and is counted separately from 'risk'.

const DOMAINS = [
  { key: 'customerHealth',  label: 'Customer Health',   short: 'Cust' },
  { key: 'serviceReviews',  label: 'Service Health Reviews', short: 'SHR' },
  { key: 'lifecycle',       label: 'Lifecycle Planning', short: 'Lifecycle' },
  { key: 'renewal',         label: 'Renewal Status',    short: 'Renewal' },
  { key: 'profitability',   label: 'Profitability',     short: 'Profit' },
];

function scoreDomains(row, s) {
  const d = {};

  // Customer Health — sentiment/ops status, SLA, interruptions
  (() => {
    const bits = [];
    let state = 'good';
    if (row.sentiment !== 'Green' || row.operations !== 'Green') {
      state = (row.sentiment === 'Red' || row.operations === 'Red') ? 'risk' : 'watch';
      bits.push(`Sentiment ${row.sentiment} / Ops ${row.operations}`);
    }
    if (s.sla) {
      const pct = parseFloat(s.sla.replace(/[^0-9.]/g, ''));
      if (!isNaN(pct) && pct < 99) { state = 'risk'; bits.push(`SLA ${s.sla}`); }
      else bits.push(`SLA ${s.sla}`);
    }
    const n = interruptionCount(s.interruptions);
    if (n !== null && !isNaN(n)) {
      if (n >= 3) { state = 'risk'; bits.push(`${n} interruptions`); }
      else if (n >= 1) { if (state === 'good') state = 'watch'; bits.push(`${n} interruption${n>1?'s':''}`); }
    }
    if (s.issues) { if (state === 'good') state = 'watch'; bits.push('open issues'); }
    if (!s.sla && n === null && !s.issues && row.sentiment === 'Green' && row.operations === 'Green')
      { d.customerHealth = { state: 'nodata', label: 'Not documented', detail: 'No SLA or interruption data' }; return; }
    d.customerHealth = { state, label: state === 'good' ? 'Healthy' : state === 'watch' ? 'Watch' : 'At risk', detail: bits.join(' · ') || '—' };
  })();

  // Service Health Reviews — cadence established, completed, participation
  (() => {
    const freq = s.frequency;
    if (!freq) { d.serviceReviews = { state: 'nodata', label: 'Not documented', detail: 'No review cadence recorded' }; return; }
    const low = freq.toLowerCase();
    const declined = /declin|none|not requested|no reviews?|refus/.test(low);
    const bits = [snip(freq, 60)];
    if (declined) { d.serviceReviews = { state: 'risk', label: 'None held', detail: bits.join(' · ') }; return; }
    const done = s.completed && /yes|complet|held|done/i.test(s.completed);
    if (done) { d.serviceReviews = { state: 'good', label: 'On track', detail: bits.join(' · ') }; return; }
    d.serviceReviews = { state: 'watch', label: 'Cadence set, none this period', detail: bits.join(' · ') };
  })();

  // Lifecycle Planning — current versions known + forward plan
  (() => {
    const cur = s.currentVersions, next = s.nextVersion;
    const nextReal = next && !isPlaceholder(next) ? next : null;
    if (!cur && !nextReal) { d.lifecycle = { state: 'nodata', label: 'Not documented', detail: 'No versions or plan recorded' }; return; }
    if (!nextReal) { d.lifecycle = { state: 'watch', label: 'No forward plan', detail: cur ? `On ${snip(cur, 50)}` : '—' }; return; }
    if (/decommission|end of contract|sunset|retire/i.test(nextReal))
      { d.lifecycle = { state: 'risk', label: 'Decommission planned', detail: snip(nextReal, 60) }; return; }
    if (!cur) { d.lifecycle = { state: 'watch', label: 'Plan set, versions unknown', detail: snip(nextReal, 60) }; return; }
    d.lifecycle = { state: 'good', label: 'Planned', detail: `${snip(cur,40)} → ${snip(nextReal,40)}` };
  })();

  // Renewal Status — driven by the real contract end date when we have one,
  // falling back to the CSDM's free-text "within 9 months?" answer otherwise.
  (() => {
    const end = resolveContractEnd(row, s);
    const fb = s.renewalFeedback;
    const fbLow = (fb || '').toLowerCase();
    const nonRenew = /non-renewal|not renewing|cancell?ation|will not renew/.test(fbLow);
    const atRisk = /at risk|lower price|discount|reduc/.test(fbLow);

    let inWindow = null, endNote = '';
    if (end.iso) {
      const days = Math.round((new Date(end.iso + 'T00:00:00') - new Date()) / 86400000);
      endNote = `ends ${formatDate(end.iso)}`;
      if (days < 0) { d.renewal = { state: 'risk', label: 'Contract end date passed', detail: `${endNote} — ${Math.abs(days)}d ago` }; return; }
      inWindow = days <= 274; // ~9 months
      endNote += ` (${Math.round(days/30.44)} mo)`;
    } else {
      const w9 = s.within9mo;
      if (!w9) { d.renewal = { state: 'nodata', label: 'Not answered', detail: 'No contract end date and 9-month question unanswered' }; return; }
      inWindow = /yes/i.test(w9);
      endNote = snip(w9, 50);
    }

    if (nonRenew) { d.renewal = { state: 'risk', label: 'NON-RENEWAL', detail: fb ? snip(fb, 70) : endNote }; return; }
    if (atRisk)   { d.renewal = { state: 'risk', label: 'At risk / price pressure', detail: fb ? snip(fb, 70) : endNote }; return; }
    if (!inWindow) { d.renewal = { state: 'good', label: 'Not in window', detail: endNote }; return; }
    if (!fb || isPlaceholder(fb)) { d.renewal = { state: 'watch', label: 'In window, position unknown', detail: endNote }; return; }
    if (!s.renewalNextSteps || isPlaceholder(s.renewalNextSteps)) { d.renewal = { state: 'watch', label: 'In window, no next steps', detail: `${endNote} · ${snip(fb, 40)}` }; return; }
    d.renewal = { state: 'good', label: 'On track', detail: `${endNote} · ${snip(fb, 45)}` };
  })();

  // Profitability — the template only carries a link, so this is coverage only
  (() => {
    d.profitability = s.profitabilityLink
      ? { state: 'good', label: 'Link on file', detail: 'Review workbook linked' }
      : { state: 'nodata', label: 'No link', detail: 'Profitability workbook not linked' };
  })();

  return d;
}

// Short plain-English note on what drives each domain's colour, shown on the
// rollup cards, as column tooltips, and in the expanded account scorecard.
const DOMAIN_KEYS = {
  customerHealth: 'Red: SLA <99%, 3+ interruptions, or Red status · Yellow: non-green status, 1–2 interruptions, or open issues · Grey: no SLA/interruption data',
  serviceReviews: 'Red: customer declined or none held · Yellow: cadence set but none completed this period · Green: review completed · Grey: cadence not recorded',
  lifecycle: 'Red: decommission planned · Yellow: versions known but no forward plan · Green: current versions + upgrade path · Grey: nothing recorded',
  renewal: 'Red: non-renewal or price pressure · Yellow: inside 9 months with position or next steps unclear · Green: outside window or on track · Grey: 9-month question unanswered',
  profitability: 'Green: workbook linked · Grey: no link. Template carries no margin value, so this is coverage only',
};

const STATE_META = {
  good:   { color: 'var(--green)',  bg: 'var(--green-bg)',  border: 'var(--green-border)',  icon: '●', rank: 3 },
  watch:  { color: 'var(--yellow)', bg: 'var(--yellow-bg)', border: 'var(--yellow-border)', icon: '●', rank: 1 },
  risk:   { color: 'var(--red)',    bg: 'var(--red-bg)',    border: 'var(--red-border)',    icon: '●', rank: 0 },
  nodata: { color: 'var(--text3)',  bg: 'var(--surface3)',  border: 'var(--border)',        icon: '○', rank: 2 },
};

// Generate OneNote text for an owner
function generateExport(owner, accounts, notes, today) {
  // Worst-first so the 1:1 opens with what matters
  const ranked = accounts.map(a => {
    const s = parseStatus(a.status);
    const domains = scoreDomains(a, s);
    const worst = Math.min(...DOMAINS.map(d => STATE_META[domains[d.key]?.state || 'nodata'].rank));
    return { a, worst };
  }).sort((x, y) => x.worst - y.worst || x.a.customer.localeCompare(y.a.customer));
  accounts = ranked.map(r => r.a);

  let t = `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  t += `WEEKLY 1:1 PREP — ${owner.toUpperCase()}\n`;
  t += `${today}   |   ${accounts.length} accounts\n`;
  const g = accounts.filter(a=>a.sentiment==='Green').length;
  const y = accounts.filter(a=>a.sentiment==='Yellow').length;
  const r = accounts.filter(a=>a.sentiment==='Red').length;
  t += `Sentiment:  ${g} Green  /  ${y} Yellow  /  ${r} Red\n`;
  const offTmpl = accounts.filter(a => checkTemplate(a.status, a).length > 0).length;
  if (offTmpl > 0) t += `Template:   ${offTmpl} of ${accounts.length} account${accounts.length!==1?'s':''} off the standard format\n`;
  t += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;

  // Portfolio scorecard across the owner's accounts
  t += `PORTFOLIO SCORECARD\n`;
  t += `${'─'.repeat(60)}\n`;
  DOMAINS.forEach(d => {
    const c = { good:0, watch:0, risk:0, nodata:0 };
    accounts.forEach(a => { const st = scoreDomains(a, parseStatus(a.status))[d.key]?.state; if (st) c[st]++; });
    const parts = [];
    if (c.risk) parts.push(`${c.risk} risk`);
    if (c.watch) parts.push(`${c.watch} watch`);
    if (c.nodata) parts.push(`${c.nodata} blank`);
    if (c.good) parts.push(`${c.good} ok`);
    t += `  ${d.label.padEnd(24)} ${parts.join('  ·  ')}\n`;
  });
  t += `\n\n`;

  // Off-cadence updates (only meaningful when the export carries dates)
  const haveDates = accounts.some(a => a.updated);
  if (!haveDates) {
    t += `⏰ CADENCE: not checked — this export has no sys_updated_on column.\n`;
    t += `   Add that field in ServiceNow to track Wed/Thu update compliance.\n\n\n`;
  } else {
    const stale = accounts.filter(a => isOffCadence(a));
    if (stale.length > 0) {
      t += `⏰ OFF-CADENCE UPDATES (not updated on Wed/Thu)\n`;
      t += `${'─'.repeat(60)}\n`;
      stale.forEach(a => {
        t += a.updated
          ? `  • ${a.customer}  [${a.lob}]  —  last updated ${weekdayName(a.updated)} ${formatDate(a.updated)}  (${daysAgo(a.updated)}d ago)\n`
          : `  • ${a.customer}  [${a.lob}]  —  no update date recorded\n`;
      });
      t += `\n\n`;
    }
  }

  // All accounts: manager flags first, then the full update text verbatim
  t += `ALL ACCOUNTS\n`;
  t += `${'─'.repeat(60)}\n`;
  accounts.forEach((a, i) => {
    const s = parseStatus(a.status);
    const flags = analyzeAccount(a, s);
    const domains = scoreDomains(a, s);
    const points = talkingPoints(a, s, domains, flags);
    t += `\n${'═'.repeat(60)}\n`;
    t += `${i+1}. ${a.customer}  [${a.lob}]\n`;
    t += `Owner: ${a.owner}  |  Sentiment: ${a.sentiment}  |  Operations: ${a.operations}`;
    t += a.updated ? `  |  Updated: ${weekdayName(a.updated)} ${formatDate(a.updated)}\n` : `\n`;
    t += `${'═'.repeat(60)}\n`;

    // Domain scorecard
    t += `\nSCORECARD:\n`;
    DOMAINS.forEach(d => {
      const dm = domains[d.key];
      const mark = dm.state === 'risk' ? 'RISK ' : dm.state === 'watch' ? 'WATCH' : dm.state === 'nodata' ? 'BLANK' : 'OK   ';
      t += `  [${mark}] ${d.label.padEnd(23)} ${dm.label}${dm.detail && dm.detail !== '—' ? ' — ' + dm.detail : ''}\n`;
    });

    // Talking points, each with the question to ask
    if (points.length > 0) {
      t += `\nTALKING POINTS:\n`;
      points.forEach(p => {
        t += `\n  ${p.kind==='risk'?'⚑':p.kind==='issue'?'!':'△'} ${p.domain} — ${p.msg}\n`;
        if (p.detail) t += `      ${snip(p.detail, 200)}\n`;
        if (p.ask) t += `      ASK: ${p.ask}\n`;
      });
    } else if (!expectsUpdate(a)) {
      t += `\nTALKING POINTS: — ${phaseScope(a).kind === 'pointer'
        ? 'tracked outside LOB.Details (IGNORE LOB / SEE MPM)'
        : 'Implementation phase, no weekly update expected yet'}\n`;
    } else {
      t += `\nTALKING POINTS: ✓ Nothing flagged — quick confirm and move on\n`;
    }

    // Other manager observations not already covered by a talking point
    const other = flags.filter(f => (f.type === 'warn' || f.type === 'info')
      && !points.some(p => p.msg === f.msg));
    if (other.length > 0) {
      t += `\nALSO NOTED:\n`;
      other.forEach(f => t += `  ${f.type==='warn'?'△':'ℹ'} ${f.msg}\n`);
    }

    const fixes = flags.filter(f => f.type === 'fix');
    if (fixes.length > 0) {
      t += `\nCSDM TO FIX IN NEXT UPDATE:\n`;
      fixes.forEach(f => t += `  ✎ ${f.msg}\n`);
    }
    const note = notes[a.lob];
    if (note) t += `\n📝 MY NOTE: ${note.text}\n`;

    // Full data dump, verbatim from the update
    t += `\n--- FULL UPDATE (as submitted) ---\n`;
    t += `${a.status || '(no status text provided)'}\n`;
  });

  return t;
}

// ── Hooks ──────────────────────────────────────────────────────────────────

function useNotes() {
  const [notes, setNotes] = useState(() => {
    try { return JSON.parse(localStorage.getItem('lob-notes-v2') || '{}'); } catch { return {}; }
  });
  useEffect(() => { localStorage.setItem('lob-notes-v2', JSON.stringify(notes)); }, [notes]);
  return {
    notes,
    setNote: (lob, text) => setNotes(p => ({...p, [lob]: {text, updated: new Date().toISOString()}})),
    getNote: lob => notes[lob] || null,
    deleteNote: lob => setNotes(p => { const n = {...p}; delete n[lob]; return n; }),
  };
}

// ── Small components ───────────────────────────────────────────────────────

function StatusBadge({ status }) {
  const dot = { Green: '●', Yellow: '●', Red: '●' }[status] || '○';
  return <span className={`status-badge status-${status}`}><span className={`status-dot dot-${status}`}></span>{status}</span>;
}

function DateBadge({ val }) {
  const days = daysAgo(val);
  const stale = isStale(val);
  const cls = stale ? 'date-stale' : 'date-fresh';
  const label = days === 0 ? 'Today' : days === 1 ? 'Yesterday' : `${days}d ago`;
  return <span className={`date-badge ${cls}`}>{label}</span>;
}

function Field({ label, value, isLink }) {
  const empty = !value;
  return (
    <div className="field-row">
      <div className="field-label">{label}</div>
      <div className={`field-val${empty ? ' empty' : ''}`}>
        {empty ? '—' : isLink
          ? <a href={value} target="_blank" rel="noopener noreferrer">View ↗</a>
          : value}
      </div>
    </div>
  );
}

function AnalysisFlags({ flags }) {
  if (!flags.length) return <p className="no-flags">✓ No issues flagged</p>;
  const discuss = flags.filter(f => f.type === 'alert' || f.type === 'warn' || f.type === 'info');
  const fixes   = flags.filter(f => f.type === 'fix');
  return (
    <div>
      {discuss.length > 0 && (
        <>
          <div style={{fontSize:'0.66rem', fontFamily:'var(--mono)', textTransform:'uppercase', letterSpacing:'0.06em', color:'var(--text3)', marginBottom:'0.3rem'}}>Discussion Topics</div>
          {discuss.map((f, i) => (
            <div key={i} className={`analysis-flag ${f.type}`}>
              <span className="analysis-flag-icon">{f.type==='alert'?'⚑':f.type==='warn'?'△':'ℹ'}</span>
              <span>{f.msg}</span>
            </div>
          ))}
        </>
      )}
      {fixes.length > 0 && (
        <>
          <div style={{fontSize:'0.66rem', fontFamily:'var(--mono)', textTransform:'uppercase', letterSpacing:'0.06em', color:'var(--text3)', marginTop: discuss.length ? '0.5rem' : 0, marginBottom:'0.3rem'}}>CSDM to Fix</div>
          {fixes.map((f, i) => (
            <div key={i} className="analysis-flag fix">
              <span className="analysis-flag-icon">✎</span>
              <span>{f.msg}</span>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

// A single titled box. `missing` highlights it red with a MISSING tag (field
// left blank in the update); `isIssue` tints it amber when it has content.
function FieldBox({ label, value, isLink, missing, isIssue, wide }) {
  const empty = !value;
  const issueActive = isIssue && !empty;
  const isUrl = !empty && /^https?:\/\//i.test(value);
  const cls = ['field-box', wide ? 'wide' : '', missing ? 'missing' : '', issueActive ? 'has-issue' : ''].filter(Boolean).join(' ');
  return (
    <div className={cls}>
      <div className="field-box-label">
        <span>{label}</span>
        {missing && <span className="missing-tag">MISSING</span>}
      </div>
      <div className={`field-box-val${empty ? ' empty' : ''}`}>
        {missing
          ? 'No information provided'
          : empty
            ? '—'
            : (isLink && isUrl
                ? <a href={value} target="_blank" rel="noopener noreferrer">View ↗</a>
                : value)}
      </div>
    </div>
  );
}

// The raw status text, shown last in an expanded account. Template adherence

          <span>Update as submitted</span>
        </div>

// ── Main table view ────────────────────────────────────────────────────────
// ── Monday morning view ────────────────────────────────────────────────────

function MondayView({ data, notes }) {
  const allSections = useMemo(() => data.map(r => parseStatus(r.status)), [data]);
  const allFlags = useMemo(() => data.map((r,i) => analyzeAccount(r, allSections[i])), [data, allSections]);

  const staleByOwner = useMemo(() => {
    const map = {};
    data.forEach((r, i) => {
      // Projects still in Implementation on both phase and state aren't
      // expected to post a weekly update yet, so they can't be "missed".
      if (isOffCadence(r)) {
        if (!map[r.owner]) map[r.owner] = [];
        map[r.owner].push({ row: r, days: daysAgo(r.updated) });
      }
    });
    return Object.entries(map).sort((a,b) => a[0].localeCompare(b[0]));
  }, [data]);

  const actionItems = useMemo(() => {
    const items = [];
    data.forEach((r, i) => {
      if (r.sentiment !== 'Green' || r.operations !== 'Green') {
        const s = allSections[i];
        const flags = allFlags[i];
        items.push({ row: r, sections: s, flags: flags.filter(f => f.type === 'alert'), allFlags: flags });
      }
    });
    // Sort: Red first, then Yellow
    items.sort((a,b) => {
      const sentOrd = {Red:0,Yellow:1,Green:2};
      const aOrd = Math.min(sentOrd[a.row.sentiment]??2, sentOrd[a.row.operations]??2);
      const bOrd = Math.min(sentOrd[b.row.sentiment]??2, sentOrd[b.row.operations]??2);
      return aOrd - bOrd;
    });
    return items;
  }, [data, allSections, allFlags]);

  return (
    <div>
      <div style={{marginBottom:'1rem', padding:'0.75rem 1rem', background:'var(--surface)', border:'1px solid var(--border)', borderRadius:'8px', fontSize:'0.82rem', color:'var(--text2)'}}>
        Monday quick-scan — {data.length} total accounts across {[...new Set(data.map(d=>d.owner))].length} CSDMs
        {staleByOwner.length > 0 && <span style={{color:'var(--red)', marginLeft:'1rem'}}>⚑ {staleByOwner.reduce((n,[,a])=>n+a.length,0)} accounts not updated last week</span>}
        {actionItems.length > 0 && <span style={{color:'var(--yellow)', marginLeft:'1rem'}}>△ {actionItems.length} non-green account{actionItems.length !== 1 ? 's' : ''}</span>}
      </div>

      <div className="monday-wrap">
        {/* Stale updates by owner */}
        <div className="monday-section">
          <div className="monday-section-header">
            <span className="monday-section-title" style={{color:'var(--red)'}}>⏰ Missed Thursday Updates</span>
            <span style={{fontSize:'0.72rem', color:'var(--text3)', fontFamily:'var(--mono)'}}>{staleByOwner.reduce((n,[,a])=>n+a.length,0)} accounts</span>
          </div>
          {staleByOwner.length === 0
            ? <div className="monday-empty" style={{color:'var(--green)'}}>✓ All accounts updated this week</div>
            : staleByOwner.map(([owner, items]) => (
              <div key={owner}>
                <div style={{padding:'0.45rem 1rem', background:'var(--surface3)', fontSize:'0.72rem', fontFamily:'var(--mono)', color:'var(--text3)', borderTop:'1px solid var(--border)'}}>
                  {owner} — {items.length} account{items.length>1?'s':''}
                </div>
                {items.map(({row, days}) => (
                  <div key={row.lob} className="monday-row">
                    <StatusBadge status={row.sentiment} />
                    <div className="monday-row-main">
                      <div className="monday-row-customer">{row.customer}</div>
                      <div className="monday-row-meta">{row.lob} · last updated {formatDate(row.updated)} ({days}d ago)</div>
                    </div>
                  </div>
                ))}
              </div>
            ))
          }
        </div>

        {/* Action items */}
        <div className="monday-section">
          <div className="monday-section-header">
            <span className="monday-section-title" style={{color:'var(--yellow)'}}>△ Needs Your Attention</span>
            <span style={{fontSize:'0.72rem', color:'var(--text3)', fontFamily:'var(--mono)'}}>{actionItems.length} accounts</span>
          </div>
          {actionItems.length === 0
            ? <div className="monday-empty" style={{color:'var(--green)'}}>✓ No major issues flagged</div>
            : actionItems.map(({row, sections, flags, allFlags: af}) => (
              <div key={row.lob} className="monday-row">
                <div style={{display:'flex', flexDirection:'column', gap:'3px', flexShrink:0}}>
                  <div style={{display:'flex', alignItems:'center', gap:'4px'}}>
                    <span style={{fontSize:'0.62rem', color:'var(--text3)', fontFamily:'var(--mono)', width:'26px'}}>SENT</span>
                    <StatusBadge status={row.sentiment} />
                  </div>
                  <div style={{display:'flex', alignItems:'center', gap:'4px'}}>
                    <span style={{fontSize:'0.62rem', color:'var(--text3)', fontFamily:'var(--mono)', width:'26px'}}>OPS</span>
                    <StatusBadge status={row.operations} />
                  </div>
                </div>
                <div className="monday-row-main">
                  <div className="monday-row-customer">{row.customer} <span style={{fontSize:'0.72rem', color:'var(--text3)'}}>{row.owner}</span></div>

                    <div key={i} className="monday-row-meta" style={{color:'var(--red)'}}>⚑ {f.msg}</div>

                  {af.filter(f=>f.type==='warn').map((f,i) => (
                    <div key={i} className="monday-row-meta" style={{color:'var(--yellow)'}}>△ {f.msg}</div>

            ))

}

function DomainPill({ d, showLabel }) {
  if (!d) return <span className="pill" style={{color:'var(--text3)', background:'var(--surface3)', borderColor:'var(--border)'}}>—</span>;
  const m = STATE_META[d.state];
  return (
    <span className="pill" style={{color:m.color, background:m.bg, borderColor:m.border}} title={`${d.label} — ${d.detail}`}>
      {m.icon} {showLabel ? d.label : ''}
    </span>
  );
}

function PortfolioView({ data, notes }) {
  const [groupBy, setGroupBy] = useState('owner');
  const [domainFilter, setDomainFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [filterOwner, setFilterOwner] = useState('all');

  const [phaseFilter, setPhaseFilter] = useState('all');
  const [attrFilter, setAttrFilter] = useState('all');

  const owners = useMemo(() => [...new Set(data.map(d => d.owner))].filter(Boolean).sort(), [data]);

  const scored = useMemo(() => data.map(r => {
    const s = parseStatus(r.status);
    const domains = scoreDomains(r, s);
    const flags = analyzeAccount(r, s);
    return { row: r, sections: s, domains, flags,
             points: talkingPoints(r, s, domains, flags),
             scope: phaseScope(r), platform: platformInfo(r), hosting: hostingInfo(r),
             restrict: restrictionInfo(r) };
  }), [data]);

  // Rollup counts per domain
  const rollups = useMemo(() => DOMAINS.map(dom => {
    const counts = { good:0, watch:0, risk:0, nodata:0 };
    scored.forEach(x => { const st = x.domains[dom.key]?.state; if (st) counts[st]++; });
    return { ...dom, counts };

    const q = search.toLowerCase();

      || x.row.lob.toLowerCase().includes(q) || x.row.owner.toLowerCase().includes(q);

    const matchDomain = domainFilter === 'all' || st === 'risk' || st === 'watch' || st === 'nodata';

      || (phaseFilter === 'live' && x.scope.kind === 'live')
      || (phaseFilter === 'impl' && x.scope.kind === 'impl')
      || (phaseFilter === 'unscored' && !x.scope.scored)
      || (phaseFilter === x.row.phase);
    const matchAttr = attrFilter === 'all'

      || (attrFilter.startsWith('region:') && x.row.region === attrFilter.slice(7))
      || (attrFilter.startsWith('sol:') && x.row.solution === attrFilter.slice(4));

// Domain scorecard shown at the top of an expanded account
// Reference attributes from the CREL record — context that doesn't belong in

function AccountAttributes({ x }) {
  const r = x.row;
  const items = [
    ['CREL', r.crelNumber],
    ['Cloud Tech Lead', r.techLead],
    ['Region', [r.region, r.country && r.country !== r.region ? r.country : null].filter(Boolean).join(' · ')],
    ['Platform', x.platform.label !== '—' ? x.platform.label + (x.platform.legacy ? '  (legacy)' : '') : null],
    ['Solution', r.solution],
    ['Hosting', x.hosting.full],

  ].filter(([, v]) => v);
  if (!items.length) return null;
  return (
    <div style={{padding:'0.9rem 1.25rem 0'}}>

        {items.map(([k, v]) => (
          <div key={k} className="attr-item">
            <div className="attr-k">{k}</div>
            <div className="attr-v">{v}</div>
          </div>
        ))}
      </div>

// The 1:1 half of an expanded account: what to raise, the question to ask,
// and — compactly, at the end — the housekeeping items. Template adherence is
// shown here for context alongside the content gaps; the Compliance tab is
// still where it gets scored and reviewed in bulk.
// Dedupe key for housekeeping chips. The template check and the blank-field
// check word the same item differently ("Number of service interruptions" vs
// "Service interruptions count"), so strip filler words and plurals before
// comparing.
function qcKey(label) {
  return normLabel(label)
    .replace(/\b(number of|count|the|of|a)\b/g, ' ')
    .split(/\s+/).filter(Boolean)
    .map(word => word.replace(/s$/, ''))
    .join(' ');
}

function CoachingPanel({ points, flags, row }) {
  const scope = phaseScope(row);
  // Implementation projects (Implementation on both LOB phase and CREL state)
  // aren't expected to maintain LOB.Details yet, so there is nothing to coach:
  // no talking points, no template or update-quality items. The status they do
  // have is still shown below, unjudged.
  if (!expectsUpdate(row)) {
    return (
      <div style={{padding:'0.9rem 1.25rem 0'}}>
        <div style={{fontSize:'0.78rem', color:'var(--text3)', background:'var(--surface)',
          border:'1px solid var(--border)', borderRadius:'6px', padding:'0.55rem 0.75rem'}}>
          {scope.kind === 'pointer'
            ? 'Tracked outside LOB.Details (marked IGNORE LOB / SEE MPM) — nothing is flagged or scored here.'
            : 'Implementation phase — no weekly update expected yet, so nothing is flagged or scored here.'}
        </div>
      </div>
    );
  }
  const fixes = flags.filter(f => f.type === 'fix');
  const tmpl = scope.scored ? checkTemplate(row.status, row) : [];
  // A missing heading also reads as a blank field, so the same item can arrive
  // from both checks. Show it once, keyed on the compressed label.
  const seen = new Set();
  const items = [];
  const add = (kind, label, full) => {
    const k = qcKey(label);
    if (seen.has(k)) return;
    seen.add(k);
    items.push({ kind, label, full: full || label });
  };
  tmpl.forEach(f => add('tmpl', qcShort(f.msg), f.msg));
  fixes.forEach(f => {
    // "Also blank: A, B, C" groups several fields into one message so the
    // OneNote export stays compact. Chips are meant to be one item each, so
    // split it back out — otherwise it truncates to something unreadable and
    // counts three gaps as one.
    const grouped = f.msg.match(/^Also blank:\s*(.+)$/i);
    if (grouped) grouped[1].split(/,\s*/).filter(Boolean)
      .forEach(lbl => add('fix', qcShort(lbl.trim()), lbl.trim()));
    else add('fix', qcShort(f.msg), f.msg);
  });
  return (
    <div style={{padding:'0.9rem 1.25rem 0'}}>
      <div style={{fontSize:'0.66rem', fontFamily:'var(--mono)', textTransform:'uppercase', letterSpacing:'0.06em', color:'var(--text3)', marginBottom:'0.4rem'}}>
        Talking points
      </div>
      {points.length === 0 && (
        <div style={{fontSize:'0.8rem', color:'var(--green)', marginBottom:'0.3rem'}}>✓ Nothing flagged — quick confirm and move on</div>
      )}
      {points.map((p, i) => (
        <div key={i} className="talk-item">
          <span style={{color: p.kind==='risk'?'var(--red)':p.kind==='issue'?'var(--orange)':'var(--yellow)'}}>
            {p.kind==='risk'?'⚑':p.kind==='issue'?'!':'△'}
          </span>
          <div style={{flex:1, minWidth:0}}>
            <div><strong style={{fontSize:'0.72rem', fontFamily:'var(--mono)', color:'var(--text3)'}}>{p.domain}</strong> — {p.msg}</div>
            {p.detail && <div style={{fontSize:'0.76rem', color:'var(--text2)', marginTop:'2px'}}>{p.detail}</div>}
            {p.ask && <div className="ask-q" style={{fontSize:'0.76rem', marginTop:'3px'}}>Ask: {p.ask}</div>}
          </div>
        </div>
      ))}
      {items.length > 0 && (
        <div style={{marginTop:'0.7rem'}}>
          <div style={{fontSize:'0.66rem', fontFamily:'var(--mono)', textTransform:'uppercase', letterSpacing:'0.06em', color:'var(--text3)', marginBottom:'0.3rem'}}>
            Template &amp; update quality
            <span style={{color:'var(--text3)', opacity:0.7}}> — {items.length} item{items.length!==1?'s':''}, mention at the end</span>
          </div>
          <div className="qc-list">
            {items.map((it,i) => (
              <span key={i} className={`qc-item qc-${it.kind}`} title={it.full}>
                {it.kind === 'tmpl' ? '▤' : '✎'} {it.label}
              </span>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// Compress a housekeeping message to a chip-sized label; the full text stays
// on hover so nothing is lost.
function qcShort(msg) {
  let m = String(msg);
  m = m.replace(/^Missing the "(.+?)" (heading|section header)$/, (_, f, k) =>
        (k === 'section header' ? f + ' section' : f));
  m = m.replace(/^(.+?) not filled in — CSDM to complete$/, '$1');
  m = m.replace(/ section blank — CSDM to complete$/, '');
  m = m.replace(/ blank — CSDM to complete$/, '');
  m = m.replace(/^Also blank: /, '');
  m = m.replace(/ not documented$/, '');
  m = m.replace(/ not answered — required field$/, '');
  m = m.replace(/ — CSDM to fill in actual versions$/, '');
  m = m.replace(/^(.*?)\s*still contains template placeholder text$/, '$1 — placeholder');
  m = m.replace(/ is "TBD" — needs.*$/, ' — TBD');
  m = m.replace(/^Weekly Accomplishments looks like filler.*$/, 'Weekly Accomplishments — filler');
  // Shorten the longest template field names so chips stay compact
  const ABBREV = [
    [/Next Version(?: or|\/)\s*Decommission\s*[Pp]lan/g, 'Next Version'],
    [/Frequency of [Ss]ervice [Hh]ealth [Rr]eviews/g, 'SHR Frequency'],
    [/Link to [Rr]enewal [Pp]resentation\/[Ff]orm/g, 'Renewal Link'],
    [/(?:Number of )?[Ss]ervice [Ii]nterruptions?(?: count)?(?: \(3mo\))?/g, 'Interruptions'],
    [/Within 9 [Mm]onths? of [Cc]ontract [Ee]nd\??/g, 'Within 9 months'],
    [/Weekly [Mm]eeting [Nn]otes [Ll]ink/g, 'Meeting Notes Link'],
    [/[Cc]ompleted [Tt]his [Pp]eriod\??/g, 'SHR Completed'],
    [/Weekly Accomplishments/g, 'Weekly Accompl.'],
  ];
  ABBREV.forEach(([re, to]) => { m = m.replace(re, to); });
  return snip(m, 46);
}

// ── 1:1 view ───────────────────────────────────────────────────────────────

// Build talking points for one account: what to raise, and what to ask.
function talkingPoints(row, s, domains, flags) {
  // Nothing to coach on a project that isn't expected to report — still in
  // Implementation, or a pointer record tracked elsewhere.
  if (!expectsUpdate(row)) return [];
  const pts = [];
  const risk = DOMAINS.filter(d => domains[d.key]?.state === 'risk');
  const watch = DOMAINS.filter(d => domains[d.key]?.state === 'watch');

  risk.forEach(d => pts.push({ kind:'risk', domain:d.label, msg: domains[d.key].label, detail: domains[d.key].detail,
    ask: d.key === 'renewal' ? 'What is the retention or offboarding plan, and who owns it?'
       : d.key === 'customerHealth' ? 'What is driving this, and what will it take to stabilize?'
       : d.key === 'serviceReviews' ? 'Why is the customer declining reviews, and how else are we staying close?'
       : d.key === 'lifecycle' ? 'Is the decommission confirmed, and what is the timeline?'
       : 'What support do you need here?' }));

  watch.forEach(d => pts.push({ kind:'watch', domain:d.label, msg: domains[d.key].label, detail: domains[d.key].detail,
    ask: d.key === 'renewal' ? 'Where does the customer actually stand, and when will we know?'
       : d.key === 'serviceReviews' ? 'When is the next review scheduled?'
       : d.key === 'lifecycle' ? 'What is the upgrade path and timing?'
       : 'Anything you need from me on this?' }));

  if (s.issues) pts.push({ kind:'issue', domain:'Open Issues', msg:'Issues logged this week',
    detail: snip(s.issues, 180), ask:'What is the path to resolution and the ETA?' });

  const alerts = flags.filter(f => f.type === 'alert');
  alerts.forEach(f => { if (!/cadence|no update date/i.test(f.msg)) pts.push({ kind:'risk', domain:'Alert', msg:f.msg, detail:'', ask:'' }); });

  return pts;
}

// ── Compliance ─────────────────────────────────────────────────────────────
// Shows, per CSDM, how consistently their updates follow the standard
// template. A "compliant" account has zero template deviations. Pointer /
// ignored records (MPD, MPT, anything "SEE MPM" or "IGNORE LOB") are excluded
// from the counts so they don't unfairly penalize an owner.
// One off-template account: what's missing, then the status as submitted.
// Shared by the per-CSDM panel and the Review tab so both look identical.
