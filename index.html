  const [reviewSev, setReviewSev] = useState('all');
  const [openAcct, setOpenAcct] = useState(null);
  const [search, setSearch] = useState('');

  // Phase decides who is even in scope: Operations/Hybrid must keep
  // LOB.Details current. Projects sitting in Implementation on both the LOB
  // phase and the CREL state are ignored outright — no status is expected yet,
  // so they are not counted, ranked, or listed here at all.
  const rows = useMemo(() => data
    .filter(row => phaseScope(row).kind !== 'impl')
    .map(row => {
      const scope = phaseScope(row);
      const devs = scope.scored ? checkTemplate(row.status, row) : [];
      return { row, scope, devs,
               major: devs.filter(d => d.sev === 'major').length,
               minor: devs.filter(d => d.sev === 'minor').length };
    }), [data]);

  const implIgnored = useMemo(() => data.filter(r => phaseScope(r).kind === 'impl').length, [data]);

  const inScope = rows.filter(r => r.scope.scored);
  const offTemplate = inScope.filter(r => r.devs.length > 0);

  const stats = useMemo(() => {
    const byOwner = {};
    inScope.forEach(rec => {
      const { row, devs } = rec;
      const owner = row.owner || 'Unassigned';
      if (!byOwner[owner]) byOwner[owner] = { owner, total: 0, compliant: 0, major: 0, minor: 0, accounts: [] };
      const o = byOwner[owner];
      o.total++;
      if (devs.length === 0) o.compliant++;
      devs.forEach(dv => { if (dv.sev === 'major') o.major++; else o.minor++; });
      o.accounts.push(rec);
    });
    return Object.values(byOwner).map(o => ({ ...o, pct: o.total ? Math.round((o.compliant / o.total) * 100) : 100 }))
      .sort((a, b) => b.pct - a.pct || a.major - b.major || a.owner.localeCompare(b.owner));
  }, [inScope]);

  const totalAcct = inScope.length;
  const totalCompliant = stats.reduce((n, o) => n + o.compliant, 0);
  const teamPct = totalAcct ? Math.round((totalCompliant / totalAcct) * 100) : 100;
  const notScored = rows.filter(r => !r.scope.scored);

  const barColor = pct => pct >= 90 ? 'var(--green)' : pct >= 60 ? 'var(--yellow)' : 'var(--red)';

  const reviewOwners = useMemo(() => [...new Set(offTemplate.map(r => r.row.owner))].filter(Boolean).sort(), [offTemplate]);
  const reviewList = useMemo(() => offTemplate.filter(r => {
    const q = search.toLowerCase();
    const ms = !search || r.row.customer.toLowerCase().includes(q) || r.row.lob.toLowerCase().includes(q);
    const mo = reviewOwner === 'all' || r.row.owner === reviewOwner;
    const mv = reviewSev === 'all' || (reviewSev === 'major' ? r.major > 0 : r.major === 0 && r.minor > 0);
    return ms && mo && mv;
  }).sort((a, b) => b.major - a.major || b.devs.length - a.devs.length
                  || a.row.customer.localeCompare(b.row.customer)), [offTemplate, search, reviewOwner, reviewSev]);

  return (
    <div>
      <div className="stats-row">
        <div className="stat-card" style={{cursor:'default'}}>
          <div className="stat-label">Team Compliance</div>
          <div className="stat-value" style={{color: barColor(teamPct)}}>{teamPct}%</div>
        </div>
        <div className="stat-card green" style={{cursor:'default'}}>
          <div className="stat-label">Compliant</div><div className="stat-value">{totalCompliant}</div>
        </div>
        <div className={`stat-card orange ${view==='review'?'active':''}`}
          onClick={() => setView(view === 'review' ? 'bycsdm' : 'review')}>
          <div className="stat-label">Off-Template</div><div className="stat-value">{offTemplate.length}</div>
        </div>
        <div className="stat-card blue" style={{cursor:'default'}}>
          <div className="stat-label">CSDMs</div><div className="stat-value">{stats.length}</div>
        </div>
        <div className="stat-card" style={{cursor:'default'}}>
          <div className="stat-label">Not Scored</div><div className="stat-value">{notScored.length}</div>
        </div>
      </div>

      <div className="tab-nav" style={{padding:0, marginBottom:'1rem', background:'transparent', borderBottom:'1px solid var(--border)'}}>
        <div className={`tab${view==='bycsdm'?' active':''}`} onClick={() => setView('bycsdm')}>By CSDM</div>
        <div className={`tab${view==='review'?' active':''}`} onClick={() => setView('review')}>
          Review Off-Template
          {offTemplate.length > 0 && <span className="badge badge-warn">{offTemplate.length}</span>}
        </div>
      </div>

      <div style={{marginBottom:'1rem', padding:'0.6rem 0.9rem', background:'var(--surface)', border:'1px solid var(--border)', borderRadius:'8px', fontSize:'0.8rem', color:'var(--text2)'}}>
        Scored: <strong>Operations</strong> and <strong>Hybrid</strong> projects, which are expected to keep LOB.Details current.
        {implIgnored > 0 && <span> {implIgnored} project{implIgnored!==1?'s':''} in Implementation phase and state {implIgnored!==1?'are':'is'} ignored entirely.</span>}
        {notScored.length > 0 && <span> {notScored.length} other record{notScored.length!==1?'s':''} (On Hold, pointer, or mismatched phase) also unscored.</span>}
        {' '}Only <strong>missing sections and lines</strong> are flagged — heading wording, section order, separator style and spelling are ignored.
      </div>

                    <td style={{textAlign:'center', fontFamily:'var(--mono)', fontSize:'0.82rem', color: o.minor?'var(--yellow)':'var(--text3)'}}>{o.minor || '—'}</td>
                    <td style={{color:'var(--text3)', fontSize:'0.75rem', textAlign:'center'}}>{open ? '▲' : '▼'}</td>
                  </tr>
                  {open && (
                    <tr className="expand-row">
                      <td colSpan={6}>
                        <div style={{padding:'0.9rem 1.25rem'}}>
                          {(() => {
                            const off = o.accounts.filter(a => a.devs.length > 0)
                              .sort((a,b) => b.major - a.major || b.devs.length - a.devs.length
                                           || a.row.customer.localeCompare(b.row.customer));
                            const okCount = o.total - off.length;
                            if (off.length === 0)
                              return <div className="no-flags">✓ Every scored account follows the template — nothing to coach.</div>;
                            return (
                              <>
                                <div style={{fontSize:'0.66rem', fontFamily:'var(--mono)', textTransform:'uppercase', letterSpacing:'0.06em', color:'var(--text3)', marginBottom:'0.4rem'}}>
                                  {off.length} account{off.length!==1?'s':''} off template

      {view === 'review' && (
      <div>

// Per-account 1:1 notes. Lives here rather than on Portfolio because this is

function NoteEditor({ lob, notes }) {
  const existing = notes.getNote(lob);
  const [text, setText] = useState(existing?.text || '');
  const [open, setOpen] = useState(!!existing);
  const [saved, setSaved] = useState(false);

  useEffect(() => { const n = notes.getNote(lob); setText(n?.text || ''); setOpen(!!n); }, [lob]);

  function save() {
    notes.setNote(lob, text);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  if (!open) return (
    <div style={{marginTop:'0.6rem'}}>
      <span className="clear-link" style={{fontSize:'0.75rem'}} onClick={() => setOpen(true)}>+ Add a note</span>
    </div>
  );

  return (
    <div style={{marginTop:'0.6rem'}}>
      <div style={{fontSize:'0.66rem', fontFamily:'var(--mono)', textTransform:'uppercase', letterSpacing:'0.06em', color:'var(--text3)', marginBottom:'0.3rem'}}>
        My note
      </div>
      <textarea className="notes-textarea" value={text} onChange={e => setText(e.target.value)}
        placeholder="Talking points for this account..." />
      <div className="notes-controls">
        <button className="btn btn-ghost" style={{fontSize:'0.75rem', padding:'0.3rem 0.7rem'}} onClick={save}>Save</button>
        {existing && (
          <button className="btn btn-ghost" style={{fontSize:'0.75rem', padding:'0.3rem 0.7rem', color:'var(--red)'}}

      </div>
    </div>
  );
}

function buildRenewalRows(data) {
  return data.map(r => {
    const s = parseStatus(r.status);
    const end = resolveContractEnd(r, s);
    // Prefer the real date over the CSDM's free-text answer
    let within9, w9src;
    if (end.iso) {
      const days = Math.round((new Date(end.iso + 'T00:00:00') - new Date()) / 86400000);
      within9 = days >= 0 && days <= 274;
      w9src = days < 0 ? 'Contract end passed' : `${Math.round(days/30.44)} months out`;
    } else {
      within9 = /yes/i.test(s.within9mo || '');
      w9src = s.within9mo ? snip(s.within9mo, 40) : null;
    }
    const fbLow = (s.renewalFeedback || '').toLowerCase();
    let posture = 'Not stated';
    if (/non-renewal|not renewing|cancell?ation|will not renew/.test(fbLow)) posture = 'Non-renewal';
    else if (/at risk|lower price|discount|reduc/.test(fbLow)) posture = 'At risk / price pressure';
    else if (/renew/.test(fbLow)) posture = 'Renewing';
    else if (s.renewalFeedback && isPlaceholder(s.renewalFeedback)) posture = 'TBD';
    return { row: r, s, end, within9, w9src, posture };
  });
}

const POSTURE_COLOR = {
  'Non-renewal': 'var(--red)',
  'At risk / price pressure': 'var(--red)',
  'TBD': 'var(--yellow)',
  'Not stated': 'var(--text3)',
  'Renewing': 'var(--green)',
};

function exportRenewalsXlsx(rows, today) {
  if (typeof XLSX === 'undefined') { alert('Excel library did not load — check your connection and reload.'); return; }
  const aoa = [[
    'Customer','LOB','CSDM','Contract End','Contract End (as written)','Date Precision','Date Source',
    'Within 9 Months','Months Out','CSDM Answer','Customer Posture','Customer Feedback','Next Steps',
    'Renewal Link','Sentiment','Operations','Renewal Section (full text)'
  ]];
  rows.forEach(({ row, s, end, within9, w9src, posture }) => {
    // Real Date object when we have an exact date so Excel can sort and filter;
    // blank otherwise, with the raw text preserved in the next column.
    const dateCell = end.iso ? new Date(end.iso + 'T00:00:00') : '';
    const monthsOut = end.iso
      ? Math.round((new Date(end.iso + 'T00:00:00') - new Date()) / 86400000 / 30.44)
      : '';
    aoa.push([
      row.customer, row.lob, row.owner,
      dateCell, end.label || '',
      end.precision === 'none' ? '' : end.precision, end.src || '',
      within9 ? 'Yes' : 'No', monthsOut, s.within9mo || '', posture,
      s.renewalFeedback || '', s.renewalNextSteps || '',
      s.renewalLink || '', row.sentiment, row.operations,
      s.renewalRaw || ''
    ]);
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates: true, dateNF: 'yyyy-mm-dd' });
  ws['!cols'] = [
    {wch:34},{wch:12},{wch:18},{wch:14},{wch:20},{wch:12},{wch:20},
    {wch:14},{wch:11},{wch:24},{wch:22},{wch:46},{wch:46},{wch:30},{wch:11},{wch:11},{wch:80}
  ];
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:aoa.length-1, c:aoa[0].length-1} }) };
  ws['!freeze'] = { xSplit: 0, ySplit: 1 };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Renewals');
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `LOB-Renewals-${stamp}.xlsx`);
}

  const filtered = useMemo(() => {
    let out = all.filter(x => {
      const q = search.toLowerCase();
      const ms = !search || x.row.customer.toLowerCase().includes(q)
        || x.row.lob.toLowerCase().includes(q) || x.row.owner.toLowerCase().includes(q);

      let sc = true;
      if (scope === 'within9') sc = x.within9;
      else if (scope === 'risk') sc = x.posture === 'Non-renewal' || x.posture === 'At risk / price pressure';
      else if (scope === 'nodate') sc = x.end.precision === 'none';
      else if (scope === 'dated') sc = x.end.precision !== 'none';
      return ms && mo && sc;
    });
    // Soonest dated first, then partial dates, then undated
    return out.sort((a,b) => {

      if (b.end.iso) return 1;
      const pa = a.end.precision === 'none' ? 1 : 0, pb = b.end.precision === 'none' ? 1 : 0;

    });

  const stats = useMemo(() => ({
    within9: all.filter(x => x.within9).length,

  const hasFilters = search || filterOwner !== 'all' || scope !== 'all';
  const today = new Date().toISOString().slice(0,10);
  const hasField = data.some(d => d.contractEnd);

  return (
    <div>

          padding:'0.6rem 0.9rem', marginBottom:'1rem', fontSize:'0.8rem', color:'var(--yellow)'}}>
          ⚠ <strong>Contract end column not in this export.</strong> Add
          {' '}<code style={{fontFamily:'var(--mono)', fontSize:'0.75rem'}}>u_customer_relationship.u_contract_end</code>
          {' '}to your ServiceNow report and every date below becomes exact. Until then dates are read out of the
          renewal text, which only covers {stats.dated + stats.partial} of {all.length} accounts.
        </div>
      )}
      <div className="stats-row">
        <div className="stat-card" style={{cursor:'default'}}>
          <div className="stat-label">Accounts</div><div className="stat-value">{all.length}</div>
        </div>
        <div className={`stat-card yellow ${scope==='within9'?'active':''}`} onClick={() => setScope(scope==='within9'?'all':'within9')}>
          <div className="stat-label">Within 9 Mo</div><div className="stat-value">{stats.within9}</div>
        </div>
        <div className={`stat-card red ${scope==='risk'?'active':''}`} onClick={() => setScope(scope==='risk'?'all':'risk')}>
          <div className="stat-label">At Risk</div><div className="stat-value">{stats.risk}</div>
        </div>
        <div className={`stat-card green ${scope==='dated'?'active':''}`} onClick={() => setScope(scope==='dated'?'all':'dated')}>
          <div className="stat-label">Has Date</div><div className="stat-value">{stats.dated + stats.partial}</div>
        </div>
        <div className={`stat-card orange ${scope==='nodate'?'active':''}`} onClick={() => setScope(scope==='nodate'?'all':'nodate')}>
          <div className="stat-label">No Date</div><div className="stat-value">{stats.nodate}</div>
        </div>
      </div>

      <div className="filter-bar">
        <input type="text" placeholder="Search customer, LOB, CSDM..." value={search} onChange={e => setSearch(e.target.value)} />
        <select value={filterOwner} onChange={e => setFilterOwner(e.target.value)}>
          <option value="all">All CSDMs</option>
          {owners.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
        <select value={scope} onChange={e => setScope(e.target.value)}>
          <option value="all">All accounts</option>
          <option value="within9">Within 9 months</option>
          <option value="risk">At risk / non-renewal</option>
          <option value="dated">Has a date</option>
          <option value="nodate">No date recorded</option>
        </select>
        {hasFilters && <span className="clear-link" onClick={() => { setSearch(''); setFilterOwner('all'); setScope('all'); }}>× Clear</span>}
        <button className="btn btn-export" style={{marginLeft:'auto'}}
          onClick={() => exportRenewalsXlsx(filtered, today)}>
          ⬇ Export to Excel ({filtered.length})
        </button>
      </div>

      <div className="matrix-wrap">
        <table className="matrix">
          <thead>
            <tr>
              <th className="acct-col">Account</th>
              <th style={{textAlign:'left', minWidth:'120px'}}>Contract End</th>
              <th style={{textAlign:'left', minWidth:'100px'}}>Within 9 Mo</th>
              <th style={{textAlign:'left', minWidth:'150px'}}>Posture</th>
              <th style={{textAlign:'left'}}>Renewal Notes</th>
              <th style={{width:'30px'}}></th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(x => {
              const isOpen = open === x.row.lob;
              return (
                <React.Fragment key={x.row.lob}>
                  <tr className={`acct${isOpen?' open':''}`} onClick={() => setOpen(isOpen ? null : x.row.lob)}>
                    <td>
                      <div className="customer-name">{x.row.customer}</div>
                      <div className="lob-code">{x.row.lob} · {x.row.owner}</div>
                    </td>
                    <td>
                      {x.end.label
                        ? <>
                            <div style={{fontFamily:'var(--mono)', fontSize:'0.8rem'}}>{x.end.label}</div>
                            <div className="lob-code" style={{color: x.end.precision==='exact'?'var(--text3)':'var(--yellow)'}}>
                              {x.end.precision === 'exact' ? x.end.src : `${x.end.precision} only`}
                            </div>
                          </>
                        : <span style={{color:'var(--text3)', fontStyle:'italic', fontSize:'0.78rem'}}>Not stated</span>}
                    </td>
                    <td>
                      <div style={{fontSize:'0.78rem', color: x.within9 ? 'var(--yellow)' : 'var(--text2)', fontWeight: x.within9 ? 600 : 400}}>
                        {x.end.iso ? (x.within9 ? 'Yes' : 'No') : (x.s.within9mo ? (x.within9 ? 'Yes' : 'No') : '—')}
                      </div>
                      {x.w9src && <div className="lob-code">{x.w9src}</div>}
                      {x.end.iso && x.s.within9mo && /yes/i.test(x.s.within9mo) !== x.within9 && (
                        <div className="lob-code" style={{color:'var(--orange)'}}>CSDM said: {snip(x.s.within9mo, 26)}</div>
                      )}
                    </td>
                    <td>
                      <span className="pill" style={{color:POSTURE_COLOR[x.posture], background:'transparent', borderColor:'var(--border)'}}>
                        {x.posture}
                      </span>
                    </td>
                    <td style={{fontSize:'0.76rem', color:'var(--text2)', maxWidth:'330px'}}>
                      {x.s.renewalFeedback && <div>{snip(x.s.renewalFeedback, 110)}</div>}
                      {x.s.renewalNextSteps && <div style={{color:'var(--blue)', marginTop:'2px'}}>Next: {snip(x.s.renewalNextSteps, 90)}</div>}
                      {!x.s.renewalFeedback && !x.s.renewalNextSteps && <em style={{color:'var(--text3)'}}>nothing recorded</em>}
                    </td>
                    <td style={{color:'var(--text3)', fontSize:'0.75rem', textAlign:'center'}}>{isOpen ? '▲' : '▼'}</td>
                  </tr>
                  {isOpen && (
                    <tr className="expand-row">
                      <td colSpan={6}>
                        <div style={{padding:'0.9rem 1.25rem'}}>
                          <div className="update-box">
                            <div className="update-box-head">
                              <span>Renewal Status — as submitted</span>
                              {x.s.renewalLink && <a href={x.s.renewalLink} target="_blank" rel="noopener noreferrer"
                                style={{color:'var(--blue)', textTransform:'none', letterSpacing:0}}>Renewal form ↗</a>}
                            </div>
                            <div className="update-box-body">{x.s.renewalRaw || '(no renewal section in this update)'}</div>
                          </div>
                        </div>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
        <div className="table-footer">
          {filtered.length} of {all.length} accounts · {hasField
            ? `contract end dates from the u_customer_relationship.u_contract_end field`
            : `${stats.dated} exact, ${stats.partial} quarter/year only, ${stats.nodate} with no date — parsed from renewal text`}
        </div>
      </div>
    </div>
  );
}

// ── Export modal ───────────────────────────────────────────────────────────

function ExportModal({ data, notes, onClose }) {
  const today = new Date().toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'});
  const [copied, setCopied] = useState(null);
  const [preview, setPreview] = useState(null);

  const ownerMap = useMemo(() => {
    const m = {};
    data.forEach(r => {
      if (!r.owner) return;
      if (!m[r.owner]) m[r.owner] = [];
      m[r.owner].push(r);
    });
    return Object.entries(m).sort((a,b) => a[0].localeCompare(b[0]));
  }, [data]);

  function copy(owner, accounts) {
    const text = generateExport(owner, accounts, notes.notes, today);
    navigator.clipboard.writeText(text).then(() => {
      setCopied(owner);
      setTimeout(() => setCopied(null), 2000);
    });
  }

  function copyAll() {
    const text = ownerMap.map(([o, accts]) => generateExport(o, accts, notes.notes, today)).join('\n\n');
    navigator.clipboard.writeText(text).then(() => {
      setCopied('__all__');
      setTimeout(() => setCopied(null), 2000);
    });
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-header">
          <h2>Export for OneNote</h2>
          <button className="btn btn-ghost" onClick={onClose}>✕ Close</button>
        </div>
        <div className="modal-body">
          <div style={{marginBottom:'1rem'}}>
            <div style={{background:'var(--surface2)', border:'1px solid var(--border)', borderRadius:'8px', padding:'0.875rem 1rem', display:'flex', alignItems:'center', justifyContent:'space-between', gap:'1rem'}}>
              <div>
                <div style={{fontWeight:500, color:'var(--text)'}}>All Owners</div>
                <div style={{fontSize:'0.75rem', color:'var(--text2)', marginTop:'2px'}}>{ownerMap.length} owners · {data.length} accounts · Includes manager analysis & flags</div>
              </div>
              <button className="btn btn-export" onClick={copyAll}>
                {copied==='__all__' ? '✓ Copied!' : '⎘ Copy All'}
              </button>
            </div>
          </div>
          {ownerMap.map(([owner, accounts]) => {
            const ySentiment = accounts.filter(a => a.sentiment !== 'Green').length;
            const stale = accounts.filter(a => isOffCadence(a)).length;
            const issueCount = accounts.filter(a => parseStatus(a.status).issues).length;
            return (
              <div key={owner} className="export-owner-row">
                <div className="export-owner-info">
                  <div className="export-owner-name">{owner}</div>
                  <div className="export-owner-meta">
                    <span>{accounts.length} accounts</span>
                    {ySentiment > 0 && <span style={{color:'var(--yellow)'}}>△ {ySentiment} non-green</span>}
                    {stale > 0 && <span style={{color:'var(--red)'}}>⏰ {stale} stale</span>}
                    {issueCount > 0 && <span style={{color:'var(--orange)'}}>⚑ {issueCount} w/ issues</span>}
                  </div>
                </div>
                <div className="export-actions">
                  <button className="btn btn-ghost" style={{fontSize:'0.78rem'}}
                    onClick={() => setPreview(preview === owner ? null : owner)}>
                    {preview === owner ? 'Hide' : 'Preview'}
                  </button>
                  <button className="btn btn-export" style={{fontSize:'0.78rem'}}
                    onClick={() => copy(owner, accounts)}>
                    {copied === owner ? '✓ Copied!' : '⎘ Copy'}
                  </button>
                </div>
              </div>
            );
          })}
          {preview && (() => {
            const [,accounts] = ownerMap.find(([o]) => o === preview) || [];
            if (!accounts) return null;
            return <div className="preview-box">{generateExport(preview, accounts, notes.notes, today)}</div>;
          })()}
        </div>
      </div>
    </div>
  );
}

// ── File uploader ──────────────────────────────────────────────────────────

function FileUploader({ onLoaded }) {
  const [drag, setDrag] = useState(false);
  const [error, setError] = useState(null);

  function handleFile(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.csv')) { setError('Please upload a CSV file'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const result = Papa.parse(e.target.result, { header: true, skipEmptyLines: true });
        const rows = result.data.map(normalizeRow).filter(r => r.lob || r.customer);
        if (!rows.length) { setError('No valid rows found in CSV'); return; }
        onLoaded(rows, file.name);
      } catch(err) { setError('Parse error: ' + err.message); }
    };
    reader.readAsText(file, 'windows-1252');
  }

  return (
    <div className="upload-screen">
      <div className="upload-card">
        <h1>LOB Dashboard</h1>
        <p className="subtitle">Upload your weekly ServiceNow CSV export</p>
        <div className={`drop-zone${drag ? ' drag' : ''}`}
          onDragOver={e => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)}
          onDrop={e => { e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); }}
          onClick={() => document.getElementById('fileInput').click()}>
          <div className="icon">⬆</div>
          <p><strong>Drop CSV here</strong> or click to browse</p>
          <p style={{marginTop:'0.4rem', fontSize:'0.78rem'}}>u_sso_lob_details export from ServiceNow</p>
          <input id="fileInput" type="file" accept=".csv" style={{display:'none'}} onChange={e => handleFile(e.target.files[0])} />
        </div>
        {error && <div className="error-box">{error}</div>}
      </div>
    </div>
  );
}

// ── App root ───────────────────────────────────────────────────────────────

function App() {
  const [allData, setAllData] = useState(null);
  const [fileName, setFileName] = useState('');
  const [tab, setTab] = useState('monday');
  const [showExport, setShowExport] = useState(false);
  const [manager, setManager] = useState('all');
  const notes = useNotes();

  if (!allData) return <FileUploader onLoaded={(d, name) => { setAllData(d); setFileName(name); setManager('all'); }} />;

  // One global filter, applied before anything else, so every tab, badge and
  // export reflects the selected manager's book.
  const managers = [...new Set(allData.map(d => d.manager))].filter(Boolean).sort();
  const data = manager === 'all' ? allData : allData.filter(d => d.manager === manager);
  const setData = setAllData;

  const allSections = data.map(r => parseStatus(r.status));
  const allFlags = data.map((r,i) => analyzeAccount(r, allSections[i]));
  const staleCount = data.filter(d => isOffCadence(d)).length;
  const attnCount = data.filter(r => r.sentiment !== 'Green' || r.operations !== 'Green').length;
  const flaggedCount = allFlags.filter(f => f.some(x => x.type === 'alert')).length;
  const noDateCol = data.length > 0 && data.every(d => !d.updated);
  const portfolioRisk = data.filter((r,i) => {
    const dm = scoreDomains(r, allSections[i]);
    return DOMAINS.some(d => dm[d.key]?.state === 'risk');
  }).length;
  const renewalRisk = buildRenewalRows(data)
    .filter(x => x.posture === 'Non-renewal' || x.posture === 'At risk / price pressure').length;
  // Matches the Compliance tab: only scored (Operations/Hybrid) accounts count
  const offTemplateCount = data.filter(r => phaseScope(r).scored && checkTemplate(r.status, r).length > 0).length;

  return (
    <div className="app">
      {showExport && <ExportModal data={data} notes={notes} onClose={() => setShowExport(false)} />}
      <div className="topbar">
        <div className="topbar-left">
          <span className="brand">LOB Dashboard</span>
          <span className="file-chip">{fileName}</span>
          {managers.length > 0 && (
            <div style={{display:'flex', alignItems:'center', gap:'0.4rem'}}>
              <span style={{fontSize:'0.72rem', color:'var(--text3)', fontFamily:'var(--mono)', textTransform:'uppercase', letterSpacing:'0.05em'}}>Manager</span>
              <select value={manager} onChange={e => setManager(e.target.value)}
                style={{background:'var(--surface2)', border:'1px solid ' + (manager==='all' ? 'var(--border)' : 'var(--blue)'),
                  borderRadius:'6px', color: manager==='all' ? 'var(--text)' : 'var(--blue)',
                  padding:'0.3rem 0.55rem', fontSize:'0.8rem', fontFamily:'var(--sans)',
                  fontWeight: manager==='all' ? 400 : 600, outline:'none'}}>
                <option value="all">All managers ({allData.length})</option>
                {managers.map(m => (
                  <option key={m} value={m}>{m} ({allData.filter(d => d.manager === m).length})</option>
                ))}
              </select>
              {manager !== 'all' && (
                <span className="clear-link" onClick={() => setManager('all')} style={{fontSize:'0.72rem'}}>× All</span>
              )}
            </div>
          )}
        </div>
        <div className="topbar-right">
          <button className="btn btn-export" onClick={() => setShowExport(true)}>⬆ Export for OneNote</button>
          <button className="btn btn-ghost" onClick={() => setData(null)}>New File</button>
        </div>
      </div>

      {noDateCol && (
        <div style={{background:'var(--yellow-bg)', borderBottom:'1px solid var(--yellow-border)', padding:'0.5rem 1.5rem', fontSize:'0.8rem', color:'var(--yellow)', display:'flex', alignItems:'center', gap:'0.5rem'}}>
          <span>⚠</span>
          <span><strong>No update date column found.</strong> Add <code style={{fontFamily:'var(--mono)', fontSize:'0.75rem'}}>sys_updated_on</code> to your ServiceNow export to enable cadence tracking (Wed/Thu check).</span>
        </div>
      )}

      <div>
        <div className="tab-nav">
          <div className={`tab${tab==='monday'?' active':''}`} onClick={() => setTab('monday')}>
            Monday View
            {staleCount > 0 && <span className="badge badge-alert">{staleCount}</span>}
            {staleCount === 0 && attnCount > 0 && <span className="badge badge-warn">{attnCount}</span>}
          </div>
          <div className={`tab${tab==='portfolio'?' active':''}`} onClick={() => setTab('portfolio')}>
            Portfolio &amp; 1:1
            <span className="badge">{data.length}</span>
            {portfolioRisk > 0 && <span className="badge badge-alert">{portfolioRisk}</span>}
          </div>
          <div className={`tab${tab==='renewals'?' active':''}`} onClick={() => setTab('renewals')}>
            Renewals
            {renewalRisk > 0 && <span className="badge badge-alert">{renewalRisk}</span>}
          </div>
          <div className={`tab${tab==='compliance'?' active':''}`} onClick={() => setTab('compliance')}>
            Compliance
            {offTemplateCount > 0 && <span className="badge badge-warn">{offTemplateCount}</span>}
          </div>
        </div>

        <div className="content">
          {data.length === 0 ? (
            <div className="matrix-wrap"><div className="monday-empty">
              No accounts for {manager}. <span className="clear-link" onClick={() => setManager('all')}>Show all managers</span>
            </div></div>
          ) : (<>
          {tab === 'monday' && <MondayView data={data} notes={notes} />}
          {tab === 'portfolio' && <PortfolioView data={data} notes={notes} />}
          {tab === 'renewals' && <RenewalsView data={data} />}
          {tab === 'compliance' && <ComplianceView data={data} />}
          </>)}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
// Compile the JSX above explicitly with the CLASSIC runtime.
// Newer @babel/standalone releases default preset-react to the AUTOMATIC
// runtime, which emits `import { jsx } from "react/jsx-runtime"`. An import
// statement in a non-module script throws immediately and the page renders
// blank. Passing runtime:'classic' pins the behaviour regardless of which
// Babel version the CDN happens to serve.
(function () {
  function fail(msg, detail) {
    document.getElementById('root').innerHTML =
      '<div style="max-width:640px;margin:4rem auto;font-family:system-ui,sans-serif;' +
      'background:#fbe9e9;border:1px solid #f0c4c4;border-radius:10px;padding:1.5rem;color:#7a1c1c">' +
      '<h2 style="margin:0 0 .5rem;font-size:1.05rem">Dashboard failed to start</h2>' +
      '<p style="margin:0 0 .75rem;font-size:.9rem">' + msg + '</p>' +
      (detail ? '<pre style="white-space:pre-wrap;font-size:.75rem;background:#fff;padding:.75rem;' +
      'border-radius:6px;overflow:auto;margin:0">' + String(detail).replace(/[<>]/g, '') + '</pre>' : '') +
      '</div>';
  }

  if (typeof React === 'undefined' || typeof ReactDOM === 'undefined' ||
      typeof Babel === 'undefined' || typeof Papa === 'undefined') {
    fail('A required library did not load. This page needs internet access to fetch React, Babel and PapaParse from unpkg.com — check your connection or corporate proxy, then reload.');
    return;
  }

  var source = document.getElementById('app-source').textContent;
  var compiled;
  try {
    compiled = Babel.transform(source, {
      presets: [['react', { runtime: 'classic' }]]
    }).code;
  } catch (e) {
    fail('The app code could not be compiled.', e && e.message);
    return;
  }

  try {
    new Function('React', 'ReactDOM', 'Papa', compiled)(React, ReactDOM, Papa);
  } catch (e) {
    fail('The app crashed while starting up.', (e && e.stack) || e);
  }
})();
</script>
