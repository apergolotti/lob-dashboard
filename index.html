<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOB Status Dashboard</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface2: #f1f3f6;
      --surface3: #e9edf2;
      --border: #e2e6ec;
      --border2: #cbd2dc;
      --text: #1a2233;
      --text2: #5a647a;
      --text3: #97a0b3;
      --green: #1a9d63;
      --green-bg: #e7f6ee;
      --green-border: #bce4cf;
      --yellow: #b07d0a;
      --yellow-bg: #fcf3dc;
      --yellow-border: #ecd79a;
      --red: #d23b3b;
      --red-bg: #fbe9e9;
      --red-border: #f0c4c4;
      --blue: #2570d4;
      --blue-bg: #e8f1fc;
      --blue-border: #c2dbf6;
      --orange: #d96d1f;
      --purple: #7a4fd0;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }

    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; }

    /* Upload screen */
    .upload-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .upload-card { max-width: 520px; width: 100%; }
    .upload-card h1 { font-family: var(--mono); font-size: 1.5rem; font-weight: 600; color: var(--text); letter-spacing: -0.02em; margin-bottom: 0.25rem; }
    .upload-card .subtitle { color: var(--text2); font-size: 0.85rem; margin-bottom: 2rem; }
    .drop-zone { border: 2px dashed var(--border2); border-radius: 12px; padding: 3rem 2rem; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--surface); }
    .drop-zone:hover, .drop-zone.drag { border-color: var(--blue); background: var(--blue-bg); }
    .drop-zone .icon { font-size: 2.5rem; margin-bottom: 1rem; opacity: 0.7; }
    .drop-zone p { color: var(--text2); font-size: 0.9rem; }
    .drop-zone strong { color: var(--text); }
    .error-box { margin-top: 1rem; padding: 0.75rem 1rem; background: var(--red-bg); border: 1px solid var(--red-border); border-radius: 8px; color: var(--red); font-size: 0.85rem; }

    /* Main layout */
    .app { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.875rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; position: sticky; top: 0; z-index: 100; }
    .topbar-left { display: flex; align-items: center; gap: 1rem; }
    .brand { font-family: var(--mono); font-size: 0.95rem; font-weight: 600; color: var(--text); letter-spacing: 0.02em; }
    .file-chip { font-size: 0.75rem; color: var(--text3); font-family: var(--mono); background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 0.2rem 0.5rem; }
    .topbar-right { display: flex; align-items: center; gap: 0.5rem; }
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.45rem 0.85rem; border-radius: 6px; font-size: 0.8rem; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all 0.15s; font-family: var(--sans); }
    .btn-ghost { background: transparent; border-color: var(--border); color: var(--text2); }
    .btn-ghost:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-export { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }
    .btn-export:hover { background: #d6efe1; }

    /* Tab nav */
    .tab-nav { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--surface); padding: 0 1.5rem; }
    .tab { padding: 0.65rem 1.1rem; font-size: 0.82rem; font-weight: 500; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; white-space: nowrap; }
    .tab:hover { color: var(--text2); }
    .tab.active { color: var(--blue); border-bottom-color: var(--blue); }
    .tab .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; font-size: 0.7rem; font-weight: 600; margin-left: 0.35rem; background: var(--surface3); color: var(--text2); }
    .tab.active .badge { background: var(--blue-bg); color: var(--blue); }
    .badge-warn { background: var(--yellow-bg) !important; color: var(--yellow) !important; }
    .badge-alert { background: var(--red-bg) !important; color: var(--red) !important; }

    /* Content area */
    .content { padding: 1.25rem 1.5rem; overflow-y: auto; }

    /* Stats row */
    .stats-row { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; min-width: 90px; flex: 1; cursor: pointer; transition: all 0.15s; }
    .stat-card:hover { border-color: var(--border2); }
    .stat-card.active { border-color: var(--blue); background: var(--blue-bg); }
    .stat-label { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--mono); margin-bottom: 0.25rem; }
    .stat-value { font-size: 1.6rem; font-weight: 600; font-family: var(--mono); color: var(--text); line-height: 1; }
    .stat-card.green .stat-value { color: var(--green); }
    .stat-card.yellow .stat-value { color: var(--yellow); }
    .stat-card.red .stat-value { color: var(--red); }
    .stat-card.orange .stat-value { color: var(--orange); }
    .stat-card.blue .stat-value { color: var(--blue); }

    /* Filter bar */
    .filter-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .filter-bar input, .filter-bar select { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 0.4rem 0.65rem; font-size: 0.82rem; font-family: var(--sans); outline: none; }
    .filter-bar input { flex: 1; min-width: 160px; }
    .filter-bar input::placeholder { color: var(--text3); }
    .filter-bar input:focus, .filter-bar select:focus { border-color: var(--blue); }
    .filter-bar select option { background: var(--surface2); }
    .clear-link { font-size: 0.78rem; color: var(--blue); cursor: pointer; white-space: nowrap; }
    .clear-link:hover { text-decoration: underline; }

    /* Table */
    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--surface2); }
    th { padding: 0.6rem 0.875rem; text-align: left; font-size: 0.7rem; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--mono); white-space: nowrap; }
    th button { background: none; border: none; color: inherit; cursor: pointer; font: inherit; letter-spacing: inherit; display: flex; align-items: center; gap: 4px; }
    th button:hover { color: var(--text); }
    td { padding: 0.7rem 0.875rem; border-top: 1px solid var(--border); vertical-align: middle; }
    tr.data-row { cursor: pointer; transition: background 0.1s; }
    tr.data-row:hover { background: var(--surface2); }
    tr.data-row.expanded { background: var(--surface2); }
    tr.expand-row td { background: var(--surface2); border-top: none; padding: 0; }

    .customer-name { font-weight: 500; color: var(--text); font-size: 0.875rem; }
    .lob-code { font-family: var(--mono); font-size: 0.72rem; color: var(--text3); margin-top: 1px; }
    .owner-name { color: var(--text2); font-size: 0.82rem; }

    /* Status badges */
    .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 0.2rem 0.55rem; border-radius: 4px; font-size: 0.72rem; font-weight: 600; font-family: var(--mono); letter-spacing: 0.03em; border: 1px solid; }
    .status-Green { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
    .status-Yellow { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-border); }
    .status-Red { background: var(--red-bg); color: var(--red); border-color: var(--red-border); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot-Green { background: var(--green); }
    .dot-Yellow { background: var(--yellow); }
    .dot-Red { background: var(--red); }

    /* Date badge */
    .date-badge { display: inline-flex; align-items: center; gap: 4px; padding: 0.18rem 0.5rem; border-radius: 4px; font-size: 0.72rem; font-family: var(--mono); border: 1px solid; }
    .date-fresh { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
    .date-warn { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-border); }
    .date-stale { background: var(--red-bg); color: var(--red); border-color: var(--red-border); }

    /* Flag chips */
    .flags { display: flex; gap: 4px; flex-wrap: wrap; }
    .flag { padding: 0.15rem 0.45rem; border-radius: 3px; font-size: 0.68rem; font-weight: 600; font-family: var(--mono); }
    .flag-issue { background: var(--yellow-bg); color: var(--yellow); }
    .flag-renewal { background: var(--orange); color: #fff; opacity: 0.85; }
    .flag-cancel { background: var(--red-bg); color: var(--red); }
    .flag-interruptions { background: var(--surface3); color: var(--text2); }
    .flag-stale { background: var(--red-bg); color: var(--red); }

    /* Expand panel */
    .expand-panel { padding: 1rem 1.25rem; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    @media (max-width: 1100px) { .expand-panel { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 700px) { .expand-panel { grid-template-columns: 1fr; } }
    .panel-section { background: var(--surface3); border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem; }
    .panel-section h4 { font-size: 0.7rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 0.5rem; }
    .field-row { margin-bottom: 0.5rem; }
    .field-label { font-size: 0.68rem; color: var(--text3); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.05em; }
    .field-val { font-size: 0.82rem; color: var(--text); margin-top: 1px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .field-val.empty { color: var(--text3); font-style: italic; }
    .field-val a { color: var(--blue); text-decoration: none; font-size: 0.78rem; }
    .field-val a:hover { text-decoration: underline; }
    .highlight-issue { background: rgba(240,180,41,0.08); border-left: 3px solid var(--yellow); padding: 0.4rem 0.5rem; border-radius: 0 4px 4px 0; margin: -0.1rem 0; }

    /* Boxed field layout for expanded account */
    .field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.6rem; }
    .field-box { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem 0.7rem; display: flex; flex-direction: column; }
    .field-box.wide { grid-column: 1 / -1; }
    .field-box.missing { background: var(--red-bg); border-color: var(--red-border); }
    .field-box.has-issue { background: var(--yellow-bg); border-color: var(--yellow-border); }
    .field-box-label { font-size: 0.66rem; color: var(--text3); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.3rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .field-box.missing .field-box-label { color: var(--red); }
    .field-box.has-issue .field-box-label { color: var(--yellow); }
    .field-box-val { font-size: 0.82rem; color: var(--text); line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .field-box-val.empty { color: var(--text3); font-style: italic; }
    .field-box-val a { color: var(--blue); text-decoration: none; font-size: 0.78rem; }
    .field-box-val a:hover { text-decoration: underline; }
    .missing-tag { font-size: 0.6rem; font-weight: 600; background: var(--red); color: #fff; padding: 0.08rem 0.35rem; border-radius: 3px; letter-spacing: 0.04em; }
    .group-label { grid-column: 1 / -1; font-size: 0.66rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); font-weight: 600; margin-top: 0.3rem; padding-bottom: 0.1rem; border-bottom: 1px solid var(--border); }
    .group-label:first-child { margin-top: 0; }
    @media (max-width: 700px) { .expand-top { grid-template-columns: 1fr !important; } }

    /* Notes area */
    .notes-area { grid-column: 1 / -1; }
    .notes-textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 0.6rem 0.75rem; font-size: 0.82rem; font-family: var(--sans); resize: vertical; min-height: 70px; outline: none; }
    .notes-textarea:focus { border-color: var(--blue); }
    .notes-controls { display: flex; gap: 0.5rem; margin-top: 0.5rem; align-items: center; }
    .notes-saved { font-size: 0.75rem; color: var(--green); }

    /* Monday view */
    .monday-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 900px) { .monday-wrap { grid-template-columns: 1fr; } }
    .monday-section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .monday-section-header { padding: 0.65rem 1rem; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .monday-section-title { font-size: 0.75rem; font-family: var(--mono); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    .monday-row { padding: 0.6rem 1rem; border-top: 1px solid var(--border); display: flex; align-items: flex-start; gap: 0.75rem; }
    .monday-row:first-child { border-top: none; }
    .monday-row-main { flex: 1; min-width: 0; }
    .monday-row-customer { font-weight: 500; font-size: 0.85rem; color: var(--text); }
    .monday-row-sub { font-size: 0.75rem; color: var(--text2); margin-top: 2px; }
    .monday-row-meta { font-size: 0.72rem; color: var(--text3); font-family: var(--mono); margin-top: 3px; }
    .monday-empty { padding: 1.5rem 1rem; text-align: center; color: var(--text3); font-size: 0.82rem; }

    /* Owner summary cards */
    .owner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.75rem; margin-bottom: 1.25rem; }
    .owner-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.875rem 1rem; cursor: pointer; transition: all 0.15s; }
    .owner-card:hover { border-color: var(--border2); background: var(--surface2); }
    .owner-card.selected { border-color: var(--blue); }
    .owner-card-name { font-weight: 500; font-size: 0.875rem; color: var(--text); margin-bottom: 0.4rem; }
    .owner-card-stats { display: flex; gap: 0.5rem; font-size: 0.72rem; font-family: var(--mono); }
    .owner-card-alerts { margin-top: 0.4rem; display: flex; gap: 4px; flex-wrap: wrap; }

    /* Export modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(26,34,51,0.45); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 1rem; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 700px; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; }
    .modal-header { padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-header h2 { font-family: var(--mono); font-size: 1rem; font-weight: 600; }
    .modal-body { flex: 1; overflow-y: auto; padding: 1.25rem; }
    .modal-footer { padding: 0.875rem 1.25rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; justify-content: flex-end; }
    .export-owner-row { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0.875rem 1rem; margin-bottom: 0.75rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .export-owner-info { flex: 1; min-width: 0; }
    .export-owner-name { font-weight: 500; font-size: 0.9rem; color: var(--text); }
    .export-owner-meta { font-size: 0.75rem; color: var(--text2); margin-top: 3px; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .export-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .preview-box { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; font-family: var(--mono); font-size: 0.72rem; color: var(--text2); white-space: pre-wrap; max-height: 300px; overflow-y: auto; margin-top: 1rem; line-height: 1.6; }

    .table-footer { padding: 0.6rem 0.875rem; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--text3); font-family: var(--mono); }

    .section-full { grid-column: 1 / -1; }
    .raw-toggle { font-size: 0.72rem; color: var(--text3); cursor: pointer; }
    .raw-toggle:hover { color: var(--text2); }
    .raw-content { font-family: var(--mono); font-size: 0.7rem; color: var(--text3); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.5rem; max-height: 160px; overflow-y: auto; margin-top: 0.4rem; white-space: pre-wrap; word-break: break-all; }

    /* Analysis flags */
    .analysis-flag { display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.5rem 0.65rem; border-radius: 5px; margin-bottom: 0.4rem; font-size: 0.78rem; }
    .analysis-flag.warn { background: var(--yellow-bg); border: 1px solid var(--yellow-border); color: var(--yellow); }
    .analysis-flag.alert { background: var(--red-bg); border: 1px solid var(--red-border); color: var(--red); }
    .analysis-flag.info { background: var(--blue-bg); border: 1px solid var(--blue-border); color: var(--blue); }
    .analysis-flag.fix { background: #fdf2e8; border: 1px solid #f0d0a8; color: var(--orange); }
    .analysis-flag.template { background: #f3eefc; border: 1px solid #ddccf5; color: var(--purple); }

    /* Portfolio matrix */
    .matrix-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; }
    .matrix { width: 100%; border-collapse: collapse; min-width: 780px; }
    .matrix th { padding: 0.55rem 0.6rem; font-size: 0.66rem; text-align: center; }
    .matrix th.acct-col { text-align: left; min-width: 190px; }
    .matrix td { padding: 0.5rem 0.6rem; border-top: 1px solid var(--border); }
    .matrix td.cell { text-align: center; cursor: help; }
    .matrix tr.grp td { background: var(--surface2); font-family: var(--mono); font-size: 0.7rem; color: var(--text2); letter-spacing: 0.05em; padding: 0.4rem 0.6rem; font-weight: 600; }
    .matrix tr.acct:hover { background: var(--surface2); }
    .pill { display: inline-block; padding: 0.16rem 0.5rem; border-radius: 10px; font-size: 0.68rem; font-weight: 600; font-family: var(--mono); border: 1px solid; white-space: nowrap; }
    .cell-note { font-size: 0.62rem; color: var(--text3); margin-top: 3px; max-width: 150px; margin-left: auto; margin-right: auto; line-height: 1.3; }
    .matrix tr.acct { cursor: pointer; }
    .matrix tr.acct.open { background: var(--surface2); }
    .matrix tr.expand-row td { background: var(--surface2); padding: 0; border-top: none; }
    .rollup-why { font-size: 0.62rem; color: var(--text3); margin-top: 0.45rem; line-height: 1.35; border-top: 1px solid var(--border); padding-top: 0.4rem; }

    /* Domain scorecard inside an expanded account */
    .domain-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0.6rem; padding: 0.9rem 1.25rem 0; }
    .ds-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem 0.7rem; }
    .ds-title { font-size: 0.64rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); }
    .ds-state { font-size: 0.82rem; font-weight: 600; margin-top: 2px; }
    .ds-detail { font-size: 0.72rem; color: var(--text2); margin-top: 2px; line-height: 1.35; }
    .ds-why { font-size: 0.6rem; color: var(--text3); margin-top: 0.35rem; border-top: 1px solid var(--border); padding-top: 0.3rem; line-height: 1.3; }

    /* Single-box update text */
    .update-box { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .update-box-head { padding: 0.5rem 0.75rem; background: var(--surface3); border-bottom: 1px solid var(--border); font-size: 0.66rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .update-missing { color: var(--red); text-transform: none; letter-spacing: 0; font-size: 0.68rem; }
    .update-box-body { padding: 0.8rem 0.9rem; font-size: 0.8rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; color: var(--text); max-height: 460px; overflow-y: auto; }

    /* Domain rollup cards */
    .rollup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.7rem; margin-bottom: 1.1rem; }
    .rollup-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 0.85rem; }
    .rollup-title { font-size: 0.68rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); margin-bottom: 0.5rem; }
    .rollup-bar { display: flex; height: 7px; border-radius: 4px; overflow: hidden; background: var(--surface3); margin-bottom: 0.45rem; }
    .rollup-legend { display: flex; flex-wrap: wrap; gap: 0.4rem; font-size: 0.68rem; font-family: var(--mono); }

    /* 1:1 view */
    .oo-header { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.9rem 1.1rem; margin-bottom: 1rem; }
    .oo-owner-tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .oo-owner-tab { padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.8rem; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text2); transition: all 0.15s; }
    .oo-owner-tab:hover { border-color: var(--border2); color: var(--text); }
    .oo-owner-tab.active { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); font-weight: 500; }
    .oo-owner-tab .cnt { font-family: var(--mono); font-size: 0.7rem; opacity: 0.75; margin-left: 0.3rem; }
    .oo-acct { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.7rem; overflow: hidden; }
    .oo-acct-head { padding: 0.7rem 0.9rem; display: flex; align-items: center; gap: 0.75rem; cursor: pointer; }
    .oo-acct-head:hover { background: var(--surface2); }
    .oo-acct-name { font-weight: 500; font-size: 0.88rem; flex: 1; }
    .oo-domains { display: flex; gap: 0.3rem; flex-wrap: wrap; }
    .oo-body { border-top: 1px solid var(--border); padding: 0.85rem 0.9rem; background: var(--surface2); }
    .talk-item { display: flex; gap: 0.5rem; padding: 0.4rem 0.55rem; border-radius: 5px; margin-bottom: 0.35rem; font-size: 0.8rem; background: var(--surface); border: 1px solid var(--border); }
    .ask-q { font-style: italic; color: var(--text2); }
    .print-only { display: none; }
    @media print {
      body { background: #fff; }
      .topbar, .tab-nav, .oo-owner-tabs, .btn { display: none !important; }
      .oo-body { display: block !important; }
      .print-only { display: block; }
    }
    .analysis-flag-icon { flex-shrink: 0; margin-top: 1px; }
    .no-flags { font-size: 0.78rem; color: var(--green); display: flex; align-items: center; gap: 0.4rem; }

    * { scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/plain" id="app-source">
const { useState, useMemo, useEffect, useCallback } = React;

// ── Utilities ──────────────────────────────────────────────────────────────

function parseDate(val) {
  if (!val) return null;
  const s = String(val).trim();
  // Time part, if any (24h or 12h with am/pm)
  const tm = s.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(am|pm)?/i);
  let hh = tm ? +tm[1] : 0, mi = tm ? +tm[2] : 0, ss = tm && tm[3] ? +tm[3] : 0;
  if (tm && tm[4]) { const pm = /pm/i.test(tm[4]); if (pm && hh < 12) hh += 12; if (!pm && hh === 12) hh = 0; }

  // YYYY-MM-DD  (ISO first, so it isn't mistaken for M-D-Y)
  let m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3], hh, mi, ss);

  // M/D/YY, M/D/YYYY, MM-DD-YYYY — US order, 1- or 2-digit month/day,
  // 2- or 4-digit year. Covers both the old ServiceNow export format
  // (06-01-2026 10:49:05) and the current one (8/3/26 13:46).
  m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[1]-1, +m[2], hh, mi, ss); }

  return null;
}

// First integer in a string — "3  (RCA PRB0019048)" is 3 interruptions, not
// 30019048. Stripping every non-digit would swallow ticket numbers.
function firstInt(v) {
  if (!v) return null;
  const m = String(v).match(/\d+/);
  return m ? parseInt(m[0], 10) : null;
}

function daysAgo(val) {
  const d = parseDate(val);
  if (!d) return 999;
  // Compare calendar dates (strip time) so "days ago" counts whole days correctly
  const a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const now = new Date();
  const b = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((b - a) / 86400000);
}

// Cadence rule: owners update each Thursday. An update is "on cadence" only if
// it lands on the most recent Wednesday or Thursday. Anything else — Friday,
// the weekend, or earlier than that Wednesday — is flagged.
function lastThursday(ref) {
  const d = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
  const diff = (d.getDay() - 4 + 7) % 7; // 4 = Thursday
  d.setDate(d.getDate() - diff);
  return d;
}

function isStale(val) {
  const d = parseDate(val);
  if (!d) return true;
  const upd = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const thu = lastThursday(new Date());
  const wed = new Date(thu); wed.setDate(thu.getDate() - 1);
  return upd !== thu.getTime() && upd !== wed.getTime();
}

function weekdayName(val) {
  const d = parseDate(val);
  if (!d) return '';
  return d.toLocaleDateString('en-US', { weekday: 'long' });
}

function formatDate(val) {
  const d = parseDate(val);
  if (!d) return '—';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' });
}

function normalizeRow(r) {
  return {
    lob:       (r['u_lob.u_lob_details'] || r['u_lob'] || '').trim(),
    customer:  (r['u_customer_relationship.u_customer_account'] || r['u_lob.u_customer_account'] || '').trim(),
    owner:     (r['u_project_owner'] || '').trim(),
    sentiment: (r['u_status_overall'] || 'Green').trim(),
    operations:(r['u_status_operations'] || 'Green').trim(),
    updated:   (r['sys_updated_on'] || r['sys_updated'] || '').trim(),
    contractEnd: (r['u_customer_relationship.u_contract_end'] || r['u_contract_end']
               || r['u_lob.u_contract_end'] || '').trim(),
    status:    (r['u_lob_status'] || '').replace(/\r\n?/g, '\n').trim(),
    description:(r['u_project_description'] || '').trim(),
  };
}

function clean(v) {
  if (v == null) return null;
  v = String(v).trim();
  const low = v.toLowerCase().replace(/[.\s]/g, '');
  if (!v || ['na','n/a','none','no','-'].includes(low)) return null;
  return v;
}

// True when an Issues/Concerns entry is really a "nothing to report" note
// (e.g. "No issues", "No customer issues", "None at this time", "Nothing to report").
function isNoIssues(v) {
  if (!v) return true;
  const s = v.trim().toLowerCase().replace(/[.\u2013\-]/g, ' ').replace(/\s+/g, ' ').trim();
  if (['no','none','nil','na','n a'].includes(s)) return true;
  if (/^(no|none|nil|nothing)\b/.test(s) && /(issue|concern|risk|report|problem)/.test(s) && s.split(' ').length <= 6) return true;
  return false;
}

// Slice the section starting after `startRe` and ending before the first
// matching `endRes`. Returns '' if the section header isn't found.
function sect(t, startRe, ...endRes) {
  const sm = t.match(startRe);
  if (!sm) return '';
  const start = sm.index + sm[0].length;
  const rest = t.slice(start);
  let end = rest.length;
  for (const er of endRes) {
    const em = rest.match(er);
    if (em && em.index < end) end = em.index;
  }
  return rest.slice(0, end);
}

// Single-line field value following a label (won't cross newlines).
function f1(t, re) {
  if (!t) return null;
  const m = t.match(re);
  return m ? clean(m[1]) : null;
}

// Multi-line block from after `startRe` to the first of `nextLabels`.
function blk(text, startRe, nextLabels) {
  if (!text) return null;
  const sm = text.match(startRe);
  if (sm == null) return null;
  const start = sm.index + sm[0].length;
  const rest = text.slice(start);
  let end = rest.length;
  (nextLabels || []).forEach(nl => {
    const em = rest.match(nl);
    if (em && em.index < end) end = em.index;
  });
  return clean(rest.slice(0, end));
}

// Prefer a URL after the label; fall back to same-line text.
function linkField(t, labelRe) {
  if (!t) return null;
  const u = t.match(new RegExp(labelRe.source + '[\\s\\S]*?(https?://[^\\s\\n]+)', labelRe.flags));
  if (u) return u[1];
  const m = t.match(new RegExp(labelRe.source + '[ \\t]*([^\\n]*)', labelRe.flags));
  return m ? clean(m[1]) : null;
}

// True when a field contains placeholder or non-answer text
function isPlaceholder(v) {
  if (!v) return false;
  const s = v.trim().toLowerCase();
  if (['tbd','tbc','to be determined','to be confirmed','pending'].includes(s)) return true;
  // Template boilerplate left unreplaced
  if (v.includes('- version, date, contract needs:') && v.trim().startsWith('- version')) return true;
  return false;
}

// True when weekly wins is clearly filler rather than real accomplishments
function isThinFiller(v) {
  if (!v) return false;
  if (v.trim().length < 30) return true;
  const s = v.trim().toLowerCase();
  return /^(no major issues?|no issues? or incidents?|system(s)? (is |are )?(stable|healthy|operational|running)|nothing (new|to report|significant)|all systems? (up|green|operational|normal)|no updates? this week|no significant (updates?|changes?)|no new (updates?|issues?))/.test(s);
}

function parseStatus(status) {
  if (!status) return {};
  const t = status;

  // Carve the template into its sections so fields can't bleed across them.
  const weekly = sect(t, /^/, /-{5,}/, /\n\s*Service Health Reviews/i);
  const shr    = sect(t, /Service Health Reviews/i, /\n\s*Customer Health/i, /\n\s*Profitability/i);
  const health = sect(t, /Customer Health/i, /\n\s*Profitability/i, /\n\s*Lifecycle/i);
  const profit = sect(t, /\n\s*Profitability/i, /\n\s*Lifecycle/i, /\n\s*Renewal/i);
  const life   = sect(t, /Lifecycle Planning/i, /\n\s*Renewal/i);
  const renew  = sect(t, /Renewal\s+Status/i);

  // "Next Week's Focus" is written many ways: with/without the apostrophe,
  // "Next Weeks Focus", or just "Next Weeks:" (Key Davis). One marker matches
  // them all so blocks terminate correctly and the field is captured.
  const NEXT_FOCUS = /\n\s*Next\s+Week['\u2019]?s?(?:\s+Focus)?\s*:/i;
  return {
    // CSDM-entered date at the top of the update. Handles "Date:", "Updated
    // Date:", "Update Date:", "Date -", "Updated 8/13/2026", and a bare date on
    // the first line — all formats seen across the team's exports.
    reportedDate: (() => {
      const m = t.match(/^\s*(?:Update[d]?\s+)?Date\s*[:\-]\s*([^\n]+)/i);
      if (m) return clean(m[1]);
      const u = t.match(/^\s*Updated\s+(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/i);
      if (u) return clean(u[1]);
      const b = t.match(/^\s*(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})\b/);
      if (b) return clean(b[1]);
      return null;
    })(),
    // Weekly update
    weeklyWins: blk(weekly, /Weekly (?:Accomplishments?|Wins?)\s*:/i, [/\n\s*Issues/i, /\n\s*Changes\s*:/i, /\n\s*Upcoming/i, NEXT_FOCUS]),
    issues:     (() => { const v = blk(weekly, /Issues\s*\/?\s*(?:Concerns?|Risks?)?\s*:/i, [/\n\s*Changes\s*:/i, /\n\s*Upcoming/i, NEXT_FOCUS]); return isNoIssues(v) ? null : v; })(),
    changes:    blk(weekly, /\n\s*Changes\s*:/i, [/\n\s*Upcoming/i, NEXT_FOCUS]),
    upcoming:   blk(weekly, /Upcoming Milestones?\s*:/i, [NEXT_FOCUS]),
    nextFocus:  blk(weekly, /Next\s+Week['\u2019]?s?(?:\s+Focus)?\s*:/i, []),
    // Service Health Reviews
    frequency:  f1(shr, /Frequency of service health reviews?\s*:[ \t]*([^\n]*)/i),
    completed:  f1(shr, /Completed this period\s*\??\s*:?[ \t]*([^\n]*)/i),
    participation: blk(shr, /Customer Participation\s*:/i, [/\n\s*Link\s*:/i]),
    shrLink:    linkField(shr, /\n\s*Link\s*:/i),
    // Customer Health
    sla:        f1(health, /(?:Contractual\s+)?SLA\s*:[ \t]*([^\n]*)/i),
    interruptions: f1(health, /interruptions?[^:\n]*:[ \t]*([^\n]*)/i),
    meetingNotesLink: f1(health, /Weekly meeting notes link\s*:[ \t]*([^\n]*)/i),
    // Profitability
    profitabilityLink: linkField(profit, /Link\s*:/i),
    // Lifecycle Planning
    currentVersions: f1(life, /Current Versions?\s*:[ \t]*([^\n]*)/i),
    nextVersion: blk(life, /Next Version[^:]*:/i, [/\n\s*RITM/i, /\n\s*\*/]),
    // Renewal Status
    within9mo:  f1(renew, /Within 9 months? of contract end\s*\??\s*:?[ \t]*([^\n]*)/i),
    renewalFeedback: blk(renew, /Customer feedback[^:]*:/i, [/\n\s*Next steps/i]),
    renewalNextSteps: blk(renew, /Next steps\s*:/i, [/\n\s*Link to renewal/i]),
    renewalLink: linkField(renew, /Link to renewal presentation\/form\s*:/i),
    renewalRaw: (renew || '').trim(),
  };
}

// Returns the template fields the CSDM left TRULY BLANK, as {key,label}.
// Raw presence is checked — a deliberate answer like "No", "None", "0", or
// "N/A" counts as provided (the field was addressed), so only an empty field
// is reported. Issues/Concerns is excluded (blank = "no issues", the good
// state). Renewal sub-fields are only expected when within 9 months of end.
function computeMissing(status) {
  if (!status || status.trim().length < 20) {
    return [{ key: 'all', label: 'Entire update is blank' }];
  }
  const t = status;
  const weekly = sect(t, /^/, /-{5,}/, /\n\s*Service Health Reviews/i);
  const shr    = sect(t, /Service Health Reviews/i, /\n\s*Customer Health/i, /\n\s*Profitability/i);
  const health = sect(t, /Customer Health/i, /\n\s*Profitability/i, /\n\s*Lifecycle/i);
  const profit = sect(t, /\n\s*Profitability/i, /\n\s*Lifecycle/i, /\n\s*Renewal/i);
  const life   = sect(t, /Lifecycle Planning/i, /\n\s*Renewal/i);
  const renew  = sect(t, /Renewal\s+Status/i);

  const present = v => v != null && v.trim() !== '' && v.trim() !== '-';
  const rawLine = (text, labelRe) => {
    if (!text) return null;
    const m = text.match(new RegExp(labelRe.source + '[ \\t]*([^\\n]*)', labelRe.flags));
    return m ? (m[1] || '') : null;
  };
  const rawBlock = (text, startRe, nextLabels) => {
    if (!text) return null;
    const sm = text.match(startRe);
    if (!sm) return null;
    const start = sm.index + sm[0].length;
    const rest = text.slice(start);
    let end = rest.length;
    (nextLabels || []).forEach(nl => { const em = rest.match(nl); if (em && em.index < end) end = em.index; });
    return rest.slice(0, end);
  };
  const hasLink = (section, labelRe) => {
    if (!section) return false;
    if (new RegExp(labelRe.source + '[\\s\\S]*?https?://', labelRe.flags).test(section)) return true;
    return present(rawLine(section, labelRe));
  };

  const NEXT_FOCUS = /\n\s*Next\s+Week['\u2019]?s?(?:\s+Focus)?\s*:/i;
  const within9 = /yes/i.test(rawLine(renew, /Within 9 months? of contract end\s*\??\s*:?/i) || '');

  const checks = [
    ['weeklyWins', 'Weekly Accomplishments', present(rawBlock(weekly, /Weekly (?:Accomplishments?|Wins?)\s*:/i, [/\n\s*Issues/i, /\n\s*Changes\s*:/i, /\n\s*Upcoming/i, NEXT_FOCUS]))],
    ['changes', 'Changes', present(rawBlock(weekly, /\n\s*Changes\s*:/i, [/\n\s*Upcoming/i, NEXT_FOCUS]))],
    ['upcoming', 'Upcoming Milestones', present(rawBlock(weekly, /Upcoming Milestones?\s*:/i, [NEXT_FOCUS]))],
    ['nextFocus', "Next Week's Focus", present(rawBlock(weekly, /Next\s+Week['\u2019]?s?(?:\s+Focus)?\s*:/i, []))],
    ['frequency', 'SHR Frequency', present(rawLine(shr, /Frequency of service health reviews?\s*:/i))],
    ['completed', 'SHR Completed This Period', present(rawLine(shr, /Completed this period\s*\??\s*:?/i))],
    ['participation', 'Customer Participation', present(rawBlock(shr, /Customer Participation\s*:/i, [/\n\s*Link\s*:/i]))],
    ['shrLink', 'SHR Link', hasLink(shr, /\n\s*Link\s*:/i)],
    ['sla', 'SLA', present(rawLine(health, /(?:Contractual\s+)?SLA\s*:/i))],
    ['interruptions', 'Service Interruptions (3mo)', present(rawLine(health, /interruptions?[^:\n]*:/i))],
    ['meetingNotesLink', 'Weekly Meeting Notes Link', present(rawLine(health, /Weekly meeting notes link\s*:/i))],
    ['profitabilityLink', 'Profitability Link', hasLink(profit, /Link\s*:/i)],
    ['currentVersions', 'Current Versions', present(rawLine(life, /Current Versions?\s*:/i))],
    ['nextVersion', 'Next Version / Decommission Plan', present(rawBlock(life, /Next Version[^:]*:/i, [/\n\s*RITM/i, /\n\s*\*/]))],
    ['within9mo', 'Within 9 Months of Contract End', present(rawLine(renew, /Within 9 months? of contract end\s*\??\s*:?/i))],
  ];
  if (within9) {
    checks.push(['renewalFeedback', 'Renewal Customer Feedback', present(rawBlock(renew, /Customer feedback[^:]*:/i, [/\n\s*Next steps/i]))]);
    checks.push(['renewalNextSteps', 'Renewal Next Steps', present(rawBlock(renew, /Next steps\s*:/i, [/\n\s*Link to renewal/i]))]);
    checks.push(['renewalLink', 'Renewal Presentation / Form Link', hasLink(renew, /Link to renewal presentation\/form\s*:/i)]);
  }
  return checks.filter(([, , ok]) => !ok).map(([key, label]) => ({ key, label }));
}

// Intentional pointer / non-tracked records that shouldn't be judged on the
// template: MPD and MPT both just say "SEE MPM", and anything explicitly
// marked "IGNORE LOB" (e.g. ALV, tracked in PPM). These are excluded from
// template compliance and the leaderboard.
function isPointerLob(row) {
  if (!row) return false;
  const s = (row.status || '');
  if (/\bsee\s+mpm\b/i.test(s)) return true;
  if (/ignore\s+lob/i.test(s) || /ignore\s+lob/i.test(row.description || '')) return true;
  if (/tracked in ppm/i.test(row.description || '') && s.trim().length < 120) return true;
  return false;
}

// Checks a status update against the standard LOB template and returns the
// ways it deviates, as {sev, msg}. 'major' = a required heading/section is
// missing entirely; 'minor' = a non-standard label was used in its place.
// This is about FORMAT (did they follow the template?), separate from
// computeMissing which is about CONTENT (did they fill a field in?).
function checkTemplate(status, row) {
  // Skip intentional pointer/ignore records entirely.
  if (isPointerLob(row || { status })) return [];
  if (!status || status.trim().length < 20)
    return [{ sev: 'major', msg: 'No content to check against the template' }];
  const t = status;
  const d = [];

  // Weekly update headings
  if (!/Weekly\s+Accomplishments\s*:/i.test(t)) {
    if (/Weekly\s+Wins\s*:/i.test(t))
      d.push({ sev: 'minor', msg: 'Uses "Weekly Wins" — the template label is "Weekly Accomplishments"' });
    else
      d.push({ sev: 'major', msg: 'Missing the "Weekly Accomplishments:" heading' });
  }
  if (!/Issues\s*\/\s*Concerns\s*:/i.test(t)) {
    if (/Issues\s*\/\s*Risks\s*:/i.test(t))
      d.push({ sev: 'minor', msg: 'Uses "Issues/Risks" — the template label is "Issues/Concerns"' });
    else if (/\bIssues\b/i.test(t))
      d.push({ sev: 'minor', msg: '"Issues/Concerns:" heading is worded differently than the template' });
    else
      d.push({ sev: 'major', msg: 'Missing the "Issues/Concerns:" heading' });
  }
  if (!/\bChanges\s*:/i.test(t))              d.push({ sev: 'minor', msg: 'Missing the "Changes:" line' });
  if (!/Upcoming\s+Milestones?\s*:/i.test(t)) d.push({ sev: 'minor', msg: 'Missing the "Upcoming Milestones:" line' });
  if (!/Next\s+Week['\u2019]?s\s+Focus\s*:/i.test(t)) {
    if (/Next\s+Weeks?\b/i.test(t))
      d.push({ sev: 'minor', msg: 'Uses "Next Weeks"/"Next Weeks Focus" — the template label is "Next Week\u2019s Focus"' });
    else
      d.push({ sev: 'major', msg: 'Missing the "Next Week\u2019s Focus:" line' });
  }

  // Standing section headers
  if (!/Service\s+Health\s+Reviews/i.test(t)) d.push({ sev: 'major', msg: 'Missing the "Service Health Reviews" section' });
  if (!/Customer\s+Health/i.test(t))          d.push({ sev: 'major', msg: 'Missing the "Customer Health" section' });
  if (!/Profitability/i.test(t))               d.push({ sev: 'major', msg: 'Missing the "Profitability" section' });
  if (!/Lifecycle\s+Planning/i.test(t))       d.push({ sev: 'major', msg: 'Missing the "Lifecycle Planning" section' });
  if (!/Renewal\s+Status/i.test(t))           d.push({ sev: 'major', msg: 'Missing the "Renewal Status" section' });

  // Field-label variants inside sections
  if (/Customer\s+Health/i.test(t) && !/(^|\n)\s*SLA\s*:/i.test(t) && /Contractual\s+SLA\s*:/i.test(t))
    d.push({ sev: 'minor', msg: 'Uses "Contractual SLA" — the template label is just "SLA"' });
  if (!/-{5,}/.test(t))
    d.push({ sev: 'minor', msg: 'Missing the dashed divider between the weekly update and the standing sections' });

  return d;
}

// Analyze an account and return flagged observations.
// Types: 'alert' (urgent/risk), 'warn' (discussion topic), 'info' (FYI),
//        'fix' (CSDM needs to correct their update),
//        'template' (CSDM is not following the standard template)
function analyzeAccount(row, sections) {
  const flags = [];
  const days = daysAgo(row.updated);
  const { issues, upcoming, nextFocus, interruptions, within9mo,
          renewalFeedback, renewalNextSteps, nextVersion,
          currentVersions, weeklyWins } = sections;

  // ── Cadence ──────────────────────────────────────────────────────────────
  if (!row.updated || days === 999)
    flags.push({ type: 'alert', msg: 'No update date recorded — was LOB Details updated?' });
  else if (isStale(row.updated))
    flags.push({ type: 'alert', msg: `Last updated ${weekdayName(row.updated)}, ${formatDate(row.updated)} (${days}d ago) — off the Wed/Thu cadence` });

  if (!row.status || row.status.trim().length < 50)
    flags.push({ type: 'alert', msg: 'Status field is empty or very thin — needs meaningful content' });

  // The CSDM stamps a "Date:" at the top of the template. If the record was
  // touched on cadence but that date is stale, the content is likely carried
  // over from a previous week rather than genuinely refreshed.
  if (sections.reportedDate) {
    const rd = parseDate(sections.reportedDate);
    if (rd && isStale(sections.reportedDate) && row.updated && !isStale(row.updated))
      flags.push({ type: 'warn', msg: `Record updated on cadence but the update is dated ${formatDate(sections.reportedDate)} — is this content carried over from a prior week?` });
  }

  // ── Status consistency ────────────────────────────────────────────────────
  if (issues && row.sentiment === 'Green')
    flags.push({ type: 'warn', msg: 'Issues listed but Customer Sentiment is Green — may be understating risk' });
  if (issues && row.operations === 'Green')
    flags.push({ type: 'warn', msg: 'Issues listed but Operations is Green — ops status may need updating' });

  const isYellow = row.sentiment !== 'Green' || row.operations !== 'Green';
  if (isYellow && !issues) {
    const which = row.sentiment !== 'Green' && row.operations !== 'Green'
      ? 'Sentiment and Operations are both non-green'
      : row.sentiment !== 'Green' ? `Customer Sentiment is ${row.sentiment}`
      : `Operations is ${row.operations}`;
    flags.push({ type: 'warn', msg: `${which} but no Issues/Concerns documented — what is driving this?` });
  }

  // ── Issues without action plan ────────────────────────────────────────────
  if (issues && !upcoming && !nextFocus)
    flags.push({ type: 'warn', msg: 'Issues documented but no Upcoming Milestones or Next Week\'s Focus — no visible action plan' });

  // ── Service health ────────────────────────────────────────────────────────
  if (interruptions) {
    const n = firstInt(interruptions);
    if (!isNaN(n) && n >= 3)
      flags.push({ type: 'warn', msg: `${n} service interruptions in past 3 months — discuss impact and resolution plan` });
  }
  if (sections.sla) {
    const pct = parseFloat(sections.sla.replace(/[^0-9.]/g, ''));
    if (!isNaN(pct) && pct < 99.0)
      flags.push({ type: 'warn', msg: `SLA at ${sections.sla} — below 99% threshold, discuss impact with CSDM` });
  }

  // ── Renewal ───────────────────────────────────────────────────────────────
  const isWithin9 = within9mo && within9mo.toLowerCase().includes('yes');
  const fbLow = (renewalFeedback || '').toLowerCase();
  const nonRenewal = /non-renewal|not renewing|cancell?ation|will not renew|decommission/.test(fbLow);

  if (nonRenewal) {
    flags.push({ type: 'alert', msg: 'Customer feedback indicates NON-RENEWAL or cancellation' });
    if (!renewalNextSteps || isPlaceholder(renewalNextSteps))
      flags.push({ type: 'alert', msg: 'Non-renewal confirmed but no next steps documented — what is the offboarding/retention plan?' });
    if (row.sentiment === 'Green' && row.operations === 'Green')
      flags.push({ type: 'warn', msg: 'Non-renewal confirmed but both statuses are Green — should status reflect the situation?' });
  } else if (isWithin9) {
    if (!renewalFeedback || isPlaceholder(renewalFeedback))
      flags.push({ type: 'warn', msg: 'Within 9 months of contract end — no clear renewal feedback; where does the customer stand?' });
    else if (!renewalNextSteps || isPlaceholder(renewalNextSteps))
      flags.push({ type: 'warn', msg: 'Within 9 months of contract end — renewal feedback present but next steps are missing or TBD' });
    else
      flags.push({ type: 'info', msg: `Renewal in progress — next steps: ${snip(renewalNextSteps, 100)}` });
  }

  // ── Update quality (CSDM to fix) ──────────────────────────────────────────
  const missing = computeMissing(row.status);
  const mk = new Set(missing.map(m => m.key));

  if (mk.has('weeklyWins'))
    flags.push({ type: 'fix', msg: 'Weekly Accomplishments not filled in — CSDM to complete' });
  else if (weeklyWins && isThinFiller(weeklyWins))
    flags.push({ type: 'fix', msg: `Weekly Accomplishments looks like filler ("${weeklyWins.trim().substring(0, 60).replace(/\n/g,' ')}...") — should reflect actual work done` });

  if (mk.has('changes'))
    flags.push({ type: 'fix', msg: 'Changes section blank — CSDM to complete' });
  if (mk.has('upcoming'))
    flags.push({ type: 'fix', msg: 'Upcoming Milestones blank — CSDM to complete' });
  if (mk.has('nextFocus'))
    flags.push({ type: 'fix', msg: "Next Week's Focus blank — CSDM to complete" });
  if (mk.has('within9mo'))
    flags.push({ type: 'fix', msg: 'Within 9 Months of Contract End? not answered — required field' });
  if (mk.has('interruptions'))
    flags.push({ type: 'fix', msg: 'Service interruptions count not documented' });
  if (mk.has('sla'))
    flags.push({ type: 'fix', msg: 'SLA not documented' });

  if (nextVersion && isPlaceholder(nextVersion))
    flags.push({ type: 'fix', msg: 'Next Version/Decommission Plan still contains template placeholder text' });
  if (currentVersions && isPlaceholder(currentVersions))
    flags.push({ type: 'fix', msg: 'Current Versions contains placeholder text — CSDM to fill in actual versions' });
  if (isWithin9 && renewalFeedback && isPlaceholder(renewalFeedback))
    flags.push({ type: 'fix', msg: 'Renewal feedback is "TBD" — needs real customer sentiment documented' });
  if (isWithin9 && renewalNextSteps && isPlaceholder(renewalNextSteps))
    flags.push({ type: 'fix', msg: 'Renewal next steps is "TBD" — needs actionable steps documented' });

  // Remaining blank fields grouped
  const otherMissing = missing.filter(m =>
    !['weeklyWins','changes','upcoming','nextFocus','within9mo','interruptions','sla'].includes(m.key));
  if (otherMissing.length)
    flags.push({ type: 'fix', msg: `Also blank: ${otherMissing.map(m => m.label).join(', ')}` });

  // Template compliance (CSDM not following the standard format)
  checkTemplate(row.status, row).forEach(dev =>
    flags.push({ type: 'template', sev: dev.sev, msg: dev.msg }));

  return flags;
}

// Parse a date written in any of the loose formats CSDMs use
function parseLooseDate(str) {
  if (!str) return null;
  let m = str.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000;
    return `${y}-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`; }
  m = str.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}

// Pull a contract end / renewal date out of the Renewal Status section.
// CSDMs record this inconsistently — on its own "Renewal Date:" line, tacked
// onto the 9-month answer, buried in Next steps as "CREL End date", or as a
// bare quarter or year. Returns the best available with how precise it is.
function extractContractEnd(renew) {
  if (!renew) return { label: null, iso: null, src: null, precision: 'none' };
  const pats = [
    [/(?:CREL\s+)?(?:Contract|CREL)\s+End\s+Date\s*:?\s*([^\n]{0,40})/i, 'Contract end date'],
    [/Renewal\s+Date\s*:?\s*([^\n]{0,40})/i, 'Renewal date'],
    [/Renewal\s+date\s+([0-9\/\-]{6,12})/i, 'Renewal date'],
    [/contract\s+end(?:s|ing)?\s*(?:on|:)?\s*([0-9\/\-]{6,12})/i, 'Contract end'],
  ];
  for (const [re, src] of pats) {
    const m = renew.match(re);
    if (m) { const iso = parseLooseDate(m[1]); if (iso) return { label: m[1].trim().replace(/[.,;]$/,''), iso, src, precision: 'exact' }; }
  }
  const q = renew.match(/\b(Q[1-4])\s*(?:of\s*)?(20\d\d)\b/i);
  if (q) return { label: `${q[1].toUpperCase()} ${q[2]}`, iso: null, src: 'Quarter stated', precision: 'quarter' };
  const any = parseLooseDate(renew);
  if (any) return { label: any, iso: any, src: 'Date found in section', precision: 'exact' };
  const yr = renew.match(/\b(20\d\d)\b/);
  if (yr) return { label: yr[1], iso: null, src: 'Year only', precision: 'year' };
  return { label: null, iso: null, src: null, precision: 'none' };
}

// Contract end, preferring the real ServiceNow field
// (u_customer_relationship.u_contract_end) and falling back to whatever the
// CSDM typed into the Renewal Status text when that column isn't exported.
function resolveContractEnd(row, s) {
  if (row && row.contractEnd) {
    const d = parseDate(row.contractEnd) || (parseLooseDate(row.contractEnd) ? new Date(parseLooseDate(row.contractEnd) + 'T00:00:00') : null);
    if (d && !isNaN(d)) {
      const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      return { label: iso, iso, src: 'Contract end field', precision: 'exact', fromField: true };
    }
  }
  const e = extractContractEnd(s ? s.renewalRaw : null);
  return { ...e, fromField: false };
}

// Trim to a word boundary rather than slicing mid-word
function snip(v, n) {
  if (!v) return v;
  const s = String(v).replace(/\s+/g, ' ').trim();
  if (s.length <= n) return s;
  const cut = s.slice(0, n);
  const sp = cut.lastIndexOf(' ');
  return (sp > n * 0.6 ? cut.slice(0, sp) : cut).replace(/[.,;:\-–]$/, '') + '…';
}

// ── Domain scoring ─────────────────────────────────────────────────────────
// Scores each account across the portfolio domains. Every domain returns
// {state, label, detail} where state is 'good' | 'watch' | 'risk' | 'nodata'.
// 'nodata' means the CSDM left it blank — that's a coverage gap, not a health
// problem, and is counted separately from 'risk'.

const DOMAINS = [
  { key: 'customerHealth',  label: 'Customer Health',   short: 'Cust' },
  { key: 'serviceReviews',  label: 'Service Health Reviews', short: 'SHR' },
  { key: 'lifecycle',       label: 'Lifecycle Planning', short: 'Lifecycle' },
  { key: 'renewal',         label: 'Renewal Status',    short: 'Renewal' },
  { key: 'profitability',   label: 'Profitability',     short: 'Profit' },
];

function scoreDomains(row, s) {
  const d = {};

  // Customer Health — sentiment/ops status, SLA, interruptions
  (() => {
    const bits = [];
    let state = 'good';
    if (row.sentiment !== 'Green' || row.operations !== 'Green') {
      state = (row.sentiment === 'Red' || row.operations === 'Red') ? 'risk' : 'watch';
      bits.push(`Sentiment ${row.sentiment} / Ops ${row.operations}`);
    }
    if (s.sla) {
      const pct = parseFloat(s.sla.replace(/[^0-9.]/g, ''));
      if (!isNaN(pct) && pct < 99) { state = 'risk'; bits.push(`SLA ${s.sla}`); }
      else bits.push(`SLA ${s.sla}`);
    }
    const n = firstInt(s.interruptions);
    if (n !== null && !isNaN(n)) {
      if (n >= 3) { state = 'risk'; bits.push(`${n} interruptions`); }
      else if (n >= 1) { if (state === 'good') state = 'watch'; bits.push(`${n} interruption${n>1?'s':''}`); }
    }
    if (s.issues) { if (state === 'good') state = 'watch'; bits.push('open issues'); }
    if (!s.sla && n === null && !s.issues && row.sentiment === 'Green' && row.operations === 'Green')
      { d.customerHealth = { state: 'nodata', label: 'Not documented', detail: 'No SLA or interruption data' }; return; }
    d.customerHealth = { state, label: state === 'good' ? 'Healthy' : state === 'watch' ? 'Watch' : 'At risk', detail: bits.join(' · ') || '—' };
  })();

  // Service Health Reviews — cadence established, completed, participation
  (() => {
    const freq = s.frequency;
    if (!freq) { d.serviceReviews = { state: 'nodata', label: 'Not documented', detail: 'No review cadence recorded' }; return; }
    const low = freq.toLowerCase();
    const declined = /declin|none|not requested|no reviews?|refus/.test(low);
    const bits = [snip(freq, 60)];
    if (declined) { d.serviceReviews = { state: 'risk', label: 'None held', detail: bits.join(' · ') }; return; }
    const done = s.completed && /yes|complet|held|done/i.test(s.completed);
    if (done) { d.serviceReviews = { state: 'good', label: 'On track', detail: bits.join(' · ') }; return; }
    d.serviceReviews = { state: 'watch', label: 'Cadence set, none this period', detail: bits.join(' · ') };
  })();

  // Lifecycle Planning — current versions known + forward plan
  (() => {
    const cur = s.currentVersions, next = s.nextVersion;
    const nextReal = next && !isPlaceholder(next) ? next : null;
    if (!cur && !nextReal) { d.lifecycle = { state: 'nodata', label: 'Not documented', detail: 'No versions or plan recorded' }; return; }
    if (!nextReal) { d.lifecycle = { state: 'watch', label: 'No forward plan', detail: cur ? `On ${snip(cur, 50)}` : '—' }; return; }
    if (/decommission|end of contract|sunset|retire/i.test(nextReal))
      { d.lifecycle = { state: 'risk', label: 'Decommission planned', detail: snip(nextReal, 60) }; return; }
    if (!cur) { d.lifecycle = { state: 'watch', label: 'Plan set, versions unknown', detail: snip(nextReal, 60) }; return; }
    d.lifecycle = { state: 'good', label: 'Planned', detail: `${snip(cur,40)} → ${snip(nextReal,40)}` };
  })();

  // Renewal Status — driven by the real contract end date when we have one,
  // falling back to the CSDM's free-text "within 9 months?" answer otherwise.
  (() => {
    const end = resolveContractEnd(row, s);
    const fb = s.renewalFeedback;
    const fbLow = (fb || '').toLowerCase();
    const nonRenew = /non-renewal|not renewing|cancell?ation|will not renew/.test(fbLow);
    const atRisk = /at risk|lower price|discount|reduc/.test(fbLow);

    let inWindow = null, endNote = '';
    if (end.iso) {
      const days = Math.round((new Date(end.iso + 'T00:00:00') - new Date()) / 86400000);
      endNote = `ends ${formatDate(end.iso)}`;
      if (days < 0) { d.renewal = { state: 'risk', label: 'Contract end date passed', detail: `${endNote} — ${Math.abs(days)}d ago` }; return; }
      inWindow = days <= 274; // ~9 months
      endNote += ` (${Math.round(days/30.44)} mo)`;
    } else {
      const w9 = s.within9mo;
      if (!w9) { d.renewal = { state: 'nodata', label: 'Not answered', detail: 'No contract end date and 9-month question unanswered' }; return; }
      inWindow = /yes/i.test(w9);
      endNote = snip(w9, 50);
    }

    if (nonRenew) { d.renewal = { state: 'risk', label: 'NON-RENEWAL', detail: fb ? snip(fb, 70) : endNote }; return; }
    if (atRisk)   { d.renewal = { state: 'risk', label: 'At risk / price pressure', detail: fb ? snip(fb, 70) : endNote }; return; }
    if (!inWindow) { d.renewal = { state: 'good', label: 'Not in window', detail: endNote }; return; }
    if (!fb || isPlaceholder(fb)) { d.renewal = { state: 'watch', label: 'In window, position unknown', detail: endNote }; return; }
    if (!s.renewalNextSteps || isPlaceholder(s.renewalNextSteps)) { d.renewal = { state: 'watch', label: 'In window, no next steps', detail: `${endNote} · ${snip(fb, 40)}` }; return; }
    d.renewal = { state: 'good', label: 'On track', detail: `${endNote} · ${snip(fb, 45)}` };
  })();

  // Profitability — the template only carries a link, so this is coverage only
  (() => {
    d.profitability = s.profitabilityLink
      ? { state: 'good', label: 'Link on file', detail: 'Review workbook linked' }
      : { state: 'nodata', label: 'No link', detail: 'Profitability workbook not linked' };
  })();

  return d;
}

// Short plain-English note on what drives each domain's colour, shown on the
// rollup cards, as column tooltips, and in the expanded account scorecard.
const DOMAIN_KEYS = {
  customerHealth: 'Red: SLA <99%, 3+ interruptions, or Red status · Yellow: non-green status, 1–2 interruptions, or open issues · Grey: no SLA/interruption data',
  serviceReviews: 'Red: customer declined or none held · Yellow: cadence set but none completed this period · Green: review completed · Grey: cadence not recorded',
  lifecycle: 'Red: decommission planned · Yellow: versions known but no forward plan · Green: current versions + upgrade path · Grey: nothing recorded',
  renewal: 'Red: non-renewal or price pressure · Yellow: inside 9 months with position or next steps unclear · Green: outside window or on track · Grey: 9-month question unanswered',
  profitability: 'Green: workbook linked · Grey: no link. Template carries no margin value, so this is coverage only',
};

const STATE_META = {
  good:   { color: 'var(--green)',  bg: 'var(--green-bg)',  border: 'var(--green-border)',  icon: '●', rank: 3 },
  watch:  { color: 'var(--yellow)', bg: 'var(--yellow-bg)', border: 'var(--yellow-border)', icon: '●', rank: 1 },
  risk:   { color: 'var(--red)',    bg: 'var(--red-bg)',    border: 'var(--red-border)',    icon: '●', rank: 0 },
  nodata: { color: 'var(--text3)',  bg: 'var(--surface3)',  border: 'var(--border)',        icon: '○', rank: 2 },
};

// Generate OneNote text for an owner
function generateExport(owner, accounts, notes, today) {
  // Worst-first so the 1:1 opens with what matters
  const ranked = accounts.map(a => {
    const s = parseStatus(a.status);
    const domains = scoreDomains(a, s);
    const worst = Math.min(...DOMAINS.map(d => STATE_META[domains[d.key]?.state || 'nodata'].rank));
    return { a, worst };
  }).sort((x, y) => x.worst - y.worst || x.a.customer.localeCompare(y.a.customer));
  accounts = ranked.map(r => r.a);

  let t = `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
  t += `WEEKLY 1:1 PREP — ${owner.toUpperCase()}\n`;
  t += `${today}   |   ${accounts.length} accounts\n`;
  const g = accounts.filter(a=>a.sentiment==='Green').length;
  const y = accounts.filter(a=>a.sentiment==='Yellow').length;
  const r = accounts.filter(a=>a.sentiment==='Red').length;
  t += `Sentiment:  ${g} Green  /  ${y} Yellow  /  ${r} Red\n`;
  const offTmpl = accounts.filter(a => checkTemplate(a.status, a).length > 0).length;
  if (offTmpl > 0) t += `Template:   ${offTmpl} of ${accounts.length} account${accounts.length!==1?'s':''} off the standard format\n`;
  t += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;

  // Portfolio scorecard across the owner's accounts
  t += `PORTFOLIO SCORECARD\n`;
  t += `${'─'.repeat(60)}\n`;
  DOMAINS.forEach(d => {
    const c = { good:0, watch:0, risk:0, nodata:0 };
    accounts.forEach(a => { const st = scoreDomains(a, parseStatus(a.status))[d.key]?.state; if (st) c[st]++; });
    const parts = [];
    if (c.risk) parts.push(`${c.risk} risk`);
    if (c.watch) parts.push(`${c.watch} watch`);
    if (c.nodata) parts.push(`${c.nodata} blank`);
    if (c.good) parts.push(`${c.good} ok`);
    t += `  ${d.label.padEnd(24)} ${parts.join('  ·  ')}\n`;
  });
  t += `\n\n`;

  // Off-cadence updates (only meaningful when the export carries dates)
  const haveDates = accounts.some(a => a.updated);
  if (!haveDates) {
    t += `⏰ CADENCE: not checked — this export has no sys_updated_on column.\n`;
    t += `   Add that field in ServiceNow to track Wed/Thu update compliance.\n\n\n`;
  } else {
    const stale = accounts.filter(a => isStale(a.updated));
    if (stale.length > 0) {
      t += `⏰ OFF-CADENCE UPDATES (not updated on Wed/Thu)\n`;
      t += `${'─'.repeat(60)}\n`;
      stale.forEach(a => {
        t += a.updated
          ? `  • ${a.customer}  [${a.lob}]  —  last updated ${weekdayName(a.updated)} ${formatDate(a.updated)}  (${daysAgo(a.updated)}d ago)\n`
          : `  • ${a.customer}  [${a.lob}]  —  no update date recorded\n`;
      });
      t += `\n\n`;
    }
  }

  // All accounts: manager flags first, then the full update text verbatim
  t += `ALL ACCOUNTS\n`;
  t += `${'─'.repeat(60)}\n`;
  accounts.forEach((a, i) => {
    const s = parseStatus(a.status);
    const flags = analyzeAccount(a, s);
    const domains = scoreDomains(a, s);
    const points = talkingPoints(a, s, domains, flags);
    t += `\n${'═'.repeat(60)}\n`;
    t += `${i+1}. ${a.customer}  [${a.lob}]\n`;
    t += `Owner: ${a.owner}  |  Sentiment: ${a.sentiment}  |  Operations: ${a.operations}`;
    t += a.updated ? `  |  Updated: ${weekdayName(a.updated)} ${formatDate(a.updated)}\n` : `\n`;
    t += `${'═'.repeat(60)}\n`;

    // Domain scorecard
    t += `\nSCORECARD:\n`;
    DOMAINS.forEach(d => {
      const dm = domains[d.key];
      const mark = dm.state === 'risk' ? 'RISK ' : dm.state === 'watch' ? 'WATCH' : dm.state === 'nodata' ? 'BLANK' : 'OK   ';
      t += `  [${mark}] ${d.label.padEnd(23)} ${dm.label}${dm.detail && dm.detail !== '—' ? ' — ' + dm.detail : ''}\n`;
    });

    // Talking points, each with the question to ask
    if (points.length > 0) {
      t += `\nTALKING POINTS:\n`;
      points.forEach(p => {
        t += `\n  ${p.kind==='risk'?'⚑':p.kind==='issue'?'!':'△'} ${p.domain} — ${p.msg}\n`;
        if (p.detail) t += `      ${snip(p.detail, 200)}\n`;
        if (p.ask) t += `      ASK: ${p.ask}\n`;
      });
    } else {
      t += `\nTALKING POINTS: ✓ Nothing flagged — quick confirm and move on\n`;
    }

    // Other manager observations not already covered by a talking point
    const other = flags.filter(f => (f.type === 'warn' || f.type === 'info')
      && !points.some(p => p.msg === f.msg));
    if (other.length > 0) {
      t += `\nALSO NOTED:\n`;
      other.forEach(f => t += `  ${f.type==='warn'?'△':'ℹ'} ${f.msg}\n`);
    }

    const fixes = flags.filter(f => f.type === 'fix');
    if (fixes.length > 0) {
      t += `\nCSDM TO FIX IN NEXT UPDATE:\n`;
      fixes.forEach(f => t += `  ✎ ${f.msg}\n`);
    }
    const tmpl = flags.filter(f => f.type === 'template');
    if (tmpl.length > 0) {
      t += `\nNOT FOLLOWING THE TEMPLATE:\n`;
      tmpl.forEach(f => t += `  ▤ ${f.sev === 'major' ? '(!) ' : ''}${f.msg}\n`);
    }
    const note = notes[a.lob];
    if (note) t += `\n📝 MY NOTE: ${note.text}\n`;

    // Full data dump, verbatim from the update
    t += `\n--- FULL UPDATE (as submitted) ---\n`;
    t += `${a.status || '(no status text provided)'}\n`;
  });

  return t;
}

// ── Hooks ──────────────────────────────────────────────────────────────────

function useNotes() {
  const [notes, setNotes] = useState(() => {
    try { return JSON.parse(localStorage.getItem('lob-notes-v2') || '{}'); } catch { return {}; }
  });
  useEffect(() => { localStorage.setItem('lob-notes-v2', JSON.stringify(notes)); }, [notes]);
  return {
    notes,
    setNote: (lob, text) => setNotes(p => ({...p, [lob]: {text, updated: new Date().toISOString()}})),
    getNote: lob => notes[lob] || null,
    deleteNote: lob => setNotes(p => { const n = {...p}; delete n[lob]; return n; }),
  };
}

// ── Small components ───────────────────────────────────────────────────────

function StatusBadge({ status }) {
  const dot = { Green: '●', Yellow: '●', Red: '●' }[status] || '○';
  return <span className={`status-badge status-${status}`}><span className={`status-dot dot-${status}`}></span>{status}</span>;
}

function DateBadge({ val }) {
  const days = daysAgo(val);
  const stale = isStale(val);
  const cls = stale ? 'date-stale' : 'date-fresh';
  const label = days === 0 ? 'Today' : days === 1 ? 'Yesterday' : `${days}d ago`;
  return <span className={`date-badge ${cls}`}>{label}</span>;
}

function Field({ label, value, isLink }) {
  const empty = !value;
  return (
    <div className="field-row">
      <div className="field-label">{label}</div>
      <div className={`field-val${empty ? ' empty' : ''}`}>
        {empty ? '—' : isLink
          ? <a href={value} target="_blank" rel="noopener noreferrer">View ↗</a>
          : value}
      </div>
    </div>
  );
}

function AnalysisFlags({ flags }) {
  if (!flags.length) return <p className="no-flags">✓ No issues flagged</p>;
  const discuss = flags.filter(f => f.type === 'alert' || f.type === 'warn' || f.type === 'info');
  const fixes   = flags.filter(f => f.type === 'fix');
  const template = flags.filter(f => f.type === 'template');
  return (
    <div>
      {discuss.length > 0 && (
        <>
          <div style={{fontSize:'0.66rem', fontFamily:'var(--mono)', textTransform:'uppercase', letterSpacing:'0.06em', color:'var(--text3)', marginBottom:'0.3rem'}}>Discussion Topics</div>
          {discuss.map((f, i) => (
            <div key={i} className={`analysis-flag ${f.type}`}>
              <span className="analysis-flag-icon">{f.type==='alert'?'⚑':f.type==='warn'?'△':'ℹ'}</span>
              <span>{f.msg}</span>
            </div>
          ))}
        </>
      )}
      {fixes.length > 0 && (
        <>
          <div style={{fontSize:'0.66rem', fontFamily:'var(--mono)', textTransform:'uppercase', letterSpacing:'0.06em', color:'var(--text3)', marginTop: discuss.length ? '0.5rem' : 0, marginBottom:'0.3rem'}}>CSDM to Fix</div>
          {fixes.map((f, i) => (
            <div key={i} className="analysis-flag fix">
              <span className="analysis-flag-icon">✎</span>
              <span>{f.msg}</span>
            </div>
          ))}
        </>
      )}
      {template.length > 0 && (
        <>
          <div style={{fontSize:'0.66rem', fontFamily:'var(--mono)', textTransform:'uppercase', letterSpacing:'0.06em', color:'var(--text3)', marginTop: (discuss.length || fixes.length) ? '0.5rem' : 0, marginBottom:'0.3rem'}}>Not Following the Template</div>
          {template.map((f, i) => (
            <div key={i} className="analysis-flag template">
              <span className="analysis-flag-icon">▤</span>
              <span>{f.sev === 'major' ? <strong>{f.msg}</strong> : f.msg}</span>
            </div>
          ))}
        </>
      )}
    </div>
  );
}

// A single titled box. `missing` highlights it red with a MISSING tag (field
// left blank in the update); `isIssue` tints it amber when it has content.
function FieldBox({ label, value, isLink, missing, isIssue, wide }) {
  const empty = !value;
  const issueActive = isIssue && !empty;
  const isUrl = !empty && /^https?:\/\//i.test(value);
  const cls = ['field-box', wide ? 'wide' : '', missing ? 'missing' : '', issueActive ? 'has-issue' : ''].filter(Boolean).join(' ');
  return (
    <div className={cls}>
      <div className="field-box-label">
        <span>{label}</span>
        {missing && <span className="missing-tag">MISSING</span>}
      </div>
      <div className={`field-box-val${empty ? ' empty' : ''}`}>
        {missing
          ? 'No information provided'
          : empty
            ? '—'
            : (isLink && isUrl
                ? <a href={value} target="_blank" rel="noopener noreferrer">View ↗</a>
                : value)}
      </div>
    </div>
  );
}

// ── Expanded row ───────────────────────────────────────────────────────────

function ExpandedRow({ row, notes }) {
  const s = parseStatus(row.status);
  const flags = analyzeAccount(row, s);
  const missing = computeMissing(row.status);
  const missingLabels = missing.map(m => m.label);
  const [noteText, setNoteText] = useState(notes.getNote(row.lob)?.text || '');
  const [saved, setSaved] = useState(false);

  function saveNote() {
    notes.setNote(row.lob, noteText);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }

  return (
    <div style={{padding:'1rem 1.25rem'}}>
      {/* Manager analysis + notes across the top */}
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'0.6rem', marginBottom:'0.9rem'}} className="expand-top">
        <div className="panel-section">
          <h4>Manager Analysis</h4>
          <AnalysisFlags flags={flags} />
        </div>
        <div className="panel-section">
          <h4>My Notes (1:1 prep)</h4>
          <textarea
            className="notes-textarea"
            value={noteText}
            onChange={e => setNoteText(e.target.value)}
            placeholder="Add your 1:1 talking points..."
          />
          <div className="notes-controls">
            <button className="btn btn-ghost" style={{fontSize:'0.75rem', padding:'0.3rem 0.7rem'}} onClick={saveNote}>Save</button>
            {notes.getNote(row.lob) && (
              <button className="btn btn-ghost" style={{fontSize:'0.75rem', padding:'0.3rem 0.7rem', color:'var(--red)'}}
                onClick={() => { notes.deleteNote(row.lob); setNoteText(''); }}>Clear</button>
            )}
            {saved && <span className="notes-saved">✓ Saved</span>}
          </div>
        </div>
      </div>


      {/* Full update as submitted, in one box */}
      <div className="update-box">
        <div className="update-box-head">
          <span>Update as submitted</span>
          {missingLabels.length > 0 && (
            <span className="update-missing">
              {missingLabels.length} field{missingLabels.length !== 1 ? 's' : ''} left blank: {missingLabels.join(', ')}
            </span>
          )}
        </div>
        <div className="update-box-body">{row.status || '(no status text provided)'}</div>
      </div>
    </div>
  );
}

function MondayView({ data, notes }) {
  const allSections = useMemo(() => data.map(r => parseStatus(r.status)), [data]);
  const allFlags = useMemo(() => data.map((r,i) => analyzeAccount(r, allSections[i])), [data, allSections]);

  const staleByOwner = useMemo(() => {
    const map = {};
    data.forEach((r, i) => {
      if (isStale(r.updated)) {
        if (!map[r.owner]) map[r.owner] = [];
        map[r.owner].push({ row: r, days: daysAgo(r.updated) });
      }
    });
    return Object.entries(map).sort((a,b) => a[0].localeCompare(b[0]));
  }, [data]);

  const actionItems = useMemo(() => {
    const items = [];
    data.forEach((r, i) => {
      if (r.sentiment !== 'Green' || r.operations !== 'Green') {
        const s = allSections[i];
        const flags = allFlags[i];
        items.push({ row: r, sections: s, flags: flags.filter(f => f.type === 'alert'), allFlags: flags });
      }
    });
    // Sort: Red first, then Yellow
    items.sort((a,b) => {
      const sentOrd = {Red:0,Yellow:1,Green:2};
      const aOrd = Math.min(sentOrd[a.row.sentiment]??2, sentOrd[a.row.operations]??2);
      const bOrd = Math.min(sentOrd[b.row.sentiment]??2, sentOrd[b.row.operations]??2);
      return aOrd - bOrd;
    });
    return items;
  }, [data, allSections, allFlags]);

  const renewalItems = useMemo(() => {
    return data.filter((_,i) => allSections[i].within9mo?.toLowerCase().includes('yes'))
      .map((r,_) => ({ row: r, sections: allSections[data.indexOf(r)] }));
  }, [data, allSections]);

  return (
    <div>
      <div style={{marginBottom:'1rem', padding:'0.75rem 1rem', background:'var(--surface)', border:'1px solid var(--border)', borderRadius:'8px', fontSize:'0.82rem', color:'var(--text2)'}}>
        Monday quick-scan — {data.length} total accounts across {[...new Set(data.map(d=>d.owner))].length} CSDMs
        {staleByOwner.length > 0 && <span style={{color:'var(--red)', marginLeft:'1rem'}}>⚑ {staleByOwner.reduce((n,[,a])=>n+a.length,0)} accounts not updated last week</span>}
        {actionItems.length > 0 && <span style={{color:'var(--yellow)', marginLeft:'1rem'}}>△ {actionItems.length} non-green account{actionItems.length !== 1 ? 's' : ''}</span>}
      </div>

      <div className="monday-wrap">
        {/* Stale updates by owner */}
        <div className="monday-section">
          <div className="monday-section-header">
            <span className="monday-section-title" style={{color:'var(--red)'}}>⏰ Missed Thursday Updates</span>
            <span style={{fontSize:'0.72rem', color:'var(--text3)', fontFamily:'var(--mono)'}}>{staleByOwner.reduce((n,[,a])=>n+a.length,0)} accounts</span>
          </div>
          {staleByOwner.length === 0
            ? <div className="monday-empty" style={{color:'var(--green)'}}>✓ All accounts updated this week</div>
            : staleByOwner.map(([owner, items]) => (
              <div key={owner}>
                <div style={{padding:'0.45rem 1rem', background:'var(--surface3)', fontSize:'0.72rem', fontFamily:'var(--mono)', color:'var(--text3)', borderTop:'1px solid var(--border)'}}>
                  {owner} — {items.length} account{items.length>1?'s':''}
                </div>
                {items.map(({row, days}) => (
                  <div key={row.lob} className="monday-row">
                    <StatusBadge status={row.sentiment} />
                    <div className="monday-row-main">
                      <div className="monday-row-customer">{row.customer}</div>
                      <div className="monday-row-meta">{row.lob} · last updated {formatDate(row.updated)} ({days}d ago)</div>
                    </div>
                  </div>
                ))}
              </div>
            ))
          }
        </div>

        {/* Action items */}
        <div className="monday-section">
          <div className="monday-section-header">
            <span className="monday-section-title" style={{color:'var(--yellow)'}}>△ Needs Your Attention</span>
            <span style={{fontSize:'0.72rem', color:'var(--text3)', fontFamily:'var(--mono)'}}>{actionItems.length} accounts</span>
          </div>
          {actionItems.length === 0
            ? <div className="monday-empty" style={{color:'var(--green)'}}>✓ No major issues flagged</div>
            : actionItems.map(({row, sections, flags, allFlags: af}) => (
              <div key={row.lob} className="monday-row">
                <div style={{display:'flex', flexDirection:'column', gap:'3px', flexShrink:0}}>
                  <div style={{display:'flex', alignItems:'center', gap:'4px'}}>
                    <span style={{fontSize:'0.62rem', color:'var(--text3)', fontFamily:'var(--mono)', width:'26px'}}>SENT</span>
                    <StatusBadge status={row.sentiment} />
                  </div>
                  <div style={{display:'flex', alignItems:'center', gap:'4px'}}>
                    <span style={{fontSize:'0.62rem', color:'var(--text3)', fontFamily:'var(--mono)', width:'26px'}}>OPS</span>
                    <StatusBadge status={row.operations} />
                  </div>
                </div>
                <div className="monday-row-main">
                  <div className="monday-row-customer">{row.customer} <span style={{fontSize:'0.72rem', color:'var(--text3)'}}>{row.owner}</span></div>
                  {sections.issues && <div className="monday-row-sub" style={{color:'var(--yellow)'}}>{snip(sections.issues, 120)}</div>}
                  {flags.map((f,i) => (
                    <div key={i} className="monday-row-meta" style={{color:'var(--red)'}}>⚑ {f.msg}</div>
                  ))}
                  {af.filter(f=>f.type==='warn').map((f,i) => (
                    <div key={i} className="monday-row-meta" style={{color:'var(--yellow)'}}>△ {f.msg}</div>
                  ))}
                </div>
              </div>
            ))
          }
        </div>

        {/* Renewals */}
        {renewalItems.length > 0 && (
          <div className="monday-section" style={{gridColumn: renewalItems.length > 3 ? '1/-1' : 'auto'}}>
            <div className="monday-section-header">
              <span className="monday-section-title" style={{color:'var(--orange)'}}>⚑ Renewal ≤ 9 Months</span>
              <span style={{fontSize:'0.72rem', color:'var(--text3)', fontFamily:'var(--mono)'}}>{renewalItems.length} accounts</span>
            </div>
            {renewalItems.map(({row, sections}) => (
              <div key={row.lob} className="monday-row">
                <StatusBadge status={row.sentiment} />
                <div className="monday-row-main">
                  <div className="monday-row-customer">{row.customer} <span style={{fontSize:'0.72rem', color:'var(--text3)'}}>{row.owner}</span></div>
                  {sections.renewalFeedback && <div className="monday-row-sub">{snip(sections.renewalFeedback, 100)}</div>}
                  {sections.renewalNextSteps && <div className="monday-row-meta" style={{color:'var(--blue)'}}>Next: {snip(sections.renewalNextSteps, 100)}</div>}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}
