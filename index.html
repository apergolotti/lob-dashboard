<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOB Status Dashboard</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface2: #f1f3f6;
      --surface3: #e9edf2;
      --border: #e2e6ec;
      --border2: #cbd2dc;
      --text: #1a2233;
      --text2: #5a647a;
      --text3: #97a0b3;
      --green: #1a9d63;
      --green-bg: #e7f6ee;
      --green-border: #bce4cf;
      --yellow: #b07d0a;
      --yellow-bg: #fcf3dc;
      --yellow-border: #ecd79a;
      --red: #d23b3b;
      --red-bg: #fbe9e9;
      --red-border: #f0c4c4;
      --blue: #2570d4;
      --blue-bg: #e8f1fc;
      --blue-border: #c2dbf6;
      --orange: #d96d1f;
      --purple: #7a4fd0;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }

    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; }

    /* Upload screen */
    .upload-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .upload-card { max-width: 520px; width: 100%; }
    .upload-card h1 { font-family: var(--mono); font-size: 1.5rem; font-weight: 600; color: var(--text); letter-spacing: -0.02em; margin-bottom: 0.25rem; }
    .upload-card .subtitle { color: var(--text2); font-size: 0.85rem; margin-bottom: 2rem; }
    .drop-zone { border: 2px dashed var(--border2); border-radius: 12px; padding: 3rem 2rem; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--surface); }
    .drop-zone:hover, .drop-zone.drag { border-color: var(--blue); background: var(--blue-bg); }
    .drop-zone .icon { font-size: 2.5rem; margin-bottom: 1rem; opacity: 0.7; }
    .drop-zone p { color: var(--text2); font-size: 0.9rem; }
    .drop-zone strong { color: var(--text); }
    .error-box { margin-top: 1rem; padding: 0.75rem 1rem; background: var(--red-bg); border: 1px solid var(--red-border); border-radius: 8px; color: var(--red); font-size: 0.85rem; }

    /* Main layout */
    .app { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.875rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; position: sticky; top: 0; z-index: 100; }
    .topbar-left { display: flex; align-items: center; gap: 1rem; }
    .brand { font-family: var(--mono); font-size: 0.95rem; font-weight: 600; color: var(--text); letter-spacing: 0.02em; }
    .file-chip { font-size: 0.75rem; color: var(--text3); font-family: var(--mono); background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 0.2rem 0.5rem; }
    .topbar-right { display: flex; align-items: center; gap: 0.5rem; }
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.45rem 0.85rem; border-radius: 6px; font-size: 0.8rem; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all 0.15s; font-family: var(--sans); }
    .btn-ghost { background: transparent; border-color: var(--border); color: var(--text2); }
    .btn-ghost:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-export { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }
    .btn-export:hover { background: #d6efe1; }

    /* Tab nav */
    .tab-nav { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--surface); padding: 0 1.5rem; }
    .tab { padding: 0.65rem 1.1rem; font-size: 0.82rem; font-weight: 500; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; white-space: nowrap; }
    .tab:hover { color: var(--text2); }
    .tab.active { color: var(--blue); border-bottom-color: var(--blue); }
    .tab .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; font-size: 0.7rem; font-weight: 600; margin-left: 0.35rem; background: var(--surface3); color: var(--text2); }
    .tab.active .badge { background: var(--blue-bg); color: var(--blue); }
    .badge-warn { background: var(--yellow-bg) !important; color: var(--yellow) !important; }
    .badge-alert { background: var(--red-bg) !important; color: var(--red) !important; }

    /* Content area */
    .content { padding: 1.25rem 1.5rem; overflow-y: auto; }

    /* Stats row */
    .stats-row { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; min-width: 90px; flex: 1; cursor: pointer; transition: all 0.15s; }
    .stat-card:hover { border-color: var(--border2); }
    .stat-card.active { border-color: var(--blue); background: var(--blue-bg); }
    .stat-label { font-size: 0.7rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--mono); margin-bottom: 0.25rem; }
    .stat-value { font-size: 1.6rem; font-weight: 600; font-family: var(--mono); color: var(--text); line-height: 1; }
    .stat-card.green .stat-value { color: var(--green); }
    .stat-card.yellow .stat-value { color: var(--yellow); }
    .stat-card.red .stat-value { color: var(--red); }
    .stat-card.orange .stat-value { color: var(--orange); }
    .stat-card.blue .stat-value { color: var(--blue); }

    /* Filter bar */
    .filter-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    .filter-bar input, .filter-bar select { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 0.4rem 0.65rem; font-size: 0.82rem; font-family: var(--sans); outline: none; }
    .filter-bar input { flex: 1; min-width: 160px; }
    .filter-bar input::placeholder { color: var(--text3); }
    .filter-bar input:focus, .filter-bar select:focus { border-color: var(--blue); }
    .filter-bar select option { background: var(--surface2); }
    .clear-link { font-size: 0.78rem; color: var(--blue); cursor: pointer; white-space: nowrap; }
    .clear-link:hover { text-decoration: underline; }

    /* Table */
    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--surface2); }
    th { padding: 0.6rem 0.875rem; text-align: left; font-size: 0.7rem; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--mono); white-space: nowrap; }
    th button { background: none; border: none; color: inherit; cursor: pointer; font: inherit; letter-spacing: inherit; display: flex; align-items: center; gap: 4px; }
    th button:hover { color: var(--text); }
    td { padding: 0.7rem 0.875rem; border-top: 1px solid var(--border); vertical-align: middle; }
    tr.data-row { cursor: pointer; transition: background 0.1s; }
    tr.data-row:hover { background: var(--surface2); }
    tr.data-row.expanded { background: var(--surface2); }
    tr.expand-row td { background: var(--surface2); border-top: none; padding: 0; }

    .customer-name { font-weight: 500; color: var(--text); font-size: 0.875rem; }
    .lob-code { font-family: var(--mono); font-size: 0.72rem; color: var(--text3); margin-top: 1px; }
    .owner-name { color: var(--text2); font-size: 0.82rem; }

    /* Status badges */
    .status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 0.2rem 0.55rem; border-radius: 4px; font-size: 0.72rem; font-weight: 600; font-family: var(--mono); letter-spacing: 0.03em; border: 1px solid; }
    .status-Green { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
    .status-Yellow { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-border); }
    .status-Red { background: var(--red-bg); color: var(--red); border-color: var(--red-border); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot-Green { background: var(--green); }
    .dot-Yellow { background: var(--yellow); }
    .dot-Red { background: var(--red); }

    /* Date badge */
    .date-badge { display: inline-flex; align-items: center; gap: 4px; padding: 0.18rem 0.5rem; border-radius: 4px; font-size: 0.72rem; font-family: var(--mono); border: 1px solid; }
    .date-fresh { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
    .date-warn { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-border); }
    .date-stale { background: var(--red-bg); color: var(--red); border-color: var(--red-border); }

    /* Flag chips */
    .flags { display: flex; gap: 4px; flex-wrap: wrap; }
    .flag { padding: 0.15rem 0.45rem; border-radius: 3px; font-size: 0.68rem; font-weight: 600; font-family: var(--mono); }
    .flag-issue { background: var(--yellow-bg); color: var(--yellow); }
    .flag-renewal { background: var(--orange); color: #fff; opacity: 0.85; }
    .flag-cancel { background: var(--red-bg); color: var(--red); }
    .flag-interruptions { background: var(--surface3); color: var(--text2); }
    .flag-stale { background: var(--red-bg); color: var(--red); }

    /* Expand panel */
    .expand-panel { padding: 1rem 1.25rem; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    @media (max-width: 1100px) { .expand-panel { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 700px) { .expand-panel { grid-template-columns: 1fr; } }
    .panel-section { background: var(--surface3); border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem; }
    .panel-section h4 { font-size: 0.7rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 0.5rem; }
    .field-row { margin-bottom: 0.5rem; }
    .field-label { font-size: 0.68rem; color: var(--text3); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.05em; }
    .field-val { font-size: 0.82rem; color: var(--text); margin-top: 1px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .field-val.empty { color: var(--text3); font-style: italic; }
    .field-val a { color: var(--blue); text-decoration: none; font-size: 0.78rem; }
    .field-val a:hover { text-decoration: underline; }
    .highlight-issue { background: rgba(240,180,41,0.08); border-left: 3px solid var(--yellow); padding: 0.4rem 0.5rem; border-radius: 0 4px 4px 0; margin: -0.1rem 0; }

    /* Boxed field layout for expanded account */
    .field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0.6rem; }
    .field-box { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem 0.7rem; display: flex; flex-direction: column; }
    .field-box.wide { grid-column: 1 / -1; }
    .field-box.missing { background: var(--red-bg); border-color: var(--red-border); }
    .field-box.has-issue { background: var(--yellow-bg); border-color: var(--yellow-border); }
    .field-box-label { font-size: 0.66rem; color: var(--text3); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.3rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .field-box.missing .field-box-label { color: var(--red); }
    .field-box.has-issue .field-box-label { color: var(--yellow); }
    .field-box-val { font-size: 0.82rem; color: var(--text); line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .field-box-val.empty { color: var(--text3); font-style: italic; }
    .field-box-val a { color: var(--blue); text-decoration: none; font-size: 0.78rem; }
    .field-box-val a:hover { text-decoration: underline; }
    .missing-tag { font-size: 0.6rem; font-weight: 600; background: var(--red); color: #fff; padding: 0.08rem 0.35rem; border-radius: 3px; letter-spacing: 0.04em; }
    .group-label { grid-column: 1 / -1; font-size: 0.66rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); font-weight: 600; margin-top: 0.3rem; padding-bottom: 0.1rem; border-bottom: 1px solid var(--border); }
    .group-label:first-child { margin-top: 0; }
    @media (max-width: 700px) { .expand-top { grid-template-columns: 1fr !important; } }

    /* Notes area */
    .notes-area { grid-column: 1 / -1; }
    .notes-textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 0.6rem 0.75rem; font-size: 0.82rem; font-family: var(--sans); resize: vertical; min-height: 70px; outline: none; }
    .notes-textarea:focus { border-color: var(--blue); }
    .notes-controls { display: flex; gap: 0.5rem; margin-top: 0.5rem; align-items: center; }
    .notes-saved { font-size: 0.75rem; color: var(--green); }

    /* Monday view */
    .monday-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 900px) { .monday-wrap { grid-template-columns: 1fr; } }
    .monday-section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .monday-section-header { padding: 0.65rem 1rem; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .monday-section-title { font-size: 0.75rem; font-family: var(--mono); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    .monday-row { padding: 0.6rem 1rem; border-top: 1px solid var(--border); display: flex; align-items: flex-start; gap: 0.75rem; }
    .monday-row:first-child { border-top: none; }
    .monday-row-main { flex: 1; min-width: 0; }
    .monday-row-customer { font-weight: 500; font-size: 0.85rem; color: var(--text); }
    .monday-row-sub { font-size: 0.75rem; color: var(--text2); margin-top: 2px; }
    .monday-row-meta { font-size: 0.72rem; color: var(--text3); font-family: var(--mono); margin-top: 3px; }
    .monday-empty { padding: 1.5rem 1rem; text-align: center; color: var(--text3); font-size: 0.82rem; }

    /* Owner summary cards */
    .owner-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.75rem; margin-bottom: 1.25rem; }
    .owner-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.875rem 1rem; cursor: pointer; transition: all 0.15s; }
    .owner-card:hover { border-color: var(--border2); background: var(--surface2); }
    .owner-card.selected { border-color: var(--blue); }
    .owner-card-name { font-weight: 500; font-size: 0.875rem; color: var(--text); margin-bottom: 0.4rem; }
    .owner-card-stats { display: flex; gap: 0.5rem; font-size: 0.72rem; font-family: var(--mono); }
    .owner-card-alerts { margin-top: 0.4rem; display: flex; gap: 4px; flex-wrap: wrap; }

    /* Export modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(26,34,51,0.45); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 1rem; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 700px; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; }
    .modal-header { padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-header h2 { font-family: var(--mono); font-size: 1rem; font-weight: 600; }
    .modal-body { flex: 1; overflow-y: auto; padding: 1.25rem; }
    .modal-footer { padding: 0.875rem 1.25rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; justify-content: flex-end; }
    .export-owner-row { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 0.875rem 1rem; margin-bottom: 0.75rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .export-owner-info { flex: 1; min-width: 0; }
    .export-owner-name { font-weight: 500; font-size: 0.9rem; color: var(--text); }
    .export-owner-meta { font-size: 0.75rem; color: var(--text2); margin-top: 3px; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .export-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .preview-box { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; font-family: var(--mono); font-size: 0.72rem; color: var(--text2); white-space: pre-wrap; max-height: 300px; overflow-y: auto; margin-top: 1rem; line-height: 1.6; }

    .table-footer { padding: 0.6rem 0.875rem; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--text3); font-family: var(--mono); }

    .section-full { grid-column: 1 / -1; }
    .raw-toggle { font-size: 0.72rem; color: var(--text3); cursor: pointer; }
    .raw-toggle:hover { color: var(--text2); }
    .raw-content { font-family: var(--mono); font-size: 0.7rem; color: var(--text3); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.5rem; max-height: 160px; overflow-y: auto; margin-top: 0.4rem; white-space: pre-wrap; word-break: break-all; }

    /* Analysis flags */
    .analysis-flag { display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.5rem 0.65rem; border-radius: 5px; margin-bottom: 0.4rem; font-size: 0.78rem; }
    .analysis-flag.warn { background: var(--yellow-bg); border: 1px solid var(--yellow-border); color: var(--yellow); }
    .analysis-flag.alert { background: var(--red-bg); border: 1px solid var(--red-border); color: var(--red); }
    .analysis-flag.info { background: var(--blue-bg); border: 1px solid var(--blue-border); color: var(--blue); }
    .analysis-flag.fix { background: #fdf2e8; border: 1px solid #f0d0a8; color: var(--orange); }
    .analysis-flag.template { background: #f3eefc; border: 1px solid #ddccf5; color: var(--purple); }

    /* Portfolio matrix */
    .matrix-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; }
    .matrix { width: 100%; border-collapse: collapse; min-width: 780px; }
    .matrix th { padding: 0.55rem 0.6rem; font-size: 0.66rem; text-align: center; }
    .matrix th.acct-col { text-align: left; min-width: 190px; }
    .matrix td { padding: 0.5rem 0.6rem; border-top: 1px solid var(--border); }
    .matrix td.cell { text-align: center; cursor: help; }
    .matrix tr.grp td { background: var(--surface2); font-family: var(--mono); font-size: 0.7rem; color: var(--text2); letter-spacing: 0.05em; padding: 0.4rem 0.6rem; font-weight: 600; }
    .matrix tr.acct:hover { background: var(--surface2); }
    .pill { display: inline-block; padding: 0.16rem 0.5rem; border-radius: 10px; font-size: 0.68rem; font-weight: 600; font-family: var(--mono); border: 1px solid; white-space: nowrap; }
    .cell-note { font-size: 0.62rem; color: var(--text3); margin-top: 3px; max-width: 150px; margin-left: auto; margin-right: auto; line-height: 1.3; }
    .matrix tr.acct { cursor: pointer; }
    .matrix tr.acct.open { background: var(--surface2); }
    .matrix tr.expand-row td { background: var(--surface2); padding: 0; border-top: none; }
    .rollup-why { font-size: 0.62rem; color: var(--text3); margin-top: 0.45rem; line-height: 1.35; border-top: 1px solid var(--border); padding-top: 0.4rem; }

    /* Domain scorecard inside an expanded account */
    .domain-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0.6rem; padding: 0.9rem 1.25rem 0; }
    .ds-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem 0.7rem; }
    .ds-title { font-size: 0.64rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); }
    .ds-state { font-size: 0.82rem; font-weight: 600; margin-top: 2px; }
    .ds-detail { font-size: 0.72rem; color: var(--text2); margin-top: 2px; line-height: 1.35; }
    .ds-why { font-size: 0.6rem; color: var(--text3); margin-top: 0.35rem; border-top: 1px solid var(--border); padding-top: 0.3rem; line-height: 1.3; }

    /* Compact template/update-quality chips */
    .qc-list { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .qc-item { font-size: 0.68rem; line-height: 1.25; padding: 0.12rem 0.4rem; border-radius: 3px;
      border: 1px solid; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; cursor: help; }
    .qc-tmpl { background: #f3eefc; border-color: #ddccf5; color: var(--purple); }
    .qc-fix  { background: #fdf2e8; border-color: #f0d0a8; color: var(--orange); }

    /* Reference attributes in an expanded account */
    .attr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0.5rem 0.9rem;
