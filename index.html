        {showRaw && <div className="raw-content">{row.status}</div>}
      </div>
    </div>
  );
}

// ── Main table view ────────────────────────────────────────────────────────

function TableView({ data, notes }) {
  const [search, setSearch] = useState('');
  const [filterOwner, setFilterOwner] = useState('all');
  const [filterSentiment, setFilterSentiment] = useState('all');
  const [filterStatus, setFilterStatus] = useState('all');
  const [sortBy, setSortBy] = useState('updated');
  const [sortDir, setSortDir] = useState('asc'); // stale first
  const [expandedRow, setExpandedRow] = useState(null);

  const owners = useMemo(() => [...new Set(data.map(d => d.owner))].filter(Boolean).sort(), [data]);

  const allSections = useMemo(() => data.map(r => parseStatus(r.status)), [data]);
  const allFlags = useMemo(() => data.map((r,i) => analyzeAccount(r, allSections[i])), [data, allSections]);

  const stats = useMemo(() => ({
    total: data.length,
    green: data.filter(d => d.sentiment === 'Green').length,
    yellow: data.filter(d => d.sentiment === 'Yellow').length,
    red: data.filter(d => d.sentiment === 'Red').length,
    issues: allSections.filter(s => s.issues).length,
    stale: data.filter(d => isStale(d.updated)).length,
    alerts: allFlags.filter(f => f.some(x => x.type === 'alert')).length,
    endingSoon: data.filter(d => isWithin6Months(d.contractEnd)).length,
  }), [data, allSections, allFlags]);

  const filtered = useMemo(() => {
    let result = data.filter((row, i) => {
      const q = search.toLowerCase();
      const matchSearch = !search || row.customer.toLowerCase().includes(q) || row.lob.toLowerCase().includes(q) || row.owner.toLowerCase().includes(q);
      const matchOwner = filterOwner === 'all' || row.owner === filterOwner;
      const matchSentiment = filterSentiment === 'all' || row.sentiment === filterSentiment;
      let matchStatus = true;
      if (filterStatus === 'stale') matchStatus = isStale(row.updated);
      else if (filterStatus === 'issues') matchStatus = !!allSections[i].issues;
      else if (filterStatus === 'alerts') matchStatus = allFlags[i].some(f => f.type === 'alert');
      else if (filterStatus === 'renewal') matchStatus = allSections[i].within9mo?.toLowerCase().includes('yes');
      else if (filterStatus === 'endingSoon') matchStatus = isWithin6Months(row.contractEnd);
      return matchSearch && matchOwner && matchSentiment && matchStatus;
    });

    result = result.slice().sort((a, b) => {
      let av, bv;
      if (sortBy === 'updated') {
        av = parseDate(a.updated)?.getTime() || 0;
        bv = parseDate(b.updated)?.getTime() || 0;
      } else if (sortBy === 'contractEnd') {
        av = parseDate(a.contractEnd)?.getTime() || 9999999999999;
        bv = parseDate(b.contractEnd)?.getTime() || 9999999999999;
      } else if (sortBy === 'customer') { av = a.customer.toLowerCase(); bv = b.customer.toLowerCase(); }
      else if (sortBy === 'owner') { av = a.owner.toLowerCase(); bv = b.owner.toLowerCase(); }
      else if (sortBy === 'sentiment') {
        const ord = {Red:0,Yellow:1,Green:2}; av = ord[a.sentiment]??3; bv = ord[b.sentiment]??3;
      } else { av = a[sortBy]; bv = b[sortBy]; }
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });

    return result;
  }, [data, search, filterOwner, filterSentiment, filterStatus, sortBy, sortDir, allSections, allFlags]);

  function toggleSort(field) {
    if (sortBy === field) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortBy(field); setSortDir(field === 'updated' ? 'asc' : 'asc'); }
  }

  const sortIcon = field => sortBy === field ? (sortDir === 'asc' ? ' ↑' : ' ↓') : '';
  const hasFilters = search || filterOwner !== 'all' || filterSentiment !== 'all' || filterStatus !== 'all';

  return (
    <div>
      <div className="stats-row">
        <div className="stat-card" style={{cursor:'default'}}>
          <div className="stat-label">Total</div>
          <div className="stat-value">{stats.total}</div>
        </div>
        <div className={`stat-card green ${filterSentiment==='Green'?'active':''}`}
          onClick={() => setFilterSentiment(filterSentiment==='Green'?'all':'Green')}>
          <div className="stat-label">Green</div>
          <div className="stat-value">{stats.green}</div>
        </div>
        <div className={`stat-card yellow ${filterSentiment==='Yellow'?'active':''}`}
          onClick={() => setFilterSentiment(filterSentiment==='Yellow'?'all':'Yellow')}>
          <div className="stat-label">Yellow</div>
          <div className="stat-value">{stats.yellow}</div>
        </div>
        {stats.red > 0 && <div className={`stat-card red ${filterSentiment==='Red'?'active':''}`}
          onClick={() => setFilterSentiment(filterSentiment==='Red'?'all':'Red')}>
          <div className="stat-label">Red</div>
          <div className="stat-value">{stats.red}</div>
        </div>}
        <div className={`stat-card orange ${filterStatus==='issues'?'active':''}`}
          onClick={() => setFilterStatus(filterStatus==='issues'?'all':'issues')}>
          <div className="stat-label">Issues</div>
          <div className="stat-value">{stats.issues}</div>
        </div>
        <div className={`stat-card red ${filterStatus==='stale'?'active':''}`}
          onClick={() => setFilterStatus(filterStatus==='stale'?'all':'stale')}>
          <div className="stat-label">Stale</div>
          <div className="stat-value">{stats.stale}</div>
        </div>
        <div className={`stat-card blue ${filterStatus==='alerts'?'active':''}`}
          onClick={() => setFilterStatus(filterStatus==='alerts'?'all':'alerts')}>
          <div className="stat-label">Flagged</div>
          <div className="stat-value">{stats.alerts}</div>
        </div>
        {stats.endingSoon > 0 && <div className={`stat-card yellow ${filterStatus==='endingSoon'?'active':''}`}
          onClick={() => setFilterStatus(filterStatus==='endingSoon'?'all':'endingSoon')}>
          <div className="stat-label">≤6mo End</div>
          <div className="stat-value">{stats.endingSoon}</div>
        </div>}
      </div>

      <div className="filter-bar">
        <input type="text" placeholder="Search customer, LOB, owner..." value={search} onChange={e => setSearch(e.target.value)} />
        <select value={filterOwner} onChange={e => setFilterOwner(e.target.value)}>
          <option value="all">All Owners</option>
          {owners.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
        <select value={filterSentiment} onChange={e => { setFilterSentiment(e.target.value); }}>
          <option value="all">All Sentiment</option>
          <option value="Green">Green</option>
          <option value="Yellow">Yellow</option>
          <option value="Red">Red</option>
        </select>
        <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
          <option value="all">All Status</option>
          <option value="stale">Off cadence</option>
          <option value="issues">Has Issues</option>
          <option value="alerts">Manager Flags</option>
          <option value="renewal">Renewal ≤9mo</option>
          <option value="endingSoon">Contract ≤6mo</option>
        </select>
        {hasFilters && <span className="clear-link" onClick={() => { setSearch(''); setFilterOwner('all'); setFilterSentiment('all'); setFilterStatus('all'); }}>× Clear</span>}
      </div>

      <div className="table-wrap">
        <table>
          <thead>
            <tr>
              <th><button onClick={() => toggleSort('customer')}>Customer{sortIcon('customer')}</button></th>
              <th><button onClick={() => toggleSort('owner')}>Owner{sortIcon('owner')}</button></th>
              <th><button onClick={() => toggleSort('sentiment')}>Sentiment{sortIcon('sentiment')}</button></th>
              <th>Operations</th>
              <th><button onClick={() => toggleSort('updated')}>Updated{sortIcon('updated')}</button></th>
              <th><button onClick={() => toggleSort('contractEnd')}>Contract End{sortIcon('contractEnd')}</button></th>
              <th>Flags</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {filtered.map((row, idx) => {
              // find original index for flags
              const origIdx = data.indexOf(row);
              const sections = allSections[origIdx];
              const flags = allFlags[origIdx];
              const isExpanded = expandedRow === origIdx;
              const hasAlerts = flags.some(f => f.type === 'alert');
              const hasWarns = flags.some(f => f.type === 'warn');
              return (
                <React.Fragment key={row.lob || idx}>
                  <tr className={`data-row${isExpanded ? ' expanded' : ''}`}
                    onClick={() => setExpandedRow(isExpanded ? null : origIdx)}>
                    <td>
                      <div className="customer-name">{row.customer}</div>
                      <div className="lob-code">{row.lob}</div>
                    </td>
                    <td><div className="owner-name">{row.owner}</div></td>
                    <td><StatusBadge status={row.sentiment} /></td>
                    <td><StatusBadge status={row.operations} /></td>
                    <td>
                      <div style={{fontSize:'0.78rem', color:'var(--text2)', marginBottom:'3px'}}>{formatDate(row.updated)}</div>
                      {row.updated && <DateBadge val={row.updated} />}
                    </td>
                    <td>
                      {row.contractEnd
                        ? <><div style={{fontSize:'0.78rem', color: isWithin6Months(row.contractEnd)||isContractExpired(row.contractEnd) ? 'var(--yellow)' : 'var(--text2)', marginBottom:'3px', fontWeight: isWithin6Months(row.contractEnd)||isContractExpired(row.contractEnd) ? 500 : 400}}>{formatDate(row.contractEnd)}</div>
                           <ContractEndBadge val={row.contractEnd} /></>
                        : <span style={{color:'var(--text3)', fontSize:'0.78rem'}}>—</span>}
                    </td>
                    <td>
                      <div className="flags">
                        {sections.issues && <span className="flag flag-issue">Issues</span>}
                        {sections.within9mo?.toLowerCase().includes('yes') && <span className="flag flag-renewal">≤9mo</span>}
                        {(sections.renewalFeedback || '').toLowerCase().match(/cancel|non-renewal|not renewing/) && <span className="flag flag-cancel">Cancel</span>}
                        {hasAlerts && <span className="flag flag-stale">⚑ Alert</span>}
                        {!hasAlerts && hasWarns && <span className="flag" style={{background:'var(--yellow-bg)',color:'var(--yellow)'}}>△ Warn</span>}
                        {notes.getNote(row.lob) && <span className="flag" style={{background:'var(--blue-bg)',color:'var(--blue)'}}>📝</span>}
                      </div>
                    </td>
                    <td style={{color:'var(--text3)', fontSize:'0.8rem'}}>{isExpanded ? '▲' : '▼'}</td>
                  </tr>
                  {isExpanded && (
                    <tr className="expand-row">
                      <td colSpan={8}>
                        <ExpandedRow row={row} notes={notes} />
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
        <div className="table-footer">Showing {filtered.length} of {data.length} accounts</div>
      </div>
    </div>
  );
}

// ── Monday morning view ────────────────────────────────────────────────────

function MondayView({ data, notes }) {
  const allSections = useMemo(() => data.map(r => parseStatus(r.status)), [data]);
  const allFlags = useMemo(() => data.map((r,i) => analyzeAccount(r, allSections[i])), [data, allSections]);

  const staleByOwner = useMemo(() => {
    const map = {};
    data.forEach((r, i) => {
      if (isStale(r.updated)) {
        if (!map[r.owner]) map[r.owner] = [];
        map[r.owner].push({ row: r, days: daysAgo(r.updated) });
      }
    });
    return Object.entries(map).sort((a,b) => a[0].localeCompare(b[0]));
  }, [data]);

  const actionItems = useMemo(() => {
    const items = [];
    data.forEach((r, i) => {
      if (r.sentiment !== 'Green' || r.operations !== 'Green') {
        const s = allSections[i];
        const flags = allFlags[i];
        items.push({ row: r, sections: s, flags: flags.filter(f => f.type === 'alert'), allFlags: flags });
      }
    });
    // Sort: Red first, then Yellow
    items.sort((a,b) => {
      const sentOrd = {Red:0,Yellow:1,Green:2};
      const aOrd = Math.min(sentOrd[a.row.sentiment]??2, sentOrd[a.row.operations]??2);
      const bOrd = Math.min(sentOrd[b.row.sentiment]??2, sentOrd[b.row.operations]??2);
      return aOrd - bOrd;
    });
    return items;
  }, [data, allSections, allFlags]);

  const renewalItems = useMemo(() => {
    return data.filter((_,i) => allSections[i].within9mo?.toLowerCase().includes('yes'))
      .map((r,_) => ({ row: r, sections: allSections[data.indexOf(r)] }));
  }, [data, allSections]);

  const contractEndingSoon = useMemo(() => {
    return data
      .filter(r => isWithin6Months(r.contractEnd) || isContractExpired(r.contractEnd))
      .map(r => ({ row: r, sections: allSections[data.indexOf(r)], days: daysUntilContract(r.contractEnd) }))
      .sort((a, b) => (daysUntilContract(a.row.contractEnd) ?? 999) - (daysUntilContract(b.row.contractEnd) ?? 999));
  }, [data, allSections]);

  return (
    <div>
      <div style={{marginBottom:'1rem', padding:'0.75rem 1rem', background:'var(--surface)', border:'1px solid var(--border)', borderRadius:'8px', fontSize:'0.82rem', color:'var(--text2)'}}>
        Monday quick-scan — {data.length} total accounts across {[...new Set(data.map(d=>d.owner))].length} CSDMs
        {staleByOwner.length > 0 && <span style={{color:'var(--red)', marginLeft:'1rem'}}>⚑ {staleByOwner.reduce((n,[,a])=>n+a.length,0)} accounts not updated last week</span>}
        {actionItems.length > 0 && <span style={{color:'var(--yellow)', marginLeft:'1rem'}}>△ {actionItems.length} non-green account{actionItems.length !== 1 ? 's' : ''}</span>}
      </div>

      <div className="monday-wrap">
        {/* Stale updates by owner */}
        <div className="monday-section">
          <div className="monday-section-header">
            <span className="monday-section-title" style={{color:'var(--red)'}}>⏰ Missed Thursday Updates</span>
            <span style={{fontSize:'0.72rem', color:'var(--text3)', fontFamily:'var(--mono)'}}>{staleByOwner.reduce((n,[,a])=>n+a.length,0)} accounts</span>
          </div>
          {staleByOwner.length === 0
            ? <div className="monday-empty" style={{color:'var(--green)'}}>✓ All accounts updated this week</div>
            : staleByOwner.map(([owner, items]) => (
              <div key={owner}>
                <div style={{padding:'0.45rem 1rem', background:'var(--surface3)', fontSize:'0.72rem', fontFamily:'var(--mono)', color:'var(--text3)', borderTop:'1px solid var(--border)'}}>
                  {owner} — {items.length} account{items.length>1?'s':''}
                </div>
                {items.map(({row, days}) => (
                  <div key={row.lob} className="monday-row">
                    <StatusBadge status={row.sentiment} />
                    <div className="monday-row-main">
                      <div className="monday-row-customer">{row.customer}</div>
                      <div className="monday-row-meta">{row.lob} · last updated {formatDate(row.updated)} ({days}d ago)</div>
                    </div>
                  </div>
                ))}
              </div>
            ))
          }
        </div>

        {/* Action items */}
        <div className="monday-section">
          <div className="monday-section-header">
            <span className="monday-section-title" style={{color:'var(--yellow)'}}>△ Needs Your Attention</span>
            <span style={{fontSize:'0.72rem', color:'var(--text3)', fontFamily:'var(--mono)'}}>{actionItems.length} accounts</span>
          </div>
          {actionItems.length === 0
            ? <div className="monday-empty" style={{color:'var(--green)'}}>✓ No major issues flagged</div>
            : actionItems.map(({row, sections, flags, allFlags: af}) => (
              <div key={row.lob} className="monday-row">
                <div style={{display:'flex', flexDirection:'column', gap:'3px', flexShrink:0}}>
                  <div style={{display:'flex', alignItems:'center', gap:'4px'}}>
                    <span style={{fontSize:'0.62rem', color:'var(--text3)', fontFamily:'var(--mono)', width:'26px'}}>SENT</span>
                    <StatusBadge status={row.sentiment} />
                  </div>
                  <div style={{display:'flex', alignItems:'center', gap:'4px'}}>
                    <span style={{fontSize:'0.62rem', color:'var(--text3)', fontFamily:'var(--mono)', width:'26px'}}>OPS</span>
                    <StatusBadge status={row.operations} />
                  </div>
                </div>
                <div className="monday-row-main">
                  <div className="monday-row-customer">{row.customer} <span style={{fontSize:'0.72rem', color:'var(--text3)'}}>{row.owner}</span></div>
                  {sections.issues && <div className="monday-row-sub" style={{color:'var(--yellow)'}}>{sections.issues.substring(0,120)}{sections.issues.length>120?'…':''}</div>}
                  {flags.map((f,i) => (
                    <div key={i} className="monday-row-meta" style={{color:'var(--red)'}}>⚑ {f.msg}</div>
                  ))}
                  {af.filter(f=>f.type==='warn').map((f,i) => (
                    <div key={i} className="monday-row-meta" style={{color:'var(--yellow)'}}>△ {f.msg}</div>
                  ))}
                </div>
              </div>
            ))
          }
        </div>

        {/* Contracts ending within 6 months */}
        {contractEndingSoon.length > 0 && (
          <div className="monday-section" style={{gridColumn: contractEndingSoon.length > 3 ? '1/-1' : 'auto'}}>
            <div className="monday-section-header">
              <span className="monday-section-title" style={{color:'var(--orange)'}}>📅 Contract End ≤ 6 Months</span>
              <span style={{fontSize:'0.72rem', color:'var(--text3)', fontFamily:'var(--mono)'}}>{contractEndingSoon.length} accounts</span>
            </div>
            {contractEndingSoon.map(({row, sections, days}) => {
              const expired = days !== null && days < 0;
              return (
                <div key={row.lob} className="monday-row">
                  <div style={{display:'flex', flexDirection:'column', gap:'3px', flexShrink:0, alignItems:'center'}}>
                    <StatusBadge status={row.sentiment} />
                    <ContractEndBadge val={row.contractEnd} />
                  </div>
                  <div className="monday-row-main">
                    <div className="monday-row-customer">
                      {row.customer}
                      <span style={{fontSize:'0.72rem', color:'var(--text3)', marginLeft:'0.4rem'}}>{row.owner}</span>
                    </div>
                    <div className="monday-row-meta" style={{color: expired ? 'var(--red)' : 'var(--yellow)'}}>
                      {expired ? '⚑ Contract expired ' : '⏳ Ends '}{formatDate(row.contractEnd)}
                      {!expired && ` — ${days}d remaining`}
                    </div>
                    {sections.renewalFeedback && <div className="monday-row-sub">{sections.renewalFeedback.substring(0,100)}</div>}
                    {sections.renewalNextSteps && <div className="monday-row-meta" style={{color:'var(--blue)'}}>Next: {sections.renewalNextSteps.substring(0,100)}</div>}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* CSDM-flagged renewals (within9mo = yes in status) */}
        {renewalItems.length > 0 && (
          <div className="monday-section" style={{gridColumn: renewalItems.length > 3 ? '1/-1' : 'auto'}}>
            <div className="monday-section-header">
              <span className="monday-section-title" style={{color:'var(--orange)'}}>⚑ CSDM-Flagged Renewal ≤ 9 Months</span>
              <span style={{fontSize:'0.72rem', color:'var(--text3)', fontFamily:'var(--mono)'}}>{renewalItems.length} accounts</span>
            </div>
            {renewalItems.map(({row, sections}) => (
              <div key={row.lob} className="monday-row">
                <div style={{display:'flex', flexDirection:'column', gap:'3px', flexShrink:0, alignItems:'center'}}>
                  <StatusBadge status={row.sentiment} />
                  {row.contractEnd && <ContractEndBadge val={row.contractEnd} />}
                </div>
                <div className="monday-row-main">
                  <div className="monday-row-customer">{row.customer} <span style={{fontSize:'0.72rem', color:'var(--text3)'}}>{row.owner}</span></div>
                  {row.contractEnd && <div className="monday-row-meta" style={{color:'var(--text2)'}}>Contract end: {formatDate(row.contractEnd)}</div>}
                  {sections.renewalFeedback && <div className="monday-row-sub">{sections.renewalFeedback.substring(0,100)}</div>}
                  {sections.renewalNextSteps && <div className="monday-row-meta" style={{color:'var(--blue)'}}>Next: {sections.renewalNextSteps.substring(0,100)}</div>}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ── Export modal ───────────────────────────────────────────────────────────

function ExportModal({ data, notes, onClose }) {
  const today = new Date().toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'});
  const [copied, setCopied] = useState(null);
  const [preview, setPreview] = useState(null);

  const ownerMap = useMemo(() => {
    const m = {};
    data.forEach(r => {
      if (!r.owner) return;
      if (!m[r.owner]) m[r.owner] = [];
      m[r.owner].push(r);
    });
    return Object.entries(m).sort((a,b) => a[0].localeCompare(b[0]));
  }, [data]);

  function copy(owner, accounts) {
    const text = generateExport(owner, accounts, notes.notes, today);
    navigator.clipboard.writeText(text).then(() => {
      setCopied(owner);
      setTimeout(() => setCopied(null), 2000);
    });
  }

  function copyAll() {
    const text = ownerMap.map(([o, accts]) => generateExport(o, accts, notes.notes, today)).join('\n\n');
    navigator.clipboard.writeText(text).then(() => {
      setCopied('__all__');
      setTimeout(() => setCopied(null), 2000);
    });
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-header">
          <h2>Export for OneNote</h2>
          <button className="btn btn-ghost" onClick={onClose}>✕ Close</button>
        </div>
        <div className="modal-body">
          <div style={{marginBottom:'1rem'}}>
            <div style={{background:'var(--surface2)', border:'1px solid var(--border)', borderRadius:'8px', padding:'0.875rem 1rem', display:'flex', alignItems:'center', justifyContent:'space-between', gap:'1rem'}}>
              <div>
                <div style={{fontWeight:500, color:'var(--text)'}}>All Owners</div>
                <div style={{fontSize:'0.75rem', color:'var(--text2)', marginTop:'2px'}}>{ownerMap.length} owners · {data.length} accounts · Includes manager analysis & flags</div>
              </div>
              <button className="btn btn-export" onClick={copyAll}>
                {copied==='__all__' ? '✓ Copied!' : '⎘ Copy All'}
              </button>
            </div>
          </div>
          {ownerMap.map(([owner, accounts]) => {
            const ySentiment = accounts.filter(a => a.sentiment !== 'Green').length;
            const stale = accounts.filter(a => isStale(a.updated)).length;
            const issueCount = accounts.filter(a => parseStatus(a.status).issues).length;
            return (
              <div key={owner} className="export-owner-row">
                <div className="export-owner-info">
                  <div className="export-owner-name">{owner}</div>
                  <div className="export-owner-meta">
                    <span>{accounts.length} accounts</span>
                    {ySentiment > 0 && <span style={{color:'var(--yellow)'}}>△ {ySentiment} non-green</span>}
                    {stale > 0 && <span style={{color:'var(--red)'}}>⏰ {stale} stale</span>}
                    {issueCount > 0 && <span style={{color:'var(--orange)'}}>⚑ {issueCount} w/ issues</span>}
                  </div>
                </div>
                <div className="export-actions">
                  <button className="btn btn-ghost" style={{fontSize:'0.78rem'}}
                    onClick={() => setPreview(preview === owner ? null : owner)}>
                    {preview === owner ? 'Hide' : 'Preview'}
                  </button>
                  <button className="btn btn-export" style={{fontSize:'0.78rem'}}
                    onClick={() => copy(owner, accounts)}>
                    {copied === owner ? '✓ Copied!' : '⎘ Copy'}
                  </button>
                </div>
              </div>
            );
          })}
          {preview && (() => {
            const [,accounts] = ownerMap.find(([o]) => o === preview) || [];
            if (!accounts) return null;
            return <div className="preview-box">{generateExport(preview, accounts, notes.notes, today)}</div>;
          })()}
        </div>
      </div>
    </div>
  );
}

// ── File uploader ──────────────────────────────────────────────────────────

function FileUploader({ onLoaded }) {
  const [drag, setDrag] = useState(false);
  const [error, setError] = useState(null);

  function handleFile(file) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.csv')) { setError('Please upload a CSV file'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const result = Papa.parse(e.target.result, { header: true, skipEmptyLines: true });
        const rows = result.data.map(normalizeRow).filter(r => r.lob || r.customer);
        if (!rows.length) { setError('No valid rows found in CSV'); return; }
        onLoaded(rows, file.name);
      } catch(err) { setError('Parse error: ' + err.message); }
    };
    reader.readAsText(file, 'windows-1252');
  }

  return (
    <div className="upload-screen">
      <div className="upload-card">
        <h1>LOB Dashboard</h1>
        <p className="subtitle">Upload your weekly ServiceNow CSV export</p>
        <div className={`drop-zone${drag ? ' drag' : ''}`}
          onDragOver={e => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)}
          onDrop={e => { e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); }}
          onClick={() => document.getElementById('fileInput').click()}>
          <div className="icon">⬆</div>
          <p><strong>Drop CSV here</strong> or click to browse</p>
          <p style={{marginTop:'0.4rem', fontSize:'0.78rem'}}>u_sso_lob_details export from ServiceNow</p>
          <input id="fileInput" type="file" accept=".csv" style={{display:'none'}} onChange={e => handleFile(e.target.files[0])} />
        </div>
        {error && <div className="error-box">{error}</div>}
      </div>
    </div>
  );
}

// ── App root ───────────────────────────────────────────────────────────────

function App() {
  const [data, setData] = useState(null);
  const [fileName, setFileName] = useState('');
  const [tab, setTab] = useState('monday');
  const [showExport, setShowExport] = useState(false);
  const notes = useNotes();

  if (!data) return <FileUploader onLoaded={(d, name) => { setData(d); setFileName(name); }} />;

  const allSections = data.map(r => parseStatus(r.status));
  const allFlags = data.map((r,i) => analyzeAccount(r, allSections[i]));
  const staleCount = data.filter(d => isStale(d.updated)).length;
  const attnCount = data.filter(r => r.sentiment !== 'Green' || r.operations !== 'Green').length;
  const flaggedCount = allFlags.filter(f => f.some(x => x.type === 'alert')).length;
  const noDateCol = data.every(d => !d.updated);

  return (
    <div className="app">
      {showExport && <ExportModal data={data} notes={notes} onClose={() => setShowExport(false)} />}
      <div className="topbar">
        <div className="topbar-left">
          <span className="brand">LOB Dashboard</span>
          <span className="file-chip">{fileName}</span>
        </div>
        <div className="topbar-right">
          <button className="btn btn-export" onClick={() => setShowExport(true)}>⬆ Export for OneNote</button>
          <button className="btn btn-ghost" onClick={() => setData(null)}>New File</button>
        </div>
      </div>

      {noDateCol && (
        <div style={{background:'var(--yellow-bg)', borderBottom:'1px solid var(--yellow-border)', padding:'0.5rem 1.5rem', fontSize:'0.8rem', color:'var(--yellow)', display:'flex', alignItems:'center', gap:'0.5rem'}}>
          <span>⚠</span>
          <span><strong>No update date column found.</strong> Add <code style={{fontFamily:'var(--mono)', fontSize:'0.75rem'}}>sys_updated_on</code> to your ServiceNow export to enable cadence tracking (Wed/Thu check).</span>
        </div>
      )}

      <div>
        <div className="tab-nav">
          <div className={`tab${tab==='monday'?' active':''}`} onClick={() => setTab('monday')}>
            Monday View
            {staleCount > 0 && <span className="badge badge-alert">{staleCount}</span>}
            {staleCount === 0 && attnCount > 0 && <span className="badge badge-warn">{attnCount}</span>}
          </div>
          <div className={`tab${tab==='table'?' active':''}`} onClick={() => setTab('table')}>
            All Accounts
            <span className="badge">{data.length}</span>
          </div>
        </div>

        <div className="content">
          {tab === 'monday' && <MondayView data={data} notes={notes} />}
          {tab === 'table' && <TableView data={data} notes={notes} />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
